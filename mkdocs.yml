site_name: Tang's Notebook
site_url: https://tangzzycc.github.io/
site_description: AI 基础设施与 GPU 计算的原理和工程实践笔记
copyright: "© 2026 Tang's Notebook"

docs_dir: docs
site_dir: site
use_directory_urls: true
# 本地参考网页与归档笔记不参与站点构建。
exclude_docs: |
  ai-infra/*知乎.html
  rocm/*知乎.html
  assets/archive/**
watch:
  - assets

validation:
  links:
    # 图片位于仓库根目录，构建钩子会将其复制到站点根路径。
    absolute_links: relative_to_docs
    not_found: ignore

nav:
  - Tang's Notebook: index.md
  - AI Infra:
      - 学习索引: ai-infra/index.md
      - Attention:
          - Dense Attention：MHA、GQA、MQA 与 MLA: ai-infra/LLM主流模型结构之Dense Attention.md
          - Sparse Attention：SWA 与 DSA: ai-infra/LLM主流模型结构之Sparse Attention.md
          - Recurrent / Linear Attention：GDN、KDA 与 Mamba-2: ai-infra/LLM主流模型结构之Recurrent-Linear Attention.md
      - PD 分离推理架构详解: ai-infra/PD分离推理架构详解.md
      - vLLM 推理框架:
          - vLLM Model Runner V2 架构: ai-infra/vLLM Model Runner V2 架构.md
          - vLLM Multi-LoRA 推理: ai-infra/vLLM Multi-LoRA推理.md
      - Speculative Decoding:
          - Speculative Decoding 之 DFlash 与 DSpark: ai-infra/DFlash与DSpark.md
  - CUDA:
      - 学习索引: cuda/index.md
      - CUDA 矩阵乘法优化：逐步接近 cuBLAS 性能: cuda/CUDA矩阵乘法优化：从Naive到cuBLAS.md
      - NCU性能分析与Kernel调优:
          - 合并访存与缓存: cuda/合并访存与缓存.md
          - Occupancy 与 Warp 调度: cuda/Occupancy与Warp调度.md
          - 矩阵转置与访存优化: cuda/矩阵转置与访存优化.md
          - NCU 性能分析与 Roofline: cuda/NCU性能分析与Roofline.md
      - FlashAttention v1 & v2 浅析: cuda/FlashAttention.md
  - ROCm:
      - 学习索引: rocm/index.md
      - RDNA3.5架构与HIP编程: rocm/RDNA3.5架构与HIP编程.md
  - Tags: tags/index.md
theme:
  name: material
  custom_dir: overrides
  language: zh
  # 字体由 stylesheets/extra.css 从本地资源加载。
  font: false
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - tags
  - search:
      lang:
        - zh
        - en
      separator: '[\\s\\u200b\\-]'

hooks:
  - scripts/tag_cloud.py
  - scripts/search_visibility.py
  - scripts/gemm_translation_toc.py

extra_css:
  - stylesheets/extra.css?v=34
  - stylesheets/notebook-theme.css?v=13
  - stylesheets/home.css?v=34
  - stylesheets/interview-notes.css?v=2
  - stylesheets/study-notes.css?v=3
  - stylesheets/gemm-translation.css?v=5

extra_javascript:
  - javascripts/header-search.js
  - javascripts/mathjax.js?v=2
  - javascripts/code-mark.js
  - javascripts/sidebar-toggle.js?v=8
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
