site_name: Tang's Notebook
site_description: AI Infra、vLLM 与工程实践笔记

docs_dir: docs
site_dir: site
use_directory_urls: true
watch:
  - assets

validation:
  links:
    # 图片位于仓库根目录，构建钩子会将其复制到站点根路径。
    absolute_links: relative_to_docs
    not_found: ignore

