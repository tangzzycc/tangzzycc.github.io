theme:
  name: material
  custom_dir: overrides
  language: zh
  # 字体由 stylesheets/extra.css 从本地资源加载。
  font: false
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\\s\\u200b\\-]'

extra_css:
  - stylesheets/extra.css?v=20
  - stylesheets/notebook-theme.css?v=4
  - stylesheets/home.css?v=3
  - stylesheets/interview-notes.css?v=2
  - stylesheets/study-notes.css?v=3
  - stylesheets/gemm-translation.css?v=3
  - stylesheets/gpu-operators.css?v=4

extra_javascript:
  - javascripts/header-search.js
  - javascripts/mathjax.js
  - javascripts/code-fold.js
  - javascripts/code-mark.js
  - javascripts/sidebar-toggle.js?v=5
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
