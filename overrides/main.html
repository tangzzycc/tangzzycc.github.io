{% extends "base.html" %}

{# 全站不收录到搜索引擎，允许抓取以便识别 noindex。 #}
{% block extrahead %}
  {{ super() }}
  <meta name="robots" content="noindex">
  {% if page and page.meta.code_fold is sameas false %}
    <meta name="notebook-code-fold" content="false">
  {% endif %}
{% endblock %}

{# 模块导航已并入页头，移除原来的第二行标签栏。 #}
{% block tabs %}{% endblock %}
