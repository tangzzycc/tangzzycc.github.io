<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FlyDSL 编译与执行边界</title><desc id="desc">Python 调用经过 JIT specialization、AST Rewrite、MLIR lowering 和 fatbin 生成，在 Stream 上启动 AMDGPU Kernel。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.3" refY="3" orient="auto"><path d="M.4 .6 5.1 3 .4 5.4" fill="none" stroke="#346d9e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"Noto Sans CJK SC",lxgw;src:url("../../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC",lxgw,sans-serif;fill:#18324a}.title{font-size:40px;font-weight:700}.sub{font-size:20px;fill:#607387}.ey{font-size:18px;font-weight:700;fill:#3473aa}.head{font-size:23px;font-weight:700}.body{font-size:17px;fill:#4d6479}.small{font-size:15px;fill:#607387}.mono{font-family:"Noto Sans Mono CJK SC",Consolas,monospace;font-size:16px}.card{fill:#fff;stroke:#cbd8e4;stroke-width:1.5}.blue{fill:#e8f2fb;stroke:#9fc1df}.green{fill:#e8f6f0;stroke:#9ccdb9}.purple{fill:#f1ecf8;stroke:#c7b3db}.orange{fill:#fff0e1;stroke:#dfbc95}.flow{fill:none;stroke:#346d9e;stroke-width:1.7;marker-end:url(#a)}</style>
  <rect width="1600" height="900" fill="#fbfcfe"/><rect x="48" y="36" width="6" height="40" rx="3" fill="#e96648"/><text x="72" y="68" class="title">FlyDSL：同一份 Python，两个执行世界</text><text x="48" y="108" class="sub">JIT 侧构造专用程序并启动；Kernel 侧描述每个 GPU Thread 的工作。</text>
  <text x="48" y="160" class="ey">01  主机侧：Specialization 与编译</text><rect x="48" y="182" width="1504" height="292" rx="18" class="card"/>
  <g transform="translate(78 218)"><rect width="250" height="194" rx="13" class="blue"/><text x="22" y="38" class="head">Python 调用</text><text x="22" y="75" class="mono">vector_add(A,B,C)</text><text x="22" y="112" class="body">Tensor metadata</text><text x="22" y="140" class="body">Constexpr / Closure</text><text x="22" y="168" class="body">Device / Environment</text></g><path d="M328 315 H382" class="flow"/>
  <g transform="translate(394 218)"><rect width="250" height="194" rx="13" class="green"/><text x="22" y="38" class="head">JIT Specialization</text><text x="22" y="75" class="mono">@flyc.jit</text><text x="22" y="112" class="body">构造 TiledCopy</text><text x="22" y="140" class="body">确定 Grid / Block</text><text x="22" y="168" class="body">生成 Cache Key</text></g><path d="M644 315 H698" class="flow"/>
  <g transform="translate(710 218)"><rect width="250" height="194" rx="13" class="purple"/><text x="22" y="38" class="head">AST Rewrite / tracing</text><text x="22" y="75" class="mono">Python → mixed MLIR</text><text x="22" y="112" class="body">Host IR 组织 Launch</text><text x="22" y="140" class="body">Device IR 描述 Kernel</text><text x="22" y="168" class="body">静态分支在此展开</text></g><path d="M960 315 H1014" class="flow"/>
  <g transform="translate(1026 218)"><rect width="238" height="194" rx="13" class="orange"/><text x="20" y="38" class="head">Lowering</text><text x="20" y="75" class="mono">Fly → ROCDL → LLVM</text><text x="20" y="112" class="body">Layout 代数化简</text><text x="20" y="140" class="body">AMDGPU 指令选择</text><text x="20" y="168" class="body">目标架构编译</text></g><path d="M1264 315 H1318" class="flow"/>
  <g transform="translate(1330 218)"><rect width="192" height="194" rx="13" class="blue"/><text x="20" y="38" class="head">编译产物</text><text x="20" y="75" class="mono">AMDGPU fatbin</text><text x="20" y="112" class="body">Module Cache</text><text x="20" y="140" class="body">Kernel symbol</text><text x="20" y="168" class="body">Launch metadata</text></g>
  <text x="48" y="534" class="ey">02  设备侧：每个 Thread 执行相同程序，处理不同数据视图</text><rect x="48" y="556" width="1504" height="266" rx="18" class="card"/>
  <g transform="translate(78 594)"><rect width="270" height="162" rx="13" class="blue"/><text x="22" y="38" class="head">KernelLauncher</text><text x="22" y="75" class="mono">.launch(grid, block)</text><text x="22" y="112" class="body">绑定 Stream 与 LDS 大小</text><text x="22" y="140" class="body">Host 只负责启动</text></g><path d="M348 675 H414" class="flow"/>
  <g transform="translate(426 594)"><rect width="286" height="162" rx="13" class="green"/><text x="22" y="38" class="head">Grid / Workgroup</text><text x="22" y="75" class="mono">block_idx / thread_idx</text><text x="22" y="112" class="body">选择当前 Tile</text><text x="22" y="140" class="body">切出当前 Thread 的视图</text></g><path d="M712 675 H778" class="flow"/>
  <g transform="translate(790 594)"><rect width="286" height="162" rx="13" class="purple"/><text x="22" y="38" class="head">Register 计算</text><text x="22" y="75" class="mono">GMEM → VGPR → GMEM</text><text x="22" y="112" class="body">Vector Add / MFMA</text><text x="22" y="140" class="body">Predicate 保护边界</text></g><path d="M1076 675 H1142" class="flow"/>
  <g transform="translate(1154 594)"><rect width="368" height="162" rx="13" class="orange"/><text x="22" y="38" class="head">最终效果</text><text x="22" y="75" class="mono">C = A + B</text><text x="22" y="112" class="body">所有 Thread 的局部结果共同覆盖完整 Tensor</text><text x="22" y="140" class="body">Kernel 完成后由 Stream 保证执行顺序</text></g>
  <rect x="194" y="844" width="1212" height="34" rx="17" fill="#f0f4f8"/><text x="800" y="867" text-anchor="middle" class="small">Cache 命中复用编译产物；Shape、Dtype、Layout、Toolchain 或环境改变时可能产生新的 specialization。</text>
</svg>
