<svg width="1000" height="440" role="img" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg"><style>
.d-text { font-family: 'Noto Sans CJK SC', 'IBM Plex Sans', 'Noto Sans', sans-serif; font-size: 11px; fill: #ecf1f7; }
.d-text.mono { font-family: 'Noto Sans Mono CJK SC', 'JetBrains Mono', 'Noto Sans Mono', monospace; font-size: 10.5px; }
.d-text.small { font-size: 9.5px; fill: #92a8bc; }
.d-text.tiny { font-size: 8.5px; fill: #6a8298; }
.d-text.label { font-family: 'Noto Sans Mono CJK SC', 'JetBrains Mono', 'Noto Sans Mono', monospace; font-size: 9px; letter-spacing: 0.12em; fill: #6a8298; text-transform: uppercase; }
.d-text.title { font-family: 'Noto Serif CJK SC', 'EB Garamond', 'Noto Serif', serif; font-style: italic; font-size: 13px; fill: #ecf1f7; }
.d-text.rust { fill: #e8845a; } .d-text.brass { fill: #f0c764; } .d-text.jade { fill: #8ec788; }
.d-text.coral { fill: #e07a7a; } .d-text.teal { fill: #6dc0c7; } .d-text.dim { fill: #92a8bc; }
.zone { fill: #154362; stroke: #2a6791; stroke-width: 1; }
.zone.deep { fill: #1b537a; } .zone.rust { stroke: #e8845a; stroke-opacity: 0.5; }
.zone.brass { stroke: #f0c764; stroke-opacity: 0.5; } .zone.jade { stroke: #8ec788; stroke-opacity: 0.45; }
.zone.coral { stroke: #e07a7a; stroke-opacity: 0.45; } .zone.teal { stroke: #6dc0c7; stroke-opacity: 0.45; }
.bp-line { stroke: #6a8298; stroke-width: 1; fill: none; }
.bp-line.dash { stroke-dasharray: 3 3; } .bp-line.rust { stroke: #e8845a; } .bp-line.brass { stroke: #f0c764; }
.bp-line.jade { stroke: #8ec788; } .bp-line.teal { stroke: #6dc0c7; } .bp-line.thick { stroke-width: 1.6; }
</style><rect width="100%" height="100%" fill="#0a2840"/>
  <text x="20" y="32" class="d-text label">Block Tile C · 64 × 64 · 单 Block GEMM</text>

  <!-- The 64x64 C tile, broken into a 2x2 wave grid, each wave doing 2x2 atom repeats of 16x16 -->
  <g transform="translate(40, 60)">
    <!-- Wave 0: top-left, 32x32 -->
    <rect x="0" y="0" width="160" height="160" fill="#e8845a" fill-opacity="0.18" stroke="#e8845a" stroke-width="1.6"/>
    <text x="80" y="-8" class="d-text small mono" text-anchor="middle">N : 0 → 32</text>
    <text x="-12" y="84" class="d-text small mono" text-anchor="middle" transform="rotate(-90, -12, 84)">M : 0 → 32</text>
    <!-- 2x2 atom subdivision within wave 0 -->
    <g stroke="#e8845a" stroke-opacity="0.6" stroke-dasharray="3 3" fill="none">
      <line x1="80" y1="0" x2="80" y2="160"/>
      <line x1="0" y1="80" x2="160" y2="80"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="9" fill="#e8845a">
      <text x="40" y="46" text-anchor="middle">atom</text>
      <text x="40" y="58" text-anchor="middle">(0,0)</text>
      <text x="120" y="46" text-anchor="middle">atom</text>
      <text x="120" y="58" text-anchor="middle">(0,1)</text>
      <text x="40" y="126" text-anchor="middle">atom</text>
      <text x="40" y="138" text-anchor="middle">(1,0)</text>
      <text x="120" y="126" text-anchor="middle">atom</text>
      <text x="120" y="138" text-anchor="middle">(1,1)</text>
    </g>
    <text x="80" y="96" class="d-text title rust" text-anchor="middle">wave 0</text>

    <!-- Wave 1: top-right, 32x32 -->
    <rect x="160" y="0" width="160" height="160" fill="#f0c764" fill-opacity="0.16" stroke="#f0c764" stroke-width="1.6"/>
    <text x="240" y="-8" class="d-text small mono" text-anchor="middle">N : 32 → 64</text>
    <g stroke="#f0c764" stroke-opacity="0.6" stroke-dasharray="3 3" fill="none">
      <line x1="240" y1="0" x2="240" y2="160"/>
      <line x1="160" y1="80" x2="320" y2="80"/>
    </g>
    <text x="240" y="96" class="d-text title brass" text-anchor="middle">wave 2</text>

    <!-- Wave 2: bottom-left, 32x32 -->
    <rect x="0" y="160" width="160" height="160" fill="#8ec788" fill-opacity="0.16" stroke="#8ec788" stroke-width="1.6"/>
    <text x="-12" y="244" class="d-text small mono" text-anchor="middle" transform="rotate(-90, -12, 244)">M : 32 → 64</text>
    <g stroke="#8ec788" stroke-opacity="0.5" stroke-dasharray="3 3" fill="none">
      <line x1="80" y1="160" x2="80" y2="320"/>
      <line x1="0" y1="240" x2="160" y2="240"/>
    </g>
    <text x="80" y="256" class="d-text title jade" text-anchor="middle">wave 1</text>

    <!-- Wave 3: bottom-right, 32x32 -->
    <rect x="160" y="160" width="160" height="160" fill="#6dc0c7" fill-opacity="0.16" stroke="#6dc0c7" stroke-width="1.6"/>
    <g stroke="#6dc0c7" stroke-opacity="0.5" stroke-dasharray="3 3" fill="none">
      <line x1="240" y1="160" x2="240" y2="320"/>
      <line x1="160" y1="240" x2="320" y2="240"/>
    </g>
    <text x="240" y="256" class="d-text title teal" text-anchor="middle">wave 3</text>

    <!-- Frame -->
    <rect x="0" y="0" width="320" height="320" fill="none" stroke="#ecf1f7" stroke-width="2"/>
  </g>

  <!-- Right side annotation -->
  <g transform="translate(420, 60)">
    <text x="0" y="0" class="d-text label">Wave Layout</text>
    <text x="0" y="20" class="d-text title">make_tiled_mma(atom, make_layout((2,2,1), (1,2,0)))</text>

    <text x="0" y="56" class="d-text label">MNK Shape</text>
    <text x="0" y="76" class="d-text small mono">(M=2 Waves) × (N=2 Waves) × (K=1 Wave)</text>
    <text x="0" y="92" class="d-text small mono">4 Waves × 64 Thread/Wave = 256 Thread（与 Block 一致）</text>

    <text x="0" y="124" class="d-text label">Stride · wave-id → (M, N, K)</text>
    <text x="0" y="144" class="d-text small mono">wave 0 → M=0 N=0    wave 1 → M=1 N=0</text>
    <text x="0" y="160" class="d-text small mono">wave 2 → M=0 N=1    wave 3 → M=1 N=1</text>
    <text x="0" y="180" class="d-text small mono dim">K Stride = 0 ⇒ 所有 Wave 共同沿 K 归约</text>

    <text x="0" y="216" class="d-text label">Atom 重复次数</text>
    <text x="0" y="236" class="d-text small mono">block_m / (2 · 16) = 2 atoms</text>
    <text x="0" y="252" class="d-text small mono">block_n / (2 · 16) = 2 atoms</text>
    <text x="0" y="268" class="d-text small mono">block_k / (1 · 4)  = 2 atoms</text>
    <text x="0" y="284" class="d-text small mono brass">→ 每个 Wave 的 frag_C：2×2 = 4 个 Atom Output</text>

    <text x="0" y="320" class="d-text label">每个 Lane</text>
    <text x="0" y="340" class="d-text small mono">每个 MFMA Atom 向每个 Lane 写入 4 个 fp32</text>
    <text x="0" y="356" class="d-text small mono brass">→ 4 Atoms × 4 fp32 = 每个 Lane 的 AGPR 保存 16 个 fp32</text>
  </g>
</svg>
