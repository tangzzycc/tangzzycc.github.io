<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Layout、Tensor 与 Tile 分块</title><desc id="desc">Layout 将逻辑坐标映射为线性索引，Tensor 由存储和 Layout 组成，Thread/Value Layout 把 Tile 分给各线程。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.3" refY="3" orient="auto"><path d="M.4 .6 5.1 3 .4 5.4" fill="none" stroke="#376e9f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"Noto Sans CJK SC",lxgw;src:url("../../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC",lxgw,sans-serif;fill:#18324a}.title{font-size:40px;font-weight:700}.sub{font-size:20px;fill:#607387}.ey{font-size:18px;font-weight:700;fill:#3473aa}.head{font-size:23px;font-weight:700}.body{font-size:17px;fill:#4d6479}.small{font-size:14px;fill:#607387}.mono{font-family:"Noto Sans Mono CJK SC",Consolas,monospace;font-size:16px}.card{fill:#fff;stroke:#cbd8e4;stroke-width:1.5}.flow{fill:none;stroke:#376e9f;stroke-width:1.7;marker-end:url(#a)}.cell{stroke:#9db4c9;stroke-width:1}</style>
  <rect width="1600" height="980" fill="#fbfcfe"/><rect x="48" y="36" width="6" height="40" rx="3" fill="#e96648"/><text x="72" y="68" class="title">Layout 是地址函数，分块只是重写视图</text><text x="48" y="108" class="sub">数据没有因为 Divide、Slice 或 partition 移动；变化的是 coord → index 与 Thread/Value 所有权。</text>
  <text x="48" y="158" class="ey">01  同一坐标域，不同 Stride 得到不同线性顺序</text><rect x="48" y="180" width="1504" height="300" rx="18" class="card"/>
  <g transform="translate(82 220)"><text x="0" y="0" class="head">Layout A</text><text x="0" y="34" class="mono">Shape=(4,8), Stride=(1,4)</text><text x="0" y="68" class="body">第一维连续 · Column-major 视图</text><g transform="translate(0 92)">
  <rect width="48" height="38" fill="#cfe5f7" class="cell"/><rect x="48" width="48" height="38" fill="#e8f2fb" class="cell"/><rect x="96" width="48" height="38" fill="#e8f2fb" class="cell"/><rect x="144" width="48" height="38" fill="#e8f2fb" class="cell"/><rect y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="48" y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="96" y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="144" y="38" width="48" height="38" fill="#d8eddf" class="cell"/>
  <text x="24" y="25" text-anchor="middle" class="small">0</text><text x="72" y="25" text-anchor="middle" class="small">4</text><text x="120" y="25" text-anchor="middle" class="small">8</text><text x="168" y="25" text-anchor="middle" class="small">12</text><text x="24" y="63" text-anchor="middle" class="small">1</text><text x="72" y="63" text-anchor="middle" class="small">5</text><text x="120" y="63" text-anchor="middle" class="small">9</text><text x="168" y="63" text-anchor="middle" class="small">13</text></g><text x="0" y="202" class="mono">Layout(1,2) = 1 + 2×4 = 9</text></g>
  <path d="M478 330 H552" class="flow"/><g transform="translate(566 230)"><rect width="418" height="172" rx="14" fill="#f1ecf8" stroke="#c7b3db"/><text x="24" y="42" class="head">Tensor = Storage + Layout</text><text x="24" y="82" class="body">Storage iterator 决定起点与 Address Space</text><text x="24" y="116" class="body">Layout 决定逻辑坐标如何找到 Value</text><text x="24" y="148" class="mono">tensor[m,n] → *(iter + Layout(m,n))</text></g><path d="M984 316 H1058" class="flow"/>
  <g transform="translate(1072 220)"><text x="0" y="0" class="head">Layout B</text><text x="0" y="34" class="mono">Shape=(4,8), Stride=(8,1)</text><text x="0" y="68" class="body">第二维连续 · Row-major 视图</text><g transform="translate(0 92)"><rect width="48" height="38" fill="#cfe5f7" class="cell"/><rect x="48" width="48" height="38" fill="#cfe5f7" class="cell"/><rect x="96" width="48" height="38" fill="#cfe5f7" class="cell"/><rect x="144" width="48" height="38" fill="#cfe5f7" class="cell"/><rect y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="48" y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="96" y="38" width="48" height="38" fill="#d8eddf" class="cell"/><rect x="144" y="38" width="48" height="38" fill="#d8eddf" class="cell"/><text x="24" y="25" text-anchor="middle" class="small">0</text><text x="72" y="25" text-anchor="middle" class="small">1</text><text x="120" y="25" text-anchor="middle" class="small">2</text><text x="168" y="25" text-anchor="middle" class="small">3</text><text x="24" y="63" text-anchor="middle" class="small">8</text><text x="72" y="63" text-anchor="middle" class="small">9</text><text x="120" y="63" text-anchor="middle" class="small">10</text><text x="168" y="63" text-anchor="middle" class="small">11</text></g><text x="0" y="202" class="mono">Layout(1,2) = 1×8 + 2 = 10</text></g>
  <text x="48" y="536" class="ey">02  `(8,24)` Tile：4 个 Thread，每个 Thread 每轮持有 8 个 Value</text><rect x="48" y="558" width="1504" height="348" rx="18" class="card"/>
  <g transform="translate(82 602)"><text class="head">Thread/Value 所有权表</text><text y="35" class="body">颜色表示 Thread，格内数字表示该 Thread 的 value_id。</text><g transform="translate(0 62)">
  <g fill="#d7eafb" stroke="#93b5d4"><rect width="56" height="44"/><rect x="56" width="56" height="44"/><rect x="112" width="56" height="44"/><rect x="168" width="56" height="44"/><rect x="224" width="56" height="44"/><rect x="280" width="56" height="44"/><rect x="336" width="56" height="44"/><rect x="392" width="56" height="44"/></g>
  <g transform="translate(0 44)" fill="#d9efe5" stroke="#94c4af"><rect width="56" height="44"/><rect x="56" width="56" height="44"/><rect x="112" width="56" height="44"/><rect x="168" width="56" height="44"/><rect x="224" width="56" height="44"/><rect x="280" width="56" height="44"/><rect x="336" width="56" height="44"/><rect x="392" width="56" height="44"/></g>
  <g transform="translate(0 88)" fill="#eadff5" stroke="#bea7d3"><rect width="56" height="44"/><rect x="56" width="56" height="44"/><rect x="112" width="56" height="44"/><rect x="168" width="56" height="44"/><rect x="224" width="56" height="44"/><rect x="280" width="56" height="44"/><rect x="336" width="56" height="44"/><rect x="392" width="56" height="44"/></g>
  <g transform="translate(0 132)" fill="#fde7cf" stroke="#d7ae83"><rect width="56" height="44"/><rect x="56" width="56" height="44"/><rect x="112" width="56" height="44"/><rect x="168" width="56" height="44"/><rect x="224" width="56" height="44"/><rect x="280" width="56" height="44"/><rect x="336" width="56" height="44"/><rect x="392" width="56" height="44"/></g>
  <g class="small" text-anchor="middle"><text x="28" y="28">0</text><text x="84" y="28">1</text><text x="140" y="28">2</text><text x="196" y="28">3</text><text x="252" y="28">4</text><text x="308" y="28">5</text><text x="364" y="28">6</text><text x="420" y="28">7</text><text x="28" y="72">0</text><text x="84" y="72">1</text><text x="140" y="72">2</text><text x="196" y="72">3</text><text x="252" y="72">4</text><text x="308" y="72">5</text><text x="364" y="72">6</text><text x="420" y="72">7</text><text x="28" y="116">0</text><text x="84" y="116">1</text><text x="140" y="116">2</text><text x="196" y="116">3</text><text x="252" y="116">4</text><text x="308" y="116">5</text><text x="364" y="116">6</text><text x="420" y="116">7</text><text x="28" y="160">0</text><text x="84" y="160">1</text><text x="140" y="160">2</text><text x="196" y="160">3</text><text x="252" y="160">4</text><text x="308" y="160">5</text><text x="364" y="160">6</text><text x="420" y="160">7</text></g></g><text x="464" y="91" class="body">Thread 0</text><text x="464" y="135" class="body">Thread 1</text><text x="464" y="179" class="body">Thread 2</text><text x="464" y="223" class="body">Thread 3</text></g>
  <path d="M650 730 H716" class="flow"/><g transform="translate(730 606)"><rect width="350" height="238" rx="14" fill="#eaf4fb" stroke="#9fc1df"/><text x="24" y="42" class="head">TiledCopy 重复铺设</text><text x="24" y="80" class="mono">basic Tile = (4,8)</text><text x="24" y="112" class="mono">Workgroup Tile = (8,24)</text><text x="24" y="152" class="body">M 方向重复 2 次</text><text x="24" y="181" class="body">N 方向重复 3 次</text><text x="24" y="215" class="body">共覆盖 8×24 个 Value</text></g><path d="M1080 725 H1146" class="flow"/>
  <g transform="translate(1160 606)"><rect width="360" height="238" rx="14" fill="#eaf7f1" stroke="#9ccdb9"/><text x="24" y="42" class="head">ThrCopy(tid)</text><text x="24" y="80" class="mono">partition_S(source)</text><text x="24" y="112" class="mono">partition_D(destination)</text><text x="24" y="152" class="body">只生成当前 Thread 的 Tensor 视图</text><text x="24" y="181" class="body">没有发生实际数据搬运</text><text x="24" y="215" class="body">fx.copy 才执行 Load / Store</text></g>
  <rect x="246" y="932" width="1108" height="30" rx="15" fill="#f1f5f8"/><text x="800" y="953" text-anchor="middle" class="small">Divide 决定 Tile 坐标；Slice 选择当前 Tile；partition 决定当前 Thread 在 Tile 内拥有的 Value。</text>
</svg>
