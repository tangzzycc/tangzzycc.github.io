<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">FlyDSL 三篇笔记与四个官方示例的学习顺序</title>
  <desc id="desc">先学习编程与编译边界，再掌握 Layout 和 Tile 编程，最后通过 Vector Add、Tiled Copy、TiledMma 与 Preshuffle GEMM 完成源码精读。</desc>
  <defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.3" refY="3" orient="auto"><path d="M.4 .6 5.1 3 .4 5.4" fill="none" stroke="#376e9f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"Noto Sans CJK SC",lxgw;src:url("../../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC",lxgw,sans-serif;fill:#18324a}.title{font-size:40px;font-weight:700}.sub{font-size:20px;fill:#607387}.ey{font-size:18px;font-weight:700;fill:#3473aa}.head{font-size:24px;font-weight:700}.body{font-size:17px;fill:#4d6479}.small{font-size:14px;fill:#607387}.mono{font-family:"Noto Sans Mono CJK SC",Consolas,monospace;font-size:15px}.card{fill:#fff;stroke:#cbd8e4;stroke-width:1.5}.flow{fill:none;stroke:#376e9f;stroke-width:1.7;marker-end:url(#arr)}</style>
  <rect width="1600" height="820" fill="#fbfcfe"/><rect x="48" y="36" width="6" height="40" rx="3" fill="#e96648"/><text x="72" y="68" class="title">FlyDSL 学习顺序：两篇基础，一篇完整源码精读</text><text x="48" y="108" class="sub">先建立执行模型与 Layout 语言，再沿四个官方示例逐级加入 Copy、MFMA、LDS 和 Pipeline。</text>
  <text x="48" y="160" class="ey">基础知识</text>
  <g transform="translate(48 184)"><rect width="470" height="226" rx="18" class="card"/><rect x="24" y="24" width="64" height="32" rx="16" fill="#e8f2fb"/><text x="56" y="46" text-anchor="middle" class="mono">01</text><text x="24" y="94" class="head">编程模型与编译流程</text><text x="24" y="132" class="body">GPU 执行与存储层级</text><text x="24" y="162" class="mono">@flyc.jit / @flyc.kernel</text><text x="24" y="192" class="body">Tracing → MLIR → ROCDL → fatbin</text></g>
  <path d="M518 297 H566" class="flow"/>
  <g transform="translate(578 184)"><rect width="470" height="226" rx="18" class="card"/><rect x="24" y="24" width="64" height="32" rx="16" fill="#eaf7f1"/><text x="56" y="46" text-anchor="middle" class="mono">02</text><text x="24" y="94" class="head">Layout 代数与 Tile 编程</text><text x="24" y="132" class="mono">coord → index</text><text x="24" y="162" class="body">Divide / Slice / Tensor View</text><text x="24" y="192" class="body">Thread/Value Layout 与 TiledCopy</text></g>
  <path d="M1048 297 H1096" class="flow"/>
  <g transform="translate(1108 184)"><rect width="444" height="226" rx="18" fill="#f7fbff" stroke="#78a8d2" stroke-width="2"/><rect x="24" y="24" width="64" height="32" rx="16" fill="#f0ebf8"/><text x="56" y="46" text-anchor="middle" class="mono">03</text><text x="24" y="94" class="head">四个示例源码精读</text><text x="24" y="132" class="body">从正确 Kernel 走到生产 GEMM</text><text x="24" y="162" class="body">把每一步新增机制放回数据流</text><text x="24" y="192" class="body">最后补齐编译与调试边界</text></g>
  <text x="48" y="476" class="ey">第三篇中的四例阶梯</text><rect x="48" y="500" width="1504" height="242" rx="18" class="card"/>
  <g transform="translate(78 538)"><rect width="300" height="166" rx="14" fill="#e8f2fb" stroke="#9fc1df"/><text x="20" y="38" class="mono">01 · vectorAdd</text><text x="20" y="76" class="head">先跑通完整骨架</text><text x="20" y="111" class="body">Tile、Predicate、Register</text><text x="20" y="140" class="mono">GMEM → VGPR → GMEM</text></g><path d="M378 621 H420" class="flow"/>
  <g transform="translate(432 538)"><rect width="300" height="166" rx="14" fill="#eaf7f1" stroke="#9ccdb9"/><text x="20" y="38" class="mono">02 · tiledCopy</text><text x="20" y="76" class="head">明确线程所有权</text><text x="20" y="111" class="body">Thread/Value Layout</text><text x="20" y="140" class="mono">partition_S / partition_D</text></g><path d="M732 621 H774" class="flow"/>
  <g transform="translate(786 538)"><rect width="300" height="166" rx="14" fill="#f0ebf8" stroke="#c5b1da"/><text x="20" y="38" class="mono">03 · tiledMma</text><text x="20" y="76" class="head">接入 MFMA</text><text x="20" y="111" class="body">Copy Layout 服从消费者</text><text x="20" y="140" class="mono">retile · one storage, two views</text></g><path d="M1086 621 H1128" class="flow"/>
  <g transform="translate(1140 538)"><rect width="382" height="166" rx="14" fill="#fff0e1" stroke="#dfbc95"/><text x="20" y="38" class="mono">04 · preshuffle GEMM</text><text x="20" y="76" class="head">组织生产级 Pipeline</text><text x="20" y="111" class="body">Preshuffle · Swizzle · Ping-pong</text><text x="20" y="140" class="mono">VMEM / LDS / MFMA scheduling</text></g>
  <rect x="232" y="770" width="1136" height="30" rx="15" fill="#f1f5f8"/><text x="800" y="791" text-anchor="middle" class="small">贯穿问题：谁拥有 Value？它位于哪层存储？消费者为什么能在此刻读到它？</text>
</svg>
