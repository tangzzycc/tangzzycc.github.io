<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc">
<title id="title">Residual Add 与 RMSNorm 融合</title>
<desc id="desc">The two inputs feed addition. The sum feeds RMS normalization. A shared per-feature weight scales each output.</desc>
<defs><marker id="arrow-2865a8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2865a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-187264" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#187264" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-ac642e" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ac642e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-7654a5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7654a5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-607187" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#607187" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-b45650" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b45650" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif;fill:#172e46}.mono{font-family:"DejaVu Sans Mono","LXGW WenKai GB Screen",monospace}</style>
<rect x="0" y="0" width="1600" height="740" rx="0" fill="#fbfcfe" stroke="none" stroke-width="1.8" />
<rect x="48" y="36" width="6" height="40" rx="3" fill="#e65b3d" stroke="none" stroke-width="1.8" />
<text x="74" y="69" font-size="42" fill="#172e46" style="fill:#172e46" text-anchor="start" font-weight="700" class="label">Residual Add 与 RMSNorm 融合</text>
<text x="48" y="110" font-size="23" fill="#607187" style="fill:#607187" text-anchor="start" font-weight="400" class="label">先计算残差相加，再按 Token 归一化，最后乘以逐特征权重。</text>
<rect x="48" y="156" width="1504" height="506" rx="18" fill="#fff" stroke="#ced7e2" stroke-width="1.8" />
<rect x="84" y="272" width="216" height="96" rx="12" fill="#e8f1fb" stroke="#a9c4df" stroke-width="1.8" />
<text x="192" y="329" font-size="28" fill="#2865a8" style="fill:#2865a8" text-anchor="middle" font-weight="700" class="label">x</text>
<rect x="84" y="448" width="216" height="96" rx="12" fill="#e8f1fb" stroke="#a9c4df" stroke-width="1.8" />
<text x="192" y="505" font-size="28" fill="#2865a8" style="fill:#2865a8" text-anchor="middle" font-weight="700" class="label">残差 residual</text>
<circle cx="416" cy="408" r="44" fill="#e8f5f1" stroke="#a9d1c5" stroke-width="2"/>
<text x="416" y="422" font-size="40" fill="#187264" style="fill:#187264" text-anchor="middle" font-weight="400" class="label">+</text>
<path d="M300 320 L370 389" fill="none" stroke="#2865a8" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-2865a8)"/>
<path d="M300 496 L370 428" fill="none" stroke="#2865a8" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-2865a8)"/>
<path d="M462 408 L644 408" fill="none" stroke="#2865a8" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-2865a8)"/>
<text x="555" y="362" font-size="20" fill="#607187" style="fill:#607187" text-anchor="middle" font-weight="400" class="label">z = x + residual</text>
<rect x="666" y="356" width="292" height="104" rx="12" fill="#f0edfa" stroke="#cfbee1" stroke-width="1.8" />
<text x="812" y="398" font-size="29" fill="#7654a5" style="fill:#7654a5" text-anchor="middle" font-weight="700" class="label">RMSNorm</text>
<text x="812" y="435" font-size="22" fill="#607187" style="fill:#607187" text-anchor="middle" font-weight="400" class="label">每行独立计算 RMS</text>
<path d="M958 408 L1036 408" fill="none" stroke="#2865a8" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-2865a8)"/>
<rect x="1056" y="356" width="148" height="104" rx="12" fill="#fff1e5" stroke="#e4c7ad" stroke-width="1.8" />
<text x="1130" y="416" font-size="36" fill="#ac642e" style="fill:#ac642e" text-anchor="middle" font-weight="400" class="label">×</text>
<rect x="1002" y="522" width="256" height="80" rx="12" fill="#fff1e5" stroke="#e4c7ad" stroke-width="1.8" />
<text x="1130" y="570" font-size="27" fill="#ac642e" style="fill:#ac642e" text-anchor="middle" font-weight="700" class="label">权重 weight</text>
<path d="M1130 522 L1130 472" fill="none" stroke="#ac642e" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-ac642e)"/>
<path d="M1204 408 L1280 408" fill="none" stroke="#2865a8" stroke-width="2.4" opacity="1" stroke-linecap="round" marker-end="url(#arrow-2865a8)"/>
<rect x="1298" y="356" width="206" height="104" rx="12" fill="#e8f5f1" stroke="#a9d1c5" stroke-width="1.8" />
<text x="1401" y="418" font-size="30" fill="#187264" style="fill:#187264" text-anchor="middle" font-weight="700" class="label">输出 out</text>
<text x="80" y="218" font-size="24" fill="#607187" style="fill:#607187" text-anchor="start" font-weight="400" class="label">输入 x、residual 与输出 out：(N, C)     权重 weight：(C,)</text>
<text x="48" y="706" font-size="22" fill="#607187" style="fill:#607187" text-anchor="start" font-weight="400" class="label">融合为一个 Kernel，避免将中间和 z 写入显存。</text>
</svg>
