<text x="74" y="69" font-size="42" fill="#172e46" style="fill:#172e46" text-anchor="start" font-weight="700" class="label">层归一化 · LayerNorm</text>
<text x="48" y="110" font-size="23" fill="#607187" style="fill:#607187" text-anchor="start" font-weight="400" class="label">每个样本独立沿 C 个特征计算均值、方差并归一化。</text>
<rect x="48" y="156" width="1504" height="686" rx="18" fill="#fff" stroke="#ced7e2" stroke-width="1.8" />
<text x="80" y="210" font-size="26" fill="#172e46" style="fill:#172e46" text-anchor="start" font-weight="700" class="label">N = 3 个样本 · C = 6 个特征</text>
<text x="80" y="252" font-size="23" fill="#607187" style="fill:#607187" text-anchor="start" font-weight="400" class="label">不同行使用各自的均值与方差。</text>
