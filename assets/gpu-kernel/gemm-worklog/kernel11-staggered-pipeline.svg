<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">GEMM Kernel 11 的线程组错峰调度</title>
  <desc id="desc">CUDA Block 的前后两组线程以不同顺序执行加载和计算，三个 Block Barrier 协调两个 K tile；两组线程仍然需要为各自的 C 累加器计算全部 tile。</desc>
  <defs>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#e4f0fb"/><line x1="0" y1="0" x2="0" y2="9" stroke="#4c91ca" stroke-width="2"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#e1f2ea"/><line x1="0" y1="0" x2="0" y2="9" stroke="#3e9a79" stroke-width="2"/></pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8L7 4L0 7.2" fill="none" stroke="#536a80" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#142b42}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#5b6f84}
    .section{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px;fill:#5b6f84}.tiny{font-size:12px;fill:#5b6f84}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px}.lane{fill:#f7f9fb;stroke:#c4cfda;stroke-width:1.5}
    .load{fill:url(#hatch-blue);stroke:#2876b7;stroke-width:2}.compute{fill:url(#hatch-green);stroke:#18815f;stroke-width:2}
    .idle{fill:#f1f3f5;stroke:#b7c0ca;stroke-width:1.5}.barrier{stroke:#b75d2a;stroke-width:2.2;stroke-dasharray:7 6}
    .flow{fill:none;stroke:#536a80;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.note{fill:#fff8ed;stroke:#dcac72;stroke-width:1.8}
    .buffer0{fill:#e7f4ed;stroke:#3e9a79;stroke-width:2}.buffer1{fill:#e8f1fb;stroke:#4c91ca;stroke-width:2}
  </style>
  <rect width="1600" height="820" fill="#fbfcfe"/>
  <text x="54" y="52" class="title">Kernel 11：两组线程以不同顺序错峰执行</text>
  <text x="54" y="82" class="subtitle">它没有使用硬件异步复制，而是让不同 Warp 的加载指令与 FMA 指令同时具备被调度的机会。</text>

  <text x="54" y="142" class="section">一次外层循环处理两个 K tile</text>
  <text x="1450" y="142" text-anchor="end" class="small">时间 →</text>
  <rect x="54" y="178" width="1492" height="330" rx="6" fill="#fff" stroke="#c5d0db" stroke-width="2"/>
  <text x="76" y="234" class="label">线程组 0</text><text x="76" y="257" class="tiny">threadIdx.x &lt; NUM_THREADS/2</text>
  <text x="76" y="346" class="label">线程组 1</text><text x="76" y="369" class="tiny">threadIdx.x ≥ NUM_THREADS/2</text>
  <text x="76" y="454" class="label">Shared Memory 槽</text>
  <rect x="250" y="205" width="180" height="70" rx="5" class="load"/><text x="340" y="235" text-anchor="middle" class="label">加载 T0 → B0</text><text x="340" y="257" text-anchor="middle" class="tiny">预热阶段</text>
  <rect x="250" y="317" width="180" height="70" rx="5" class="idle"/><text x="340" y="357" text-anchor="middle" class="small">空闲 / 等待</text>

  <rect x="430" y="205" width="250" height="70" rx="5" class="compute"/><text x="555" y="235" text-anchor="middle" class="label">用 T0 更新自己的 C</text><text x="555" y="257" text-anchor="middle" class="tiny">读取 B0</text>
  <rect x="430" y="317" width="250" height="70" rx="5" class="load"/><text x="555" y="347" text-anchor="middle" class="label">加载 T1 → B1</text><text x="555" y="369" text-anchor="middle" class="tiny">可与线程组 0 的 FMA 重叠</text>

  <rect x="680" y="205" width="250" height="70" rx="5" class="compute"/><text x="805" y="235" text-anchor="middle" class="label">用 T1 更新自己的 C</text><text x="805" y="257" text-anchor="middle" class="tiny">读取 B1</text>
  <rect x="680" y="317" width="250" height="70" rx="5" class="compute"/><text x="805" y="347" text-anchor="middle" class="label">用 T0 更新自己的 C</text><text x="805" y="369" text-anchor="middle" class="tiny">读取 B0</text>

  <rect x="930" y="205" width="250" height="70" rx="5" class="load"/><text x="1055" y="235" text-anchor="middle" class="label">加载 T2 → B0</text><text x="1055" y="257" text-anchor="middle" class="tiny">此时 B0 已可复用</text>
  <rect x="930" y="317" width="250" height="70" rx="5" class="compute"/><text x="1055" y="347" text-anchor="middle" class="label">用 T1 更新自己的 C</text><text x="1055" y="369" text-anchor="middle" class="tiny">可与线程组 0 的加载重叠</text>

  <rect x="1180" y="205" width="250" height="70" rx="5" class="compute"/><text x="1305" y="235" text-anchor="middle" class="label">用 T2 更新自己的 C</text><text x="1305" y="257" text-anchor="middle" class="tiny">进入下一次外层循环</text>
  <rect x="1180" y="317" width="250" height="70" rx="5" class="load"/><text x="1305" y="347" text-anchor="middle" class="label">加载 T3 → B1</text><text x="1305" y="369" text-anchor="middle" class="tiny">重复同一错峰模式</text>

  <line x1="430" y1="190" x2="430" y2="490" class="barrier"/><text x="430" y="194" text-anchor="middle" class="tiny">初始同步</text>
  <line x1="680" y1="190" x2="680" y2="490" class="barrier"/><text x="680" y="194" text-anchor="middle" class="tiny">Barrier 1</text>
  <line x1="930" y1="190" x2="930" y2="490" class="barrier"/><text x="930" y="194" text-anchor="middle" class="tiny">Barrier 2</text>
  <line x1="1180" y1="190" x2="1180" y2="490" class="barrier"/><text x="1180" y="194" text-anchor="middle" class="tiny">Barrier 3</text>
  <rect x="250" y="428" width="180" height="48" rx="4" class="buffer0"/><text x="340" y="458" text-anchor="middle" class="mono">B0 = T0</text>
  <rect x="430" y="428" width="250" height="48" rx="4" class="buffer1"/><text x="555" y="458" text-anchor="middle" class="mono">B1 ← T1</text>
  <rect x="680" y="428" width="250" height="48" rx="4" class="buffer1"/><text x="805" y="458" text-anchor="middle" class="mono">B0=T0 · B1=T1</text>
  <rect x="930" y="428" width="250" height="48" rx="4" class="buffer0"/><text x="1055" y="458" text-anchor="middle" class="mono">B0 ← T2</text>
  <rect x="1180" y="428" width="250" height="48" rx="4" class="buffer1"/><text x="1305" y="458" text-anchor="middle" class="mono">B1 ← T3</text>

  <rect x="54" y="548" width="468" height="206" rx="6" class="note"/>
  <text x="80" y="586" class="section">真正发生重叠的阶段</text>
  <text x="80" y="624" class="label">阶段 1</text><text x="168" y="624" class="small">线程组 0 对 T0 做 FMA；线程组 1 加载 T1</text>
  <text x="80" y="660" class="label">阶段 3</text><text x="168" y="660" class="small">线程组 0 加载 T2；线程组 1 对 T1 做 FMA</text>
  <text x="80" y="704" class="small">调度器可以交错发射加载 Warp 与计算 Warp。</text>
  <text x="80" y="730" class="small">单次复制并非异步；中间阶段也没有隐藏加载。</text>

  <rect x="546" y="548" width="468" height="206" rx="6" fill="#fff" stroke="#c5d0db" stroke-width="2"/>
  <text x="572" y="586" class="section">为什么两组线程都要计算两次</text>
  <text x="572" y="624" class="small">每个线程持有不同的 C 累加器元素。</text>
  <text x="572" y="658" class="mono">C_thread += A[T0] × B[T0]</text>
  <text x="572" y="692" class="mono">C_thread += A[T1] × B[T1]</text>
  <text x="572" y="730" class="small">替另一组加载 tile，并不能省掉自己的任何一次累加。</text>

  <rect x="1038" y="548" width="508" height="206" rx="6" fill="#f3eef9" stroke="#b59bce" stroke-width="2"/>
  <text x="1064" y="586" class="section">脆弱的同步约束</text>
  <text x="1064" y="624" class="small">分组边界必须与 Warp 对齐，避免同一 Warp 内角色分歧。</text>
  <text x="1064" y="658" class="small">两个分支必须按相同顺序到达相同数量的 Block Barrier。</text>
  <text x="1064" y="692" class="small">三次同步分别保护 B1 就绪、B0 复用和循环换轮。</text>
  <text x="1064" y="730" class="small">同步成本是 Kernel 11 慢于 Kernel 10 的原因之一。</text>
</svg>
