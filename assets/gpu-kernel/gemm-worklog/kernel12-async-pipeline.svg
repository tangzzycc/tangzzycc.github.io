<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Kernel 12 的两级异步复制流水线</title>
  <desc id="desc">图中追踪 T0 到 T3 在预热、稳定流水和排空阶段的执行过程。缓冲区 B0 与 B1 交替承担 front 和 back；每轮先提交下一 tile，再等待当前 Barrier、计算当前 tile，并在复用旧 front 前完成同步。</desc>
  <defs>
    <pattern id="load-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#e3effb"/><line x1="0" y1="0" x2="0" y2="9" stroke="#4c91ca" stroke-width="2"/></pattern>
    <pattern id="compute-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#dff2e9"/><line x1="0" y1="0" x2="0" y2="9" stroke="#3e9a79" stroke-width="2"/></pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8L7 4L0 7.2" fill="none" stroke="#536a80" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#142b42}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#5b6f84}
    .section{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px;fill:#5b6f84}.tiny{font-size:12px;fill:#5b6f84}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:13px}.panel{fill:#fff;stroke:#c5d0db;stroke-width:2}
    .load{fill:url(#load-hatch);stroke:#2876b7;stroke-width:2}.compute{fill:url(#compute-hatch);stroke:#18815f;stroke-width:2}
    .wait{fill:#fff1e3;stroke:#d28b49;stroke-width:2}.sync{fill:#f0eaf7;stroke:#9b78bd;stroke-width:2}
    .b0{fill:#e3f3eb;stroke:#3e9a79;stroke-width:2}.b1{fill:#e5f0fb;stroke:#4c91ca;stroke-width:2}
    .phase{fill:#f3f5f8;stroke:#cad4de;stroke-width:1.5}.vline{stroke:#c1cbd6;stroke-width:1.5;stroke-dasharray:5 6}
    .flow{fill:none;stroke:#536a80;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.callout{fill:#fff8ed;stroke:#dcac72;stroke-width:1.7}
    .num{fill:#142b42}.numtext{fill:#fff;font-size:13px;font-weight:700}
  </style>
  <rect width="1600" height="960" fill="#fbfcfe"/>
  <text x="54" y="52" class="title">Kernel 12：Barrier 必须跟随对应的物理缓冲区</text>
  <text x="54" y="82" class="subtitle">沿 T0…T3 的完整时间线观察复制在哪里重叠、线程在哪里等待，以及旧槽位何时才能复用。</text>

  <rect x="54" y="126" width="1492" height="500" rx="6" class="panel"/>
  <rect x="250" y="150" width="230" height="42" rx="5" class="phase"/><text x="365" y="177" text-anchor="middle" class="label">预热 Prologue</text>
  <rect x="480" y="150" width="690" height="42" rx="5" class="phase"/><text x="825" y="177" text-anchor="middle" class="label">稳定流水 Steady state</text>
  <rect x="1170" y="150" width="230" height="42" rx="5" class="phase"/><text x="1285" y="177" text-anchor="middle" class="label">排空 Drain</text>
  <text x="76" y="250" class="label">异步复制</text><text x="76" y="274" class="small">Global → Shared</text>
  <text x="76" y="354" class="label">消费者等待</text><text x="76" y="378" class="small">等待 front Barrier</text>
  <text x="76" y="458" class="label">CUDA Core</text><text x="76" y="482" class="small">对 front 执行 FMA</text>
  <text x="76" y="562" class="label">复用前同步</text><text x="76" y="586" class="small">确认所有读取已结束</text>
  <line x1="480" y1="202" x2="480" y2="608" class="vline"/><line x1="710" y1="202" x2="710" y2="608" class="vline"/>
  <line x1="940" y1="202" x2="940" y2="608" class="vline"/><line x1="1170" y1="202" x2="1170" y2="608" class="vline"/><line x1="1400" y1="202" x2="1400" y2="608" class="vline"/>

  <rect x="250" y="220" width="230" height="64" rx="5" class="load"/><text x="365" y="247" text-anchor="middle" class="label">提交 T0 → B0</text><text x="365" y="270" text-anchor="middle" class="tiny">绑定到 B0 的 Barrier</text>
  <rect x="480" y="220" width="230" height="64" rx="5" class="load"/><text x="595" y="247" text-anchor="middle" class="label">提交 T1 → B1</text><text x="595" y="270" text-anchor="middle" class="tiny">可与 T0 的 FMA 重叠</text>
  <rect x="710" y="220" width="230" height="64" rx="5" class="load"/><text x="825" y="247" text-anchor="middle" class="label">提交 T2 → B0</text><text x="825" y="270" text-anchor="middle" class="tiny">复用旧 B0</text>
  <rect x="940" y="220" width="230" height="64" rx="5" class="load"/><text x="1055" y="247" text-anchor="middle" class="label">提交 T3 → B1</text><text x="1055" y="270" text-anchor="middle" class="tiny">复用旧 B1</text>

  <rect x="480" y="324" width="70" height="64" rx="5" class="wait"/><text x="515" y="350" text-anchor="middle" class="label">等待 B0</text><text x="515" y="373" text-anchor="middle" class="tiny">T0 就绪</text>
  <rect x="710" y="324" width="70" height="64" rx="5" class="wait"/><text x="745" y="350" text-anchor="middle" class="label">等待 B1</text><text x="745" y="373" text-anchor="middle" class="tiny">T1 就绪</text>
  <rect x="940" y="324" width="70" height="64" rx="5" class="wait"/><text x="975" y="350" text-anchor="middle" class="label">等待 B0</text><text x="975" y="373" text-anchor="middle" class="tiny">T2 就绪</text>
  <rect x="1170" y="324" width="70" height="64" rx="5" class="wait"/><text x="1205" y="350" text-anchor="middle" class="label">等待 B1</text><text x="1205" y="373" text-anchor="middle" class="tiny">T3 就绪</text>

  <rect x="550" y="428" width="125" height="64" rx="5" class="compute"/><text x="612" y="455" text-anchor="middle" class="label">计算 T0</text><text x="612" y="478" text-anchor="middle" class="tiny">FMA · 读取 B0</text>
  <rect x="780" y="428" width="125" height="64" rx="5" class="compute"/><text x="842" y="455" text-anchor="middle" class="label">计算 T1</text><text x="842" y="478" text-anchor="middle" class="tiny">FMA · 读取 B1</text>
  <rect x="1010" y="428" width="125" height="64" rx="5" class="compute"/><text x="1072" y="455" text-anchor="middle" class="label">计算 T2</text><text x="1072" y="478" text-anchor="middle" class="tiny">FMA · 读取 B0</text>
  <rect x="1240" y="428" width="125" height="64" rx="5" class="compute"/><text x="1302" y="455" text-anchor="middle" class="label">计算 T3</text><text x="1302" y="478" text-anchor="middle" class="tiny">FMA · 读取 B1</text>

  <rect x="675" y="532" width="35" height="54" rx="4" class="sync"/><text x="692" y="553" text-anchor="middle" class="tiny">CTA</text><text x="692" y="571" text-anchor="middle" class="tiny">同步</text>
  <rect x="905" y="532" width="35" height="54" rx="4" class="sync"/><text x="922" y="553" text-anchor="middle" class="tiny">CTA</text><text x="922" y="571" text-anchor="middle" class="tiny">同步</text>
  <rect x="1135" y="532" width="35" height="54" rx="4" class="sync"/><text x="1152" y="553" text-anchor="middle" class="tiny">CTA</text><text x="1152" y="571" text-anchor="middle" class="tiny">同步</text>

  <path d="M515 388 V410 H612 V422" class="flow"/><path d="M745 388 V410 H842 V422" class="flow"/>
  <path d="M975 388 V410 H1072 V422" class="flow"/><path d="M1205 388 V410 H1302 V422" class="flow"/>

  <text x="54" y="674" class="section">同一个物理缓冲区会在每轮切换角色</text>
  <rect x="54" y="704" width="1492" height="202" rx="6" class="panel"/>
  <text x="76" y="750" class="label">迭代</text><text x="220" y="750" class="label">front · 本轮读取</text><text x="600" y="750" class="label">back · 本轮写入</text><text x="980" y="750" class="label">进入下一轮前必须完成的交接</text>
  <line x1="76" y1="768" x2="1518" y2="768" stroke="#c8d2dc" stroke-width="1.5"/>
  <text x="94" y="808" class="mono">s = 0</text><rect x="220" y="786" width="300" height="42" rx="5" class="b0"/><text x="370" y="812" text-anchor="middle" class="mono">B0 / barrier0 / T0</text>
  <rect x="600" y="786" width="300" height="42" rx="5" class="b1"/><text x="750" y="812" text-anchor="middle" class="mono">B1 / barrier1 / T1</text><text x="980" y="812" class="small">所有线程读完 B0 后，B0 才能重新写入</text>
  <text x="94" y="864" class="mono">s = 1</text><rect x="220" y="842" width="300" height="42" rx="5" class="b1"/><text x="370" y="868" text-anchor="middle" class="mono">B1 / barrier1 / T1</text>
  <rect x="600" y="842" width="300" height="42" rx="5" class="b0"/><text x="750" y="868" text-anchor="middle" class="mono">B0 / barrier0 / T2</text><text x="980" y="868" class="small">所有线程读完 B1 后，B1 才能重新写入</text>

</svg>
