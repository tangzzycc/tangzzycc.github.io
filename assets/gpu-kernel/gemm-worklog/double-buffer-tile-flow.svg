<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CUDA GEMM 双缓冲中的 tile 数据流</title>
  <desc id="desc">第 s 轮从 Shared Memory 缓冲区 B0 读取 T1 并通过寄存器分片执行计算，同时把矩阵 A 和 B 的 T2 搬入缓冲区 B1；下一轮交换 front 与 back 的逻辑身份。</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#aeb9c5" stroke-width="1"/></pattern>
    <pattern id="grid-green" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#dff3e9"/><path d="M16 0H0V16" fill="none" stroke="#61a88f" stroke-width="1"/></pattern>
    <pattern id="grid-blue" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e1effc"/><path d="M16 0H0V16" fill="none" stroke="#609bd0" stroke-width="1"/></pattern>
    <pattern id="grid-purple" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#eee7f7"/><path d="M16 0H0V16" fill="none" stroke="#9d7fbd" stroke-width="1"/></pattern>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8L7 4L0 7.2" fill="none" stroke="#2876b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8L7 4L0 7.2" fill="none" stroke="#18815f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purple-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8L7 4L0 7.2" fill="none" stroke="#7650a1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#142b42}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#5b6f84}
    .section{font-size:21px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px;fill:#5b6f84}.tiny{font-size:12px;fill:#5b6f84}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px}.outline{fill:#fff;stroke:#bdc9d6;stroke-width:2}
    .inactive{fill:#f2f4f7;stroke:#aeb9c5;stroke-width:1.5}.front{fill:#e1f2ea;stroke:#3e9a79;stroke-width:2.5}
    .back{fill:#e4f0fb;stroke:#4c91ca;stroke-width:2.5}.reg{fill:#fff2df;stroke:#d2914d;stroke-width:2}
    .blue-flow{fill:none;stroke:#2876b7;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blue-arrow)}.green-flow{fill:none;stroke:#18815f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#green-arrow)}
    .swap{fill:none;stroke:#7650a1;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#purple-arrow)}
    .divider{stroke:#d2dae3;stroke-width:1.5}.badge{fill:#142b42}.badge-text{fill:#fff;font-size:14px;font-weight:700}
  </style>
  <rect width="1600" height="980" fill="#fbfcfe"/>
  <text x="54" y="52" class="title">一次迭代同时处理两个 K tile：计算 T1，预取 T2</text>
  <text x="54" y="82" class="subtitle">颜色始终表示同一份数据，可沿图追踪它从 Global Memory 到 Shared Memory、寄存器和 C 累加块的流动。</text>
  <line x1="54" y1="108" x2="1546" y2="108" class="divider"/>

  <text x="54" y="148" class="section">Global Memory · 一个 BM × BN 输出块</text>
  <text x="54" y="178" class="label">A 的当前块行：BM × K</text>
  <rect x="54" y="196" width="520" height="128" fill="url(#grid)" stroke="#8292a3" stroke-width="2"/>
  <rect x="184" y="196" width="130" height="128" fill="url(#grid-green)" stroke="#18815f" stroke-width="3"/>
  <rect x="314" y="196" width="130" height="128" fill="url(#grid-blue)" stroke="#2876b7" stroke-width="3"/>
  <line x1="184" y1="196" x2="184" y2="324" class="divider"/><line x1="314" y1="196" x2="314" y2="324" class="divider"/><line x1="444" y1="196" x2="444" y2="324" class="divider"/>
  <text x="119" y="264" text-anchor="middle" class="label">T0</text><text x="249" y="264" text-anchor="middle" class="label">T1 · 当前</text>
  <text x="379" y="264" text-anchor="middle" class="label">T2 · 下一块</text><text x="509" y="264" text-anchor="middle" class="label">T3</text>
  <text x="314" y="347" text-anchor="middle" class="small">沿 K 维按 BK 从左向右推进</text>

  <text x="54" y="402" class="label">B 的当前块列：K × BN</text>
  <rect x="54" y="420" width="260" height="320" fill="url(#grid)" stroke="#8292a3" stroke-width="2"/>
  <rect x="54" y="500" width="260" height="80" fill="url(#grid-green)" stroke="#18815f" stroke-width="3"/>
  <rect x="54" y="580" width="260" height="80" fill="url(#grid-blue)" stroke="#2876b7" stroke-width="3"/>
  <line x1="54" y1="500" x2="314" y2="500" class="divider"/><line x1="54" y1="580" x2="314" y2="580" class="divider"/><line x1="54" y1="660" x2="314" y2="660" class="divider"/>
  <text x="184" y="466" text-anchor="middle" class="label">T0</text><text x="184" y="548" text-anchor="middle" class="label">T1 · 当前</text>
  <text x="184" y="628" text-anchor="middle" class="label">T2 · 下一块</text><text x="184" y="706" text-anchor="middle" class="label">T3</text>
  <text x="336" y="584" class="small" transform="rotate(90 336 584)">沿 K 维从上向下推进</text>

  <text x="668" y="148" class="section">Shared Memory · B0 / B1</text>
  <rect x="650" y="184" width="330" height="244" rx="6" class="front"/>
  <text x="674" y="216" class="label">B0 · front · 已就绪</text>
  <text x="956" y="216" text-anchor="end" class="small">T1 tile</text>
  <rect x="684" y="246" width="190" height="70" fill="url(#grid-green)" stroke="#18815f" stroke-width="2"/>
  <text x="779" y="286" text-anchor="middle" class="mono">As[T1] · BM×BK</text>
  <rect x="894" y="246" width="54" height="144" fill="url(#grid-green)" stroke="#18815f" stroke-width="2"/>
  <text x="921" y="323" text-anchor="middle" class="mono" transform="rotate(90 921 323)">Bs[T1] · BK×BN</text>
  <text x="684" y="390" class="small">本轮只读，CTA 同步后才可复用</text>

  <rect x="650" y="474" width="330" height="244" rx="6" class="back"/>
  <text x="674" y="506" class="label">B1 · back · 搬运中</text>
  <text x="956" y="506" text-anchor="end" class="small">T2 tile</text>
  <rect x="684" y="536" width="190" height="70" fill="url(#grid-blue)" stroke="#2876b7" stroke-width="2"/>
  <text x="779" y="576" text-anchor="middle" class="mono">As[T2] · BM×BK</text>
  <rect x="894" y="536" width="54" height="144" fill="url(#grid-blue)" stroke="#2876b7" stroke-width="2"/>
  <text x="921" y="613" text-anchor="middle" class="mono" transform="rotate(90 921 613)">Bs[T2] · BK×BN</text>
  <text x="684" y="680" class="small">复制 Barrier 完成前不可读取</text>

  <path d="M379 324 V370 H590 V560 H640" class="blue-flow"/>
  <path d="M314 620 H640" class="blue-flow"/>
  <text x="458" y="486" class="label">把 T2 搬入 back</text>
  <text x="458" y="510" class="small">A/B tile 必须写入同一个 stage</text>

  <text x="1092" y="148" class="section">寄存器 → CUDA Core</text>
  <path d="M980 304 H1022" fill="none" stroke="#18815f" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1032" cy="304" r="7" fill="#fff" stroke="#18815f" stroke-width="2"/>
  <path d="M1039 304 H1078" class="green-flow"/>
  <text x="1056" y="286" text-anchor="middle" class="small">As → regM</text>
  <path d="M1032 297 V188 H1375 V204" class="green-flow"/>
  <text x="1200" y="178" text-anchor="middle" class="small">Bs → regN</text>
  <rect x="1090" y="214" width="128" height="190" rx="6" class="reg"/>
  <text x="1154" y="246" text-anchor="middle" class="label">regM</text>
  <rect x="1128" y="266" width="52" height="108" fill="url(#grid-green)" stroke="#18815f" stroke-width="2"/>
  <text x="1154" y="390" text-anchor="middle" class="small">TM 个元素</text>
  <rect x="1260" y="214" width="230" height="190" rx="6" class="reg"/>
  <text x="1375" y="246" text-anchor="middle" class="label">regN</text>
  <rect x="1292" y="292" width="166" height="52" fill="url(#grid-green)" stroke="#18815f" stroke-width="2"/>
  <text x="1375" y="390" text-anchor="middle" class="small">TN 个元素</text>
  <path d="M1154 404 V440 H1214" class="green-flow"/>
  <path d="M1375 404 V440 H1262" class="green-flow"/>
  <circle cx="1238" cy="440" r="18" fill="#e1f2ea" stroke="#18815f" stroke-width="2"/>
  <text x="1238" y="447" text-anchor="middle" class="section">×</text>
  <path d="M1238 458 V486 H1290 V516" class="green-flow"/>
  <text x="1310" y="490" class="small">外积更新线程累加块</text>
  <rect x="1110" y="522" width="360" height="196" fill="url(#grid-purple)" stroke="#7650a1" stroke-width="2.5"/>
  <rect x="1214" y="586" width="88" height="64" fill="#d7c5eb" stroke="#7650a1" stroke-width="3"/>
  <text x="1290" y="558" text-anchor="middle" class="label">threadResults · C tile 累加器</text>
  <text x="1258" y="623" text-anchor="middle" class="mono">TM×TN</text>

  <line x1="54" y1="790" x2="1546" y2="790" class="divider"/>
  <text x="54" y="851" class="label">迭代边界只交换逻辑身份，不搬动 Shared Memory 中的数据</text>
  <rect x="106" y="878" width="560" height="54" rx="6" class="outline"/><text x="386" y="912" text-anchor="middle" class="mono">第 s 轮：B0 = front(T1)，B1 = back(T2)</text>
  <path d="M680 905 H886" class="swap"/>
  <text x="783" y="889" text-anchor="middle" class="small">等待 T2 · 完成 T1 · 交换身份</text>
  <rect x="900" y="878" width="592" height="54" rx="6" class="outline"/><text x="1196" y="912" text-anchor="middle" class="mono">第 s+1 轮：B1 = front(T2)，B0 = back(T3)</text>
</svg>
