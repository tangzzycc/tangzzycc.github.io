<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 508" role="img" aria-labelledby="title desc">
<title id="title">From image patches to LLM generation</title>
<desc id="desc">A 224 by 224 RGB image becomes 196 patch embeddings, ViT features and projected visual embeddings. They merge with 12 text embeddings before LLM Prefill and Decode.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#466681"/></marker></defs>
<rect width="780" height="508" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="230" y="12" width="520" height="54" rx="8" fill="#e8f3eb" stroke="#7b96ab"/>
<text x="490" y="34" font-size="17" font-weight="600" fill="#163a51">RGB image</text>
<text x="490" y="55" font-size="15" fill="#365366">1 × 3 × 224 × 224</text>
<path d="M490 66 V80" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="82" width="520" height="54" rx="8" fill="#e8f3eb" stroke="#7b96ab"/>
<text x="490" y="104" font-size="17" font-weight="600" fill="#163a51">16 × 16 patches</text>
<text x="490" y="125" font-size="15" fill="#365366">196 × 768 pixel values</text>
<path d="M490 136 V150" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="152" width="520" height="54" rx="8" fill="#e8f3eb" stroke="#7b96ab"/>
<text x="490" y="174" font-size="17" font-weight="600" fill="#163a51">Shared projection + position</text>
<text x="490" y="195" font-size="15" fill="#365366">196 × 768 embeddings</text>
<path d="M490 206 V220" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="222" width="520" height="54" rx="8" fill="#e8f3eb" stroke="#7b96ab"/>
<text x="490" y="244" font-size="17" font-weight="600" fill="#163a51">ViT: bidirectional attention + MLP</text>
<text x="490" y="265" font-size="15" fill="#365366">196 × 768 visual features</text>
<path d="M490 276 V290" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="292" width="520" height="54" rx="8" fill="#eaf1fb" stroke="#7b96ab"/>
<text x="490" y="314" font-size="17" font-weight="600" fill="#163a51">Projector</text>
<text x="490" y="335" font-size="15" fill="#365366">196 × 4096 embeddings</text>
<path d="M490 346 V360" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="362" width="520" height="54" rx="8" fill="#eaf1fb" stroke="#7b96ab"/>
<text x="490" y="384" font-size="17" font-weight="600" fill="#163a51">Merge in prompt order</text>
<text x="490" y="405" font-size="15" fill="#365366">208 × 4096</text>
<path d="M490 416 V430" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="432" width="520" height="54" rx="8" fill="#eaf1fb" stroke="#7b96ab"/>
<text x="490" y="454" font-size="17" font-weight="600" fill="#163a51">LLM: Prefill → Decode</text>
<text x="490" y="475" font-size="15" fill="#365366">KV cache + first-token logits → generated text</text>
<rect x="10" y="362" width="185" height="54" rx="8" fill="#fff4dd" stroke="#ba9c61"/>
<text x="102" y="384" font-size="16" font-weight="600" fill="#54452b">Text embedding</text>
<text x="102" y="405" font-size="15" fill="#54452b">12 × 4096</text>
<path d="M195 389 H228" stroke="#466681" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
