<text x="213.5" y="1179.3" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">本轮计算 1 token</text>
<rect x="397" y="1085" width="378" height="114" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="586.0" y="1119.3635947421853" font-size="21.65763159466256" fill="#187264" text-anchor="middle" font-weight="700">R2 · RUNNING PREFILL CHUNK</text>
<text x="586.0" y="1158.3" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">80 − 32 = 48 → threshold 16</text>
<text x="586.0" y="1179.3" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">本轮计算 16 tokens · 预算余 15</text>
