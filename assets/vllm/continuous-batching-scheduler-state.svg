<text x="1211.0" y="561.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">threshold · budget · length</text>
<text x="1211.0" y="606.9681068342499" font-size="20.4944318654406" fill="#172e46" text-anchor="middle" font-weight="400">encoder / hybrid 规则可能继续收窄</text>
