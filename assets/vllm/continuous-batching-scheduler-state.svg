<text x="988.5" y="1158.3" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">prompt 60 · cache hit 8 · chunk 15</text>
<text x="988.5" y="1179.3" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">作为第三个运行请求被接纳</text>
<rect x="1202" y="1085" width="191" height="114" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1297.5" y="1121.32" font-size="22" fill="#ac642e" text-anchor="middle" font-weight="700">输出</text>
<text x="1297.5" y="1149.48" font-size="22" fill="#ac642e" text-anchor="middle" font-weight="700">R1: 1 · R2: 16</text>
<text x="1297.5" y="1177.6399999999999" font-size="22" fill="#ac642e" text-anchor="middle" font-weight="700">W1: 15</text>
<text x="720.0" y="1226.8" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">32 tokens 全部安排；SchedulerOutput 保留各请求的原进度位置与已分配 block IDs。</text>
