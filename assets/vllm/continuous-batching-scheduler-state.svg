<text x="206.0" y="254.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">持久请求状态</text>
<rect x="44" y="274" width="324" height="197" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="206.0" y="309.16" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">请求集合</text>
<text x="206.0" y="357.9733333333333" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">requests: req_id → Request</text>
<text x="206.0" y="399.64" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">running: list[Request]</text>
<text x="206.0" y="441.3066666666667" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">waiting · skipped_waiting</text>
<rect x="44" y="491" width="324" height="186" rx="6" fill="#fff" stroke="#607187" stroke-width="1.5"/>
<text x="206.0" y="526.16" font-size="24" fill="#607187" text-anchor="middle" font-weight="700">请求进度</text>
<text x="206.0" y="573.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">num_tokens_with_spec</text>
<text x="206.0" y="611.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">num_computed_tokens</text>
<text x="206.0" y="649.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">两者之差为统一工作缺口</text>
<rect x="44" y="697" width="324" height="247" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="206.0" y="732.16" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">长期约束</text>
<text x="206.0" y="789.6466666666666" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">max_num_running_reqs</text>
<text x="206.0" y="847.8792131076857" font-size="21.703567963781396" fill="#172e46" text-anchor="middle" font-weight="400">max_num_scheduled_tokens</text>
<text x="206.0" y="906.3133333333334" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">max_model_len</text>
<rect x="414" y="219" width="566" height="748" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="697.0" y="254.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">Scheduler：控制面所有者</text>
<text x="697.0" y="298.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">持有策略、队列、预算与请求状态转换。</text>
<rect x="435" y="328" width="242" height="250" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="556.0" y="363.16" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">核心方法</text>
<text x="556.0" y="422.2" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">schedule()</text>
<text x="556.0" y="449.08" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">编译本轮计划</text>
<text x="556.0" y="511.45688781132907" font-size="20.143707295569758" fill="#172e46" text-anchor="middle" font-weight="400">update_from_output()</text>
<text x="556.0" y="537.2408331496583" font-size="20.143707295569758" fill="#172e46" text-anchor="middle" font-weight="400">提交执行结果</text>
<rect x="695" y="328" width="265" height="250" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="827.5" y="363.16" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">KVCacheManager</text>
<text x="827.5" y="413.05" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">持有的协作对象</text>
<text x="827.5" y="457.55" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">get_computed_blocks()</text>
<text x="827.5" y="502.05" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">allocate_slots()</text>
<text x="827.5" y="546.55" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">报告逻辑 KV 分配可行性</text>
<rect x="435" y="603" width="525" height="341" rx="6" fill="#fff" stroke="#7654a5" stroke-width="1.5"/>
<text x="697.5" y="638.16" font-size="24" fill="#7654a5" text-anchor="middle" font-weight="700">本轮工作区：每个 step 重建</text>
<text x="697.5" y="692.6999999999999" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">token_budget：剩余计算容量</text>
<text x="697.5" y="746.4999999999999" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">scheduled_{running,new,resumed}_reqs</text>
<text x="697.5" y="800.2999999999998" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">req_to_new_blocks：各请求的分配增量</text>
<text x="697.5" y="854.0999999999998" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">num_scheduled_tokens：本轮工作合同</text>
<text x="697.5" y="907.8999999999997" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">这些是本轮累加器，不是新的持久队列。</text>
