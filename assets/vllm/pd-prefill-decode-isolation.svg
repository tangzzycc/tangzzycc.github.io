<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="935" viewBox="0 0 1440 935" role="img" aria-labelledby="title desc">
<title id="title">为什么分离 Prefill 与 Decode？</title><desc id="desc">依据 PDF 原图重绘：中文说明、原图关系、原图示例数据，保留英文专业术语。</desc>
<defs><marker id="a2865a8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#2865a8"/></marker><marker id="a187264" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#187264"/></marker><marker id="aac642e" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#ac642e"/></marker><marker id="a7654a5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#7654a5"/></marker><marker id="a607187" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#607187"/></marker><marker id="aac428b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#ac428b"/></marker><marker id="ab45650" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#b45650"/></marker></defs>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}.mono{font-family:"DejaVu Sans Mono","LXGW WenKai GB Screen",monospace}</style>
<rect width="1440" height="935" fill="#fbfcfe"/>
<text x="26" y="45" font-size="34" fill="#172e46" text-anchor="start" font-weight="700">为什么分离 Prefill 与 Decode？</text>
<text x="1414" y="38" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="26" y="82" font-size="21" fill="#607187" text-anchor="start" font-weight="400">请求 A 正在 Decode，此时请求 B 携带长 Prompt 到达。</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#a9c4bd" stroke-width="1.2"/></pattern></defs>
<rect x="26" y="109" width="1388" height="62" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="720.0" y="147.48" font-size="22" fill="#607187" text-anchor="middle" font-weight="700">A：延迟敏感的 Decode · B：新到的长 Prompt · 方块宽度示意模型 step 耗时，不是实测值</text>
<rect x="26" y="195" width="1388" height="299" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="720.0" y="231.86" font-size="29" fill="#ac642e" text-anchor="middle" font-weight="700">共享一个 Engine：混合模型 step</text>
<text x="719.0" y="274.64" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">Continuous Batching 改变请求集合；Chunked Prefill 限制 B，但二者仍使用同一 GPU step。</text>
<text x="119.0" y="369.98" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">GPU 时间线</text>
<rect x="219" y="326" width="147" height="75" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="292.5" y="371.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="381" y="326" width="147" height="75" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="454.5" y="371.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="543" y="326" width="315" height="75" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="700.5" y="370.44605743547595" font-size="20.429580692576376" fill="#ac642e" text-anchor="middle" font-weight="700">A decode  +  B prefill chunk</text>
<rect x="873" y="326" width="315" height="75" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1030.5" y="370.44605743547595" font-size="20.429580692576376" fill="#ac642e" text-anchor="middle" font-weight="700">A decode  +  B prefill chunk</text>
<rect x="1203" y="326" width="190" height="75" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1298.0" y="371.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<text x="719.0" y="452.82" font-size="23" fill="#172e46" text-anchor="middle" font-weight="400">A 仍在推进，但混合 step 可能拉长它的 ITL 与尾延迟。</text>
<rect x="26" y="523" width="1388" height="302" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="720.0" y="559.86" font-size="29" fill="#187264" text-anchor="middle" font-weight="700">P/D 分离：独立的 GPU 时间线</text>
<text x="119.5" y="644.16" font-size="24" fill="#172e46" text-anchor="middle" font-weight="400">P Pool</text>
<text x="119.5" y="733.16" font-size="24" fill="#172e46" text-anchor="middle" font-weight="400">D Pool</text>
<rect x="219" y="602" width="313" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="375.5" y="644.16" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">B prefill chunk 1</text>
<rect x="548" y="602" width="313" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="704.5" y="644.16" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">B prefill chunk 2</text>
<rect x="877" y="602" width="248" height="68" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="1001.0" y="629.7662337662338" font-size="20.77922077922078" fill="#7654a5" text-anchor="middle" font-weight="700">KV 交接</text>
<text x="1001.0" y="656.3636363636364" font-size="20.77922077922078" fill="#7654a5" text-anchor="middle" font-weight="700">bytes + metadata</text>
<rect x="219" y="695" width="160" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="299.0" y="736.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="394" y="695" width="160" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="474.0" y="736.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="569" y="695" width="160" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="649.0" y="736.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="744" y="695" width="160" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="824.0" y="736.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="919" y="695" width="160" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="999.0" y="736.32" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">A decode</text>
<rect x="1094" y="695" width="299" height="67" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1243.5" y="722.3961038961039" font-size="20.346320346320347" fill="#187264" text-anchor="middle" font-weight="700">A + B decode</text>
<text x="1243.5" y="748.439393939394" font-size="20.346320346320347" fill="#187264" text-anchor="middle" font-weight="700">B 在 KV 就绪后加入</text>
<rect x="26" y="850" width="1388" height="57" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="885.98" font-size="22" fill="#2865a8" text-anchor="middle" font-weight="700">隔离让 Decode 工作更稳定；代价是 KV 传输和两侧重复保留容量。</text>
</svg>
