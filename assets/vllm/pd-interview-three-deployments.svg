<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">P/D 的三种执行与部署方式</title><desc id="desc">请求 A 正在 Decode，请求 B 携带长 Prompt 到达；时间块仅为示意，不是实测。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="1080" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">P/D 的三种执行与部署方式</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">RAPID-Serve · 机制示意</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">请求 A 正在 Decode，请求 B 携带长 Prompt 到达；时间块仅为示意，不是实测。</text>
<rect x="26" y="112" width="1388" height="250" rx="6" fill="#ffffff" stroke="#ac642e" stroke-width="1.5"/>
<text x="50" y="150" font-size="28" fill="#ac642e" text-anchor="start">1. 混合批处理：Prefill 与 Decode 在同一模型 step 中推进</text>
<text x="55" y="215" font-size="23" fill="#172e46" text-anchor="start">GPU 执行轮次</text>
<rect x="245" y="180" width="140" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="315.0" y="220.18" font-size="24" fill="#2865a8" text-anchor="middle">A decode</text>
<rect x="400" y="180" width="360" height="65" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="580.0" y="220.18" font-size="24" fill="#ac642e" text-anchor="middle">A + B chunk 1</text>
<rect x="775" y="180" width="360" height="65" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="955.0" y="220.18" font-size="24" fill="#ac642e" text-anchor="middle">A + B chunk 2</text>
<rect x="1150" y="180" width="230" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1265.0" y="220.18" font-size="24" fill="#2865a8" text-anchor="middle">A decode</text>
<path d="M245 285 L1380 285" fill="none" stroke="#607187" stroke-width="2"/>
<circle cx="385" cy="285" r="5" fill="#2865a8"/>
<circle cx="760" cy="285" r="5" fill="#2865a8"/>
<circle cx="1135" cy="285" r="5" fill="#2865a8"/>
<circle cx="1380" cy="285" r="5" fill="#2865a8"/>
<text x="55" y="294" font-size="23" fill="#172e46" text-anchor="start">A 输出</text>
<text x="720" y="335" font-size="24" fill="#ac642e" text-anchor="middle">Chunking 限制每轮 Prefill 工作量，但 Decode 仍受同轮执行影响。</text>
<rect x="26" y="382" width="1388" height="305" rx="6" fill="#ffffff" stroke="#7654a5" stroke-width="1.5"/>
<text x="50" y="420" font-size="28" fill="#7654a5" text-anchor="start">2. 异设备 P/D 分离：独立 GPU 组，交接时传输 KV</text>
<text x="55" y="490" font-size="23" fill="#172e46" text-anchor="start">P GPU 组</text>
<text x="55" y="580" font-size="23" fill="#172e46" text-anchor="start">D GPU 组</text>
<rect x="245" y="454" width="690" height="61" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="590.0" y="492.18" font-size="24" fill="#ac642e" text-anchor="middle">B prefill</text>
<rect x="955" y="454" width="215" height="61" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="1062.5" y="492.18" font-size="24" fill="#7654a5" text-anchor="middle">KV 传输</text>
<rect x="245" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="308.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="386" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="449.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="527" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="590.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="668" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="731.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="809" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="872.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="950" y="550" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1013.0" y="586.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="1095" y="550" width="285" height="58" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1237.5" y="586.68" font-size="24" fill="#187264" text-anchor="middle">A + B decode</text>
<path d="M1170 485 L1195 485 L1195 540" fill="none" stroke="#7654a5" stroke-width="2"/>
<polygon points="1195,540 1200.0,529.0 1190.0,529.0" fill="#7654a5"/>
<text x="720" y="657" font-size="23" fill="#7654a5" text-anchor="middle">两侧保留模型副本与各自 KV 池；B 的 Decode 等待 KV 传输完成。</text>
<rect x="26" y="707" width="1388" height="305" rx="6" fill="#ffffff" stroke="#187264" stroke-width="1.5"/>
<text x="50" y="745" font-size="28" fill="#187264" text-anchor="start">3. 同设备 P/D 解耦：独立批次，共享权重与 KV 存储</text>
<text x="55" y="813" font-size="23" fill="#172e46" text-anchor="start">Prefill stream</text>
<text x="55" y="903" font-size="23" fill="#172e46" text-anchor="start">Decode stream</text>
<rect x="245" y="774" width="690" height="61" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="590.0" y="812.18" font-size="24" fill="#ac642e" text-anchor="middle">B prefill</text>
<rect x="245" y="864" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="308.0" y="900.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="386" y="864" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="449.0" y="900.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="527" y="864" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="590.0" y="900.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="668" y="864" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="731.0" y="900.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="809" y="864" width="126" height="58" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="872.0" y="900.04" font-size="22" fill="#2865a8" text-anchor="middle">A step</text>
<rect x="950" y="864" width="430" height="58" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1165.0" y="900.68" font-size="24" fill="#187264" text-anchor="middle">A + B decode</text>
<path d="M935 804 L960 804 L960 853" fill="none" stroke="#7654a5" stroke-width="2"/>
<polygon points="960,853 965.0,842.0 955.0,842.0" fill="#7654a5"/>
<text x="1090" y="813" font-size="22" fill="#7654a5" text-anchor="start">完成通知</text>
<text x="720" y="975" font-size="23" fill="#187264" text-anchor="middle">同一组 GPU 上映射同一份权重与 KV；计算、带宽和缓存仍可能争用。</text>
<text x="720" y="1051" font-size="25" fill="#172e46" text-anchor="middle">独立提交使 P/D 可以重叠执行；实际收益仍需测量。</text>
</svg>
