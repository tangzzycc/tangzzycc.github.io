<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">QKV LoRA Decode 的通用 Punica 与 RDNA 网格对比</title>
  <desc id="desc">固定 M 等于 1、rank 等于 64、QKV 输出为 4096、1024、1024。通用 shrink 使用 32 行 M tile、64 个 split-K、4 个 rank tile、3 个 slice 和 2 个 metadata group，共启动 1536 个 program；RDNA shrink 直接使用 16 个 rank tile 和 3 个 slice，共 48 个 program。通用 expand 按最大输出维度为每个 slice 启动 64 个 N tile，再乘 3 个 slice 和 2 个 group，共 384 个 program；RDNA 只展平 Q、K、V 的 64、16、16 个有效 tile，共 96 个 program。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto">
      <path d="M0.7 0.8 L6.1 3.5 L0.7 6.2" fill="none" stroke="#2865a8" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto">
      <path d="M0.7 0.8 L6.1 3.5 L0.7 6.2" fill="none" stroke="#218367" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}
    .title{font-size:40px;font-weight:700}.subtitle{font-size:20px;fill:#52677d}
    .eyebrow{font-size:18px;font-weight:700;fill:#2865b3}.heading{font-size:24px;font-weight:700}
    .label{font-size:17px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#607187}
    .tiny{font-size:12px;fill:#607187}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}
    .green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}
    .orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}
    .waste{fill:#fff0ee;stroke:#dc9d92;stroke-width:1.2;stroke-dasharray:5 4}.valid{fill:#dceafb;stroke:#8eb3d8;stroke-width:1.2}
    .flow-blue{fill:none;stroke:#2865a8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
    .flow-green{fill:none;stroke:#218367;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}
  </style>

  <rect width="1600" height="940" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">QKV LoRA Decode：program 数从哪里减少</text>
  <text x="48" y="101" class="subtitle">固定例子：M = 1，K = 2560，rank = 64，output slices = (4096, 1024, 1024)</text>
  <text x="1552" y="62" text-anchor="end" class="small">默认通用配置 vs gfx1151 专用配置</text>

  <rect x="48" y="132" width="1504" height="62" rx="13" class="gray"/>
  <text x="78" y="158" class="label">计数口径</text>
  <text x="78" y="181" class="body">一个 active adapter；通用 grid 还为 base / no-LoRA 预留一个 metadata group。数字表示 launch decomposition，不代表端到端加速比。</text>

  <text x="48" y="238" class="eyebrow">01  Shrink · X [1,2560] × Aᵀ [2560,64]</text>
  <rect x="48" y="260" width="734" height="286" rx="16" class="card"/>
  <rect x="76" y="286" width="678" height="46" rx="9" class="orange"/>
  <text x="96" y="316" class="heading">通用 Punica</text>
  <text x="730" y="315" text-anchor="end" class="mono body">64 split-K × 1 M tile × 4 rank tiles × 3 slices × 2 groups</text>

  <text x="76" y="370" class="label">M tile = 32：32 个计算行都索引 token 0</text>
  <g transform="translate(76 389)">
    <rect x="0" y="0" width="42" height="42" rx="5" class="valid"/><text x="21" y="26" text-anchor="middle" class="tiny">store</text>
    <rect x="49" y="0" width="42" height="42" rx="5" class="waste"/><text x="70" y="26" text-anchor="middle" class="tiny">repeat</text>
    <rect x="98" y="0" width="42" height="42" rx="5" class="waste"/><text x="119" y="26" text-anchor="middle" class="tiny">repeat</text>
    <rect x="147" y="0" width="42" height="42" rx="5" class="waste"/><text x="168" y="26" text-anchor="middle" class="tiny">repeat</text>
    <text x="211" y="27" class="body">…</text>
    <rect x="244" y="0" width="42" height="42" rx="5" class="waste"/><text x="265" y="26" text-anchor="middle" class="tiny">row 31</text>
  </g>
  <text x="384" y="416" class="small">只有第 1 行写回；其余行重复计算后被写回 mask 丢弃</text>

  <rect x="76" y="458" width="416" height="58" rx="9" class="purple"/>
  <text x="96" y="483" class="label">K 方向再拆成 64 份</text>
  <text x="96" y="506" class="small">先 zero-fill，partial result 通过 atomic_add 汇合</text>
  <path d="M492 487 H540" class="flow-blue"/>
  <rect x="552" y="450" width="202" height="74" rx="10" class="orange"/>
  <text x="653" y="480" text-anchor="middle" class="heading">1536</text>
  <text x="653" y="506" text-anchor="middle" class="small">launched programs</text>

  <rect x="818" y="260" width="734" height="286" rx="16" class="card"/>
  <rect x="846" y="286" width="678" height="46" rx="9" class="green"/>
  <text x="866" y="316" class="heading">RDNA Decode shrink</text>
  <text x="1500" y="315" text-anchor="end" class="mono body">1 token × ceil(64 / 4) rank tiles × 3 slices</text>

  <text x="846" y="370" class="label">Grid 直接覆盖真实 token 与 rank tile</text>
  <g transform="translate(846 390)">
    <rect x="0" y="0" width="34" height="34" rx="4" class="valid"/><rect x="40" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="80" y="0" width="34" height="34" rx="4" class="valid"/><rect x="120" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="160" y="0" width="34" height="34" rx="4" class="valid"/><rect x="200" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="240" y="0" width="34" height="34" rx="4" class="valid"/><rect x="280" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="320" y="0" width="34" height="34" rx="4" class="valid"/><rect x="360" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="400" y="0" width="34" height="34" rx="4" class="valid"/><rect x="440" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="480" y="0" width="34" height="34" rx="4" class="valid"/><rect x="520" y="0" width="34" height="34" rx="4" class="valid"/>
    <rect x="560" y="0" width="34" height="34" rx="4" class="valid"/><rect x="600" y="0" width="34" height="34" rx="4" class="valid"/>
    <text x="317" y="58" text-anchor="middle" class="small">16 rank tiles · 每个 tile 计算 4 个 rank 元素</text>
  </g>
  <rect x="846" y="474" width="416" height="50" rx="9" class="green"/>
  <text x="866" y="504" class="body">每个 program 内循环完整 K：无 split-K、zero-fill、atomic</text>
  <path d="M1276 499 H1310" class="flow-green"/>
  <rect x="1322" y="462" width="202" height="62" rx="10" class="green"/>
  <text x="1423" y="488" text-anchor="middle" class="heading">48</text>
  <text x="1423" y="511" text-anchor="middle" class="small">launched programs</text>

  <text x="48" y="598" class="eyebrow">02  Expand · T [1,64] × Bᵀ → Q / K / V</text>
  <rect x="48" y="620" width="734" height="236" rx="16" class="card"/>
  <rect x="76" y="646" width="678" height="46" rx="9" class="orange"/>
  <text x="96" y="676" class="heading">通用 Punica：每个 slice 都按 MAX_N = 4096 补齐</text>
  <g transform="translate(76 720)">
    <text x="0" y="18" class="label">Q</text><rect x="38" y="0" width="390" height="25" rx="4" class="valid"/><text x="233" y="18" text-anchor="middle" class="small">64 valid tiles</text>
    <text x="0" y="58" class="label">K</text><rect x="38" y="40" width="98" height="25" rx="4" class="valid"/><rect x="140" y="40" width="288" height="25" rx="4" class="waste"/><text x="87" y="58" text-anchor="middle" class="tiny">16 valid</text><text x="284" y="58" text-anchor="middle" class="tiny">48 early-exit</text>
    <text x="0" y="98" class="label">V</text><rect x="38" y="80" width="98" height="25" rx="4" class="valid"/><rect x="140" y="80" width="288" height="25" rx="4" class="waste"/><text x="87" y="98" text-anchor="middle" class="tiny">16 valid</text><text x="284" y="98" text-anchor="middle" class="tiny">48 early-exit</text>
  </g>
  <rect x="570" y="716" width="184" height="102" rx="10" class="orange"/>
  <text x="662" y="749" text-anchor="middle" class="heading">384</text>
  <text x="662" y="775" text-anchor="middle" class="small">1 M tile × 64 N tiles</text>
  <text x="662" y="798" text-anchor="middle" class="small">× 3 slices × 2 groups</text>

  <rect x="818" y="620" width="734" height="236" rx="16" class="card"/>
  <rect x="846" y="646" width="678" height="46" rx="9" class="green"/>
  <text x="866" y="676" class="heading">RDNA Decode expand：展平各 slice 的有效 tile</text>
  <g transform="translate(846 722)">
    <rect x="0" y="0" width="296" height="38" rx="5" class="valid"/>
    <rect x="302" y="0" width="74" height="38" rx="5" class="purple"/>
    <rect x="382" y="0" width="74" height="38" rx="5" class="purple"/>
    <text x="148" y="25" text-anchor="middle" class="body">Q · 64 tiles</text>
    <text x="339" y="25" text-anchor="middle" class="body">K · 16</text>
    <text x="419" y="25" text-anchor="middle" class="body">V · 16</text>
    <text x="228" y="70" text-anchor="middle" class="small">output_tile 直接反解 slice_id 与 slice 内偏移</text>
  </g>
  <rect x="1322" y="716" width="202" height="76" rx="10" class="green"/>
  <text x="1423" y="747" text-anchor="middle" class="heading">96</text>
  <text x="1423" y="774" text-anchor="middle" class="small">64 + 16 + 16 programs</text>

  <rect x="48" y="882" width="1504" height="42" rx="10" class="blue"/>
  <text x="800" y="909" text-anchor="middle" class="body">关键变化不是近似计算，而是让 grid 只描述真实 token、真实 rank tile 与真实输出 tile；LoRA 数学结果保持不变。</text>
</svg>
