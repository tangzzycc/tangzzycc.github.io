<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">沿一个请求理解 TTFT、ITL 与 TPOT</title><desc id="desc">客户端时间戳示例：0 → 200 → 220 → 240 → 340 → 360 ms。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="680" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">沿一个请求理解 TTFT、ITL 与 TPOT</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">客户端指标</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">客户端时间戳示例：0 → 200 → 220 → 240 → 340 → 360 ms。</text>
<rect x="26" y="115" width="1388" height="300" rx="6" fill="#ffffff" stroke="#2865a8" stroke-width="1.5"/>
<text x="50" y="153" font-size="28" fill="#2865a8" text-anchor="start">一个请求，五个输出 tokens</text>
<path d="M220 245 L1360 245" fill="none" stroke="#607187" stroke-width="2"/>
<polygon points="1360,245 1349.0,240.0 1349.0,250.0" fill="#607187"/>
<text x="220" y="175" font-size="25" fill="#607187" text-anchor="middle">提交请求</text>
<text x="220" y="206" font-size="23" fill="#607187" text-anchor="middle">0 ms</text>
<circle cx="820" cy="245" r="7" fill="#2865a8"/>
<text x="820" y="170" font-size="24" fill="#2865a8" text-anchor="middle">T1</text>
<text x="820" y="199" font-size="21" fill="#607187" text-anchor="middle">200 ms</text>
<circle cx="880" cy="245" r="7" fill="#2865a8"/>
<text x="880" y="295" font-size="24" fill="#2865a8" text-anchor="middle">T2</text>
<text x="880" y="324" font-size="21" fill="#607187" text-anchor="middle">220 ms</text>
<circle cx="940" cy="245" r="7" fill="#2865a8"/>
<text x="940" y="170" font-size="24" fill="#2865a8" text-anchor="middle">T3</text>
<text x="940" y="199" font-size="21" fill="#607187" text-anchor="middle">240 ms</text>
<circle cx="1240" cy="245" r="7" fill="#2865a8"/>
<text x="1240" y="295" font-size="24" fill="#2865a8" text-anchor="middle">T4</text>
<text x="1240" y="324" font-size="21" fill="#607187" text-anchor="middle">340 ms</text>
<circle cx="1300" cy="245" r="7" fill="#2865a8"/>
<text x="1300" y="170" font-size="24" fill="#2865a8" text-anchor="middle">T5</text>
<text x="1300" y="199" font-size="21" fill="#607187" text-anchor="middle">360 ms</text>
<path d="M220 337 L220 345 L820 345 L820 337" fill="none" stroke="#ac642e" stroke-width="2"/>
<text x="520.0" y="375" font-size="23" fill="#ac642e" text-anchor="middle">TTFT = 200 ms</text>
<path d="M820 337 L820 345 L1300 345 L1300 337" fill="none" stroke="#2865a8" stroke-width="2"/>
<text x="1060.0" y="375" font-size="23" fill="#2865a8" text-anchor="middle">生成区间 = 160 ms</text>
<rect x="26" y="442" width="435" height="105" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="243.5" y="502.82" font-size="26" fill="#7654a5" text-anchor="middle">ITL：20、20、100、20 ms</text>
<rect x="484" y="442" width="435" height="105" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="701.5" y="502.5" font-size="25" fill="#2865a8" text-anchor="middle">TPOT = 160 / 4 = 40 ms</text>
<rect x="942" y="442" width="472" height="105" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1178.0" y="502.5" font-size="25" fill="#187264" text-anchor="middle">E2E = 200 + 160 = 360 ms</text>
<text x="720" y="590" font-size="26" fill="#172e46" text-anchor="middle">平均生成速度为 25 tok/s，但其中一次输出间隔仍达到 100 ms。</text>
<text x="720" y="633" font-size="23" fill="#607187" text-anchor="middle">流式文本块可能包含多个 tokens；客户端 ITL 与 GPU 步时间的口径不同。</text>
</svg>
