<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc">
<title id="title">FA3：让矩阵乘法与 Softmax 重叠</title><desc id="desc">依据 PDF 原图重绘：中文说明、原图关系、原图示例数据，保留英文专业术语。</desc>
<defs><marker id="a2865a8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#2865a8"/></marker><marker id="a187264" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#187264"/></marker><marker id="aac642e" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#ac642e"/></marker><marker id="a7654a5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#7654a5"/></marker><marker id="a607187" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#607187"/></marker><marker id="aac428b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#ac428b"/></marker><marker id="ab45650" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#b45650"/></marker></defs>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}.mono{font-family:"DejaVu Sans Mono","LXGW WenKai GB Screen",monospace}</style>
<rect width="1440" height="1130" fill="#fbfcfe"/>
<text x="26" y="45" font-size="34" fill="#172e46" text-anchor="start" font-weight="700">FA3：让矩阵乘法与 Softmax 重叠</text>
<text x="1414" y="38" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="26" y="82" font-size="21" fill="#607187" text-anchor="start" font-weight="400">两种重叠方式：先确认独立工作，再在使用结果前等待。示意时间，不是测量数据。</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#a9c4bd" stroke-width="1.2"/></pattern></defs>
<rect x="26" y="108" width="1388" height="384" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="143.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">1. 不同 Query 行 → 不同消费者 warpgroup</text>
<path d="M1024 163 L1375.0 163.0" fill="none" stroke="#2865a8" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1385,163 1375.0,167.5 1375.0,158.5" fill="#2865a8"/>
<text x="1196.0" y="199.14" font-size="21" fill="#2865a8" text-anchor="middle" font-weight="400">时间 →</text>
<text x="134.5" y="285.82" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">warpgroup A</text>
<rect x="240" y="238" width="1064" height="80" rx="3" fill="#f5f7fa" stroke="#ced7e2" stroke-width="1.3"/>
<text x="134.5" y="389.82" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">warpgroup B</text>
<rect x="240" y="342" width="1064" height="80" rx="3" fill="#f5f7fa" stroke="#ced7e2" stroke-width="1.3"/>
<rect x="240" y="238" width="266" height="80" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="373.0" y="270.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">QK A</text>
<text x="373.0" y="301.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">Q_A × Kᵀ</text>
<rect x="506" y="238" width="266" height="80" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="639.0" y="270.8" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">Softmax A</text>
<text x="639.0" y="301.52" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">分数 → 权重</text>
<rect x="772" y="238" width="266" height="80" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="905.0" y="270.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">EV A</text>
<text x="905.0" y="301.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">E_A × V</text>
<rect x="506" y="342" width="266" height="80" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="639.0" y="374.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">QK B</text>
<text x="639.0" y="405.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">Q_B × Kᵀ</text>
<rect x="772" y="342" width="266" height="80" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="905.0" y="374.8" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">Softmax B</text>
<text x="905.0" y="405.52" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">分数 → 权重</text>
<rect x="1038" y="342" width="266" height="80" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1171.0" y="374.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">EV B</text>
<text x="1171.0" y="405.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">E_B × V</text>
<text x="786.0" y="461.32" font-size="23" fill="#172e46" text-anchor="middle" font-weight="400">A、B 分别维护自己的输出与归一化状态；同一个线程块内交错推进。</text>
<rect x="26" y="516" width="1388" height="464" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="551.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">2. 同一个 warpgroup → 连续 KV 块</text>
<text x="710.0" y="593.66" font-size="24" fill="#172e46" text-anchor="middle" font-weight="400">E[j] 已准备好；先提交 QK[j+1]，再提交 EV[j]。</text>
<text x="133.0" y="717.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">Tensor Core</text>
<text x="133.0" y="748.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">矩阵乘法</text>
<rect x="240" y="681" width="1120" height="88" rx="3" fill="#f5f7fa" stroke="#ced7e2" stroke-width="1.3"/>
<text x="133.0" y="839.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">线程工作</text>
<text x="133.0" y="870.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">Softmax / 缩放</text>
<rect x="240" y="803" width="1120" height="88" rx="3" fill="#f5f7fa" stroke="#ced7e2" stroke-width="1.3"/>
<rect x="240" y="681" width="237" height="88" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="358.5" y="717.8" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">QK[j+1]</text>
<text x="358.5" y="748.52" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">Q × K[j+1]ᵀ</text>
<rect x="477" y="681" width="515" height="88" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="734.5" y="717.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">EV[j]</text>
<text x="734.5" y="749.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">E[j] × V[j]</text>
<rect x="1164" y="681" width="196" height="88" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1262.0" y="733.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">EV[j+1]</text>
<rect x="477" y="803" width="298" height="88" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="626.0" y="839.8" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">Softmax[j+1]</text>
<text x="626.0" y="870.52" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">分数 → 权重</text>
<rect x="992" y="803" width="172" height="88" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1078.0" y="839.8" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">重缩放 u</text>
<text x="1078.0" y="870.52" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">u ← αu</text>
<path d="M477 666 L477 910" fill="none" stroke="#cfbee1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="477.0" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">wait&lt;1&gt;：QK 结果可读</text>
<path d="M992 666 L992 910" fill="none" stroke="#cfbee1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="992.0" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">wait&lt;0&gt;：旧 EV 完成</text>
<path d="M1164 847 L1244 847 L1244.0 779.0" fill="none" stroke="#187264" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1244,769 1248.5,779.0 1239.5,779.0" fill="#187264"/>
<text x="818.0" y="951.32" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">当前 EV 与下一块 Softmax 的重叠区间</text>
<rect x="26" y="1006" width="1388" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="1045.98" font-size="22" fill="#2865a8" text-anchor="middle" font-weight="700">分数可以提前算；必须等旧 EV 完成，才能重缩放累计输出 u。</text>
<text x="719.0" y="1107.98" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">EV = 未归一化权重 E × V · 每条 Query 仍保持相同的在线累加顺序。</text>
</svg>
