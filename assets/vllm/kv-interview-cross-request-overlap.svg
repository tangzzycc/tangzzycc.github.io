<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc">
<title id="title">跨请求重叠：A 继续 Load，B 使用 GPU 重算</title><desc id="desc">独立时间泳道展示区间交集；GPU busy 要取 kernel 区间 union。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="750" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">跨请求重叠：A 继续 Load，B 使用 GPU 重算</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">机制示意 · 非实测</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">独立时间泳道展示区间交集；GPU busy 要取 kernel 区间 union。</text>
<rect x="26" y="120" width="1388" height="406" rx="6" fill="#ffffff" stroke="#2865a8" stroke-width="1.5"/>
<text x="50" y="158" font-size="28" fill="#2865a8" text-anchor="start">两条资源路径服务不同请求</text>
<text x="65" y="226" font-size="27" fill="#ac642e" text-anchor="start">A · SSD</text>
<text x="65" y="343" font-size="27" fill="#187264" text-anchor="start">B · GPU</text>
<rect x="270" y="180" width="720" height="70" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="630.0" y="223.96" font-size="28" fill="#ac642e" text-anchor="middle">A promotion / I/O window</text>
<rect x="610" y="295" width="660" height="70" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="940.0" y="338.96" font-size="28" fill="#187264" text-anchor="middle">B Prefill 重算</text>
<rect x="610" y="396" width="380" height="50" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="800" y="430" font-size="26" fill="#7654a5" text-anchor="middle">I/O ∩ GPU 阶段</text>
<path d="M610 365 L610 396" fill="none" stroke="#7654a5" stroke-width="2"/>
<path d="M990 365 L990 396" fill="none" stroke="#7654a5" stroke-width="2"/>
<text x="300" y="493" font-size="26" fill="#607187" text-anchor="start">时间 →</text>
<text x="1120" y="495" font-size="23" fill="#607187" text-anchor="start">首 token 后继续 Decode</text>
<rect x="26" y="556" width="1388" height="145" rx="6" fill="#ffffff" stroke="#7654a5" stroke-width="1.5"/>
<text x="50" y="594" font-size="28" fill="#7654a5" text-anchor="start">重叠成立不保证加速：带宽、CPU 与 GPU 仍可能竞争</text>
<text x="720" y="648" font-size="25" fill="#7654a5" text-anchor="middle">当前方案不为同一个请求启动两条 winner race；共享 I/O 保留其他 waiter。</text>
</svg>
