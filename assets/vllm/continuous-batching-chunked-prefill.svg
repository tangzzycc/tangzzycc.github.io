<text x="1095.5" y="147.3600970540334" font-size="18.706167805980566" fill="#607187" text-anchor="middle" font-weight="700">宽度 ∝ scheduled-token work；不是实测 GPU 时间；斜纹 = 未调度</text>
<rect x="26" y="192" width="1388" height="351" rx="6" fill="#fff" stroke="#b45650" stroke-width="1.5"/>
<text x="720.0" y="228.86" font-size="29" fill="#b45650" text-anchor="middle" font-weight="700">A. 仅 Continuous Batching</text>
<text x="719.5" y="269.64" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">关闭 chunking：P 的 18 个 prompt tokens 在一个模型迭代内不可分割。</text>
