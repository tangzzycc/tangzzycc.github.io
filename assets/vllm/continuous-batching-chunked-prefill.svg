<rect width="1440" height="1060" fill="#fbfcfe"/>
<text x="26" y="45" font-size="34" fill="#172e46" text-anchor="start" font-weight="700">Continuous Batching 与 Chunked Prefill</text>
<text x="1414" y="38" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="26" y="82" font-size="21" fill="#607187" text-anchor="start" font-weight="400">相同请求、相同 token 数：长 prefill 是否必须占据一个很重的模型迭代？</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#a9c4bd" stroke-width="1.2"/></pattern></defs>
