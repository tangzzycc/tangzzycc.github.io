<text x="1299.5" y="490.1" font-size="20" fill="#172e46" text-anchor="middle" font-weight="400">1 个重 step</text>
<text x="718.0" y="520.32" font-size="23" fill="#b45650" text-anchor="middle" font-weight="400">完整 18-token prefill 使本轮 decode 等待更久</text>
<rect x="26" y="565" width="1388" height="351" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="720.0" y="601.86" font-size="29" fill="#ac642e" text-anchor="middle" font-weight="700">B. Continuous Batching + Chunked Prefill</text>
<text x="719.5" y="642.64" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">chunk cap = 6；同一个 P 跨三次迭代推进，每轮都运行 D1 与 D2。</text>
