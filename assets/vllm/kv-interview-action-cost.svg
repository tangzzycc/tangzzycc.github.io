<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Ready 前缀与 Pending 尾部，形成四种动作</title><desc id="desc">手算示例：candidate=4096，ready=2048；H2D=10 GB/s，Prefill=8000 tok/s。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="780" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">Ready 前缀与 Pending 尾部，形成四种动作</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">成本示例 · 非实测</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">手算示例：candidate=4096，ready=2048；H2D=10 GB/s，Prefill=8000 tok/s。</text>
<rect x="26" y="120" width="1388" height="237" rx="6" fill="#ffffff" stroke="#2865a8" stroke-width="1.5"/>
<text x="50" y="158" font-size="28" fill="#2865a8" text-anchor="start">CPU 已 ready 2048 tokens；另外 2048 等待 promotion</text>
<rect x="100" y="202" width="142" height="68" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="171.0" y="242.72" font-size="21" fill="#2865a8" text-anchor="middle">0–512</text>
<rect x="255" y="202" width="142" height="68" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="326.0" y="242.72" font-size="21" fill="#2865a8" text-anchor="middle">512–1024</text>
<rect x="410" y="202" width="142" height="68" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="481.0" y="242.72" font-size="21" fill="#2865a8" text-anchor="middle">1024–1536</text>
<rect x="565" y="202" width="142" height="68" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="636.0" y="242.72" font-size="21" fill="#2865a8" text-anchor="middle">1536–2048</text>
<rect x="720" y="202" width="142" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="791.0" y="242.72" font-size="21" fill="#ac642e" text-anchor="middle">2048–2560</text>
<rect x="875" y="202" width="142" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="946.0" y="242.72" font-size="21" fill="#ac642e" text-anchor="middle">2560–3072</text>
<rect x="1030" y="202" width="142" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1101.0" y="242.72" font-size="21" fill="#ac642e" text-anchor="middle">3072–3584</text>
<rect x="1185" y="202" width="142" height="68" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1256.0" y="242.72" font-size="21" fill="#ac642e" text-anchor="middle">3584–4096</text>
<path d="M100 292 L100 300 L708 300 L708 292" fill="none" stroke="#2865a8" stroke-width="2"/>
<text x="404.0" y="330" font-size="26" fill="#2865a8" text-anchor="middle">Ready：可立即 H2D</text>
<path d="M720 292 L720 300 L1328 300 L1328 292" fill="none" stroke="#ac642e" stroke-width="2"/>
<text x="1024.0" y="330" font-size="26" fill="#ac642e" text-anchor="middle">Pending：剩余 800 ms</text>
<rect x="26" y="385" width="1388" height="348" rx="6" fill="#ffffff" stroke="#7654a5" stroke-width="1.5"/>
<text x="50" y="423" font-size="28" fill="#7654a5" text-anchor="start">比较达到可继续执行边界的成本</text>
<text x="65" y="492" font-size="25" fill="#ac642e" text-anchor="start">WAIT_FULL</text>
<rect x="295" y="453" width="820" height="58" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="705.0" y="489.68" font-size="24" fill="#ac642e" text-anchor="middle"></text>
<text x="1140" y="492" font-size="26" fill="#ac642e" text-anchor="start">846.98 ms</text>
<text x="65" y="572" font-size="25" fill="#7654a5" text-anchor="start">RECOMPUTE</text>
<rect x="295" y="533" width="496" height="58" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="543.0" y="569.68" font-size="24" fill="#7654a5" text-anchor="middle"></text>
<text x="816" y="572" font-size="26" fill="#7654a5" text-anchor="start">512.00 ms</text>
<text x="65" y="652" font-size="25" fill="#187264" text-anchor="start">LOAD_READY</text>
<rect x="295" y="613" width="271" height="58" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="430.5" y="649.68" font-size="24" fill="#187264" text-anchor="middle"></text>
<text x="591" y="652" font-size="26" fill="#187264" text-anchor="start">279.49 ms</text>
<text x="65" y="710" font-size="25" fill="#607187" text-anchor="start">800 ms + 全部 H2D  vs  全部重算  vs  Ready H2D + Tail 重算</text>
</svg>
