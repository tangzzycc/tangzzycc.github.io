<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif;fill:#172e46}.code{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1200" height="550" fill="#fbfcfe"/>
<text x="26" y="44" font-size="27" style="fill:#172e46" font-weight="700" text-anchor="start">CogAgent：首步视觉输出与两类 KV 的生命周期</text>
<text x="26" y="77" font-size="18" style="fill:#607187" font-weight="400" text-anchor="start">正常连续生成：后续 Decode 不重跑视觉塔，继续用当前 Query 读取本层 Cross-KV</text>
<rect x="26" y="110" width="1148" height="70" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.4"/>
<text x="600.0" y="138.0" font-size="21" style="fill:#7654a5" font-weight="700" text-anchor="middle">首步视觉输出 [6658,4096]</text>
<text x="600.0" y="166.0" font-size="21" style="fill:#7654a5" font-weight="400" text-anchor="middle">直接传给 forward；当前 MRV2 路径不长期保存组合 tensor</text>
<rect x="26" y="238" width="540" height="90" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.4"/>
<text x="296.0" y="276.0" font-size="22" style="fill:#ac642e" font-weight="700" text-anchor="middle">Self-KV：图像位置与文本</text>
<text x="296.0" y="304.0" font-size="22" style="fill:#ac642e" font-weight="400" text-anchor="middle">各层写入 Prompt 历史</text>
<rect x="634" y="238" width="540" height="90" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.4"/>
<text x="904.0" y="276.0" font-size="22" style="fill:#187264" font-weight="700" text-anchor="middle">Cross-KV：6400 个视觉位置</text>
<text x="904.0" y="304.0" font-size="22" style="fill:#187264" font-weight="400" text-anchor="middle">每层用自己的 K/V 权重投影</text>
<path d="M294 180 L294 238" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M904 180 L904 238" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
<rect x="26" y="395" width="540" height="90" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.4"/>
<text x="296.0" y="433.0" font-size="21" style="fill:#ac642e" font-weight="700" text-anchor="middle">后续 Decode：追加当前输入 token 的 KV</text>
<text x="296.0" y="461.0" font-size="21" style="fill:#ac642e" font-weight="400" text-anchor="middle">长度随 decoder 生成增长</text>
<rect x="634" y="395" width="540" height="90" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.4"/>
<text x="904.0" y="433.0" font-size="20" style="fill:#187264" font-weight="700" text-anchor="middle">后续 Decode：读取本层已有 Cross-KV</text>
<text x="904.0" y="461.0" font-size="20" style="fill:#187264" font-weight="400" text-anchor="middle">长度保持 6400；Query 每步重新计算</text>
<path d="M296 328 L296 395" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M904 328 L904 395" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
<text x="600" y="525" font-size="20" style="fill:#172e46" font-weight="400" text-anchor="middle">请求完成后归还两类 blocks；若抢占释放后重算，视觉工作可能再次安排</text>
</svg>
