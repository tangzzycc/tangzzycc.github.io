<text x="441.5" y="594.2834831460674" font-size="18.65730337078652" fill="#187264" text-anchor="middle" font-weight="700">启用 Prefix Cache ·</text>
<text x="441.5" y="618.1648314606741" font-size="18.65730337078652" fill="#187264" text-anchor="middle" font-weight="700">单组</text>
<rect x="570" y="537.51" width="268" height="102.09" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
