<rect x="0" y="0" width="1440" height="996.3" rx="0" fill="#fbfcfe" stroke="none"/>
<text x="24" y="51.66" font-size="33" fill="#172e46" text-anchor="start" font-weight="700">KVCacheConfig → Scheduler 侧 Manager 对象树</text>
<text x="1415" y="45.51" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="24" y="91.02" font-size="21" fill="#607187" text-anchor="start" font-weight="400">启动期契约 → 一个 Coordinator、每组一个 Manager 和一个共享逻辑块池</text>
<rect x="24" y="114.39" width="1392" height="158.67" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="485.0" y="148.995" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">1. Scheduler KVCacheConfig：启动期输入</text>
<text x="516.0" y="174.90499999999997" font-size="17" fill="#172e46" text-anchor="middle" font-weight="400">Core 消费逻辑容量与 Group 语义；物理 Tensor 规划由 Worker 消费。</text>
<rect x="43" y="202.95" width="160" height="55.35" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="123.0" y="226.46003148705677" font-size="13.883228376477394" fill="#2865a8" text-anchor="middle" font-weight="700">num_blocks = 4096</text>
<text x="123.0" y="244.23056380894784" font-size="13.883228376477394" fill="#2865a8" text-anchor="middle" font-weight="700">共享 Block ID 容量</text>
<rect x="224" y="202.95" width="356" height="55.35" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="402.0" y="224.96052631578948" font-size="18.881578947368418" fill="#187264" text-anchor="middle" font-weight="700">kv_cache_groups = [G0, G1, G2]</text>
<text x="402.0" y="249.12894736842102" font-size="18.881578947368418" fill="#187264" text-anchor="middle" font-weight="700">有序语义：Full / Sliding / Sliding</text>
<rect x="602" y="202.95" width="322" height="55.35" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="763.0" y="224.96052631578948" font-size="18.881578947368418" fill="#ac642e" text-anchor="middle" font-weight="700">kv_cache_tensors = [...]</text>
<text x="763.0" y="249.12894736842102" font-size="18.881578947368418" fill="#ac642e" text-anchor="middle" font-weight="700">Worker 的物理布局规划</text>
<rect x="950" y="136.53" width="444" height="121.77" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="1172.0" y="168.33499999999998" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">Core 侧解释</text>
<text x="1172.0" y="200.531" font-size="14.691666666666668" fill="#172e46" text-anchor="middle" font-weight="400">✓ 容量与稳定的 Group 坐标</text>
<text x="1172.0" y="218.161" font-size="14.691666666666668" fill="#172e46" text-anchor="middle" font-weight="400">✓ 缓存策略对应的 Manager 拓扑</text>
<text x="1172.0" y="235.79100000000003" font-size="14.691666666666668" fill="#172e46" text-anchor="middle" font-weight="400">不申请 CUDA 内存，不保存 K/V 数值</text>
<rect x="24" y="297.65999999999997" width="973" height="590.4" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="510.5" y="331.03499999999997" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">2. 创建层次</text>
<text x="509.5" y="360.36" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">下方箭头表示构造与对象持有关系。</text>
<rect x="48" y="383.76" width="206" height="89.78999999999999" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="151.0" y="417.6625633771588" font-size="11.694081513660887" fill="#2865a8" text-anchor="middle" font-weight="700">EngineCore</text>
<text x="151.0" y="432.6309877146447" font-size="11.694081513660887" fill="#2865a8" text-anchor="middle" font-weight="700">_initialize_kv_caches()</text>
<text x="151.0" y="447.5994120521306" font-size="11.694081513660887" fill="#2865a8" text-anchor="middle" font-weight="700">返回 Scheduler KVCacheConfig</text>
<rect x="289" y="383.76" width="177" height="89.78999999999999" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="377.5" y="417.27592953584144" font-size="12.105394110807008" fill="#2865a8" text-anchor="middle" font-weight="700">Scheduler</text>
<text x="377.5" y="432.7708339976744" font-size="12.105394110807008" fill="#2865a8" text-anchor="middle" font-weight="700">__init__(kv_cache_config)</text>
<text x="377.5" y="448.2657384595074" font-size="12.105394110807008" fill="#2865a8" text-anchor="middle" font-weight="700">持有公共缓存服务</text>
