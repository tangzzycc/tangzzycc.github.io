<text x="164.0" y="802.7031638390557" font-size="12.68179983577125" fill="#2865a8" text-anchor="middle" font-weight="700">FullAttentionManager</text>
<rect x="262" y="761.37" width="162" height="57.81" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="343.0" y="786.7269206432645" font-size="11.826931189117976" fill="#187264" text-anchor="middle" font-weight="700">G1 · group_id 1</text>
<text x="343.0" y="801.8653925653355" font-size="11.826931189117976" fill="#187264" text-anchor="middle" font-weight="700">SlidingWindowManager</text>
<rect x="441" y="761.37" width="162" height="57.81" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="522.0" y="786.7269206432645" font-size="11.826931189117976" fill="#ac642e" text-anchor="middle" font-weight="700">G2 · group_id 2</text>
