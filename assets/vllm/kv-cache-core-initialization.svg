<text x="611.0" y="407.4168797584668" font-size="13.441848254134943" fill="#2865a8" text-anchor="middle" font-weight="700">KVCacheManager</text>
<text x="611.0" y="424.6224455237595" font-size="13.441848254134943" fill="#2865a8" text-anchor="middle" font-weight="700">Scheduler 的逻辑资源 API</text>
<text x="611.0" y="441.8280112890523" font-size="13.441848254134943" fill="#2865a8" text-anchor="middle" font-weight="700">coordinator · block_pool 别名</text>
