<text x="915.5" y="604.9569230769231" font-size="13.598901098901099" fill="#607187" text-anchor="middle" font-weight="700">Coordinator</text>
<text x="915.5" y="622.3635164835165" font-size="13.598901098901099" fill="#607187" text-anchor="middle" font-weight="700">共用基类初始化</text>
