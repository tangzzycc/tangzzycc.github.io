<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">权重加载：先确定量化语义，再转换 GPU 布局</title><desc id="desc">同一逻辑 INT4 权重经历文件参数、加载后处理与 runtime 三种表示。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="640" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">权重加载：先确定量化语义，再转换 GPU 布局</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">GPTQ / Linear</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">同一逻辑 INT4 权重经历文件参数、加载后处理与 runtime 三种表示。</text>
<rect x="40" y="140" width="355" height="75" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="217.5" y="185.5" font-size="25" fill="#2865a8" text-anchor="middle">checkpoint：qweight / scales</text>
<rect x="500" y="140" width="440" height="75" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="720.0" y="185.5" font-size="25" fill="#ac642e" text-anchor="middle">quant_method 加载后处理</text>
<rect x="1050" y="140" width="350" height="75" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1225.0" y="185.5" font-size="25" fill="#187264" text-anchor="middle">runtime kernel 参数</text>
<path d="M395 177 L500 177" fill="none" stroke="#607187" stroke-width="2"/>
<polygon points="500,177 489.0,172.0 489.0,182.0" fill="#607187"/>
<path d="M940 177 L1050 177" fill="none" stroke="#607187" stroke-width="2"/>
<polygon points="1050,177 1039.0,172.0 1039.0,182.0" fill="#607187"/>
<rect x="26" y="265" width="1388" height="130" rx="6" fill="#ffffff" stroke="#2865a8" stroke-width="1.5"/>
<text x="50" y="303" font-size="28" fill="#2865a8" text-anchor="start">语义：显式零点由配置决定，不由 qzeros 是否存在决定</text>
<rect x="55" y="323" width="590" height="50" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="350.0" y="355.68" font-size="24" fill="#2865a8" text-anchor="middle">zero_points=False → 清理冗余 qzeros tensor</text>
<rect x="745" y="323" width="630" height="50" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1060.0" y="355.68" font-size="24" fill="#187264" text-anchor="middle">保留参数接口名称 → backend 可以接收缺省值</text>
<rect x="26" y="430" width="1388" height="165" rx="6" fill="#ffffff" stroke="#ac642e" stroke-width="1.5"/>
<text x="50" y="468" font-size="28" fill="#ac642e" text-anchor="start">布局：仅移动 nibble，解码后的逻辑权重保持一致</text>
<rect x="60" y="495" width="455" height="62" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="287.5" y="534.32" font-size="26" fill="#2865a8" text-anchor="middle">低位顺序：0 1 2 3 4 5 6 7</text>
<rect x="785" y="495" width="600" height="62" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1085.0" y="534.32" font-size="26" fill="#ac642e" text-anchor="middle">shuffle 顺序：0 2 4 6 1 3 5 7</text>
<path d="M515 526 L785 526" fill="none" stroke="#607187" stroke-width="2"/>
<polygon points="785,526 774.0,521.0 774.0,531.0" fill="#607187"/>
<text x="545" y="515" font-size="23" fill="#607187" text-anchor="start">packed word</text>
<text x="555" y="550" font-size="23" fill="#607187" text-anchor="start">内重排</text>
</svg>
