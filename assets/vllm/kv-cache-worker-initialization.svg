<rect x="0" y="0" width="1440" height="1141.59375" rx="0" fill="#fbfcfe" stroke="none"/>
<text x="24" y="51.66" font-size="33" fill="#172e46" text-anchor="start" font-weight="700">每个 Worker 的 KV Cache 初始化路径</text>
<text x="1415" y="45.51" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="24" y="91.02" font-size="21" fill="#607187" text-anchor="start" font-weight="400">配置列表统一分发；每个 Rank 选择一份配置，再建立自己的 GPU 状态</text>
<rect x="24" y="118.08" width="1392" height="52.89" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.2"/>
<text x="720.0" y="151.325" font-size="20" fill="#2865a8" text-anchor="middle" font-weight="400">启动顺序：init_worker() → init_device() → load_model() → profile + project → initialize_from_config()</text>
<rect x="24" y="193.10999999999999" width="1392" height="289.05" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="226.48499999999999" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">1. 全局规划成为各 Rank 的本地输入</text>
<text x="720.0" y="256.425" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">投影保留 Group 坐标，只保留各 Worker 实际拥有的层。</text>
<rect x="45" y="284.13" width="253" height="164.82" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="171.5" y="315.935" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">EngineCore</text>
<text x="171.5" y="352.33826086956526" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">_initialize_kv_caches()</text>
<text x="171.5" y="376.27434782608697" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">get_kv_cache_configs()</text>
<text x="171.5" y="399.314347826087" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">生成各 Worker 规划</text>
<text x="171.5" y="423.25043478260875" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">把配置列表交给 Executor</text>
<rect x="339" y="273.06" width="383" height="188.19" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="530.5" y="304.50214338167797" font-size="18.31512759317055" fill="#187264" text-anchor="middle" font-weight="700">kv_cache_configs: list[KVCacheConfig]</text>
<rect x="357" y="318.57" width="346" height="51.66" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="530.0" y="339.90800805999294" font-size="14.973306466690207" fill="#607187" text-anchor="middle" font-weight="700">config[0] · rank 0 · full.0, sw.0, sw.1</text>
<text x="530.0" y="359.0738403373564" font-size="14.973306466690207" fill="#607187" text-anchor="middle" font-weight="700">num_blocks = 4096 · 本地 Tensors / Layers</text>
<rect x="357" y="384.99" width="346" height="51.66" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="530.0" y="406.3280080599929" font-size="14.973306466690207" fill="#607187" text-anchor="middle" font-weight="700">config[1] · rank 1 · full.1, sw.2, sw.3</text>
<text x="530.0" y="425.49384033735635" font-size="14.973306466690207" fill="#607187" text-anchor="middle" font-weight="700">num_blocks = 4096 · 本地 Tensors / Layers</text>
<text x="530.0" y="454.66499999999996" font-size="15" fill="#172e46" text-anchor="middle" font-weight="400">相同 Group 顺序 · Worker 本地物理规划</text>
<rect x="765" y="297.65999999999997" width="211" height="136.53" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="870.5" y="330.397622730403" font-size="16.003323094413048" fill="#2865a8" text-anchor="middle" font-weight="700">Executor</text>
<text x="870.5" y="350.88187629125173" font-size="16.003323094413048" fill="#2865a8" text-anchor="middle" font-weight="700">collective_rpc(</text>
<text x="870.5" y="371.3661298521004" font-size="16.003323094413048" fill="#2865a8" text-anchor="middle" font-weight="700">&quot;initialize_from_config&quot;,</text>
<text x="870.5" y="391.8503834129491" font-size="16.003323094413048" fill="#2865a8" text-anchor="middle" font-weight="700">kv_cache_configs</text>
<text x="870.5" y="412.3346369737978" font-size="16.003323094413048" fill="#2865a8" text-anchor="middle" font-weight="700">)</text>
<rect x="1019" y="269.37" width="375" height="191.88" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="1206.5" y="301.5135280033881" font-size="20.378023539376883" fill="#187264" text-anchor="middle" font-weight="700">每个 Rank 的 WorkerWrapperBase</text>
<rect x="1036" y="317.34" width="341" height="52.89" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="1206.5" y="350.925" font-size="21" fill="#607187" text-anchor="middle" font-weight="700">rank 0：list[0] → config[0]</text>
<rect x="1036" y="387.45" width="341" height="52.89" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1206.5" y="408.55421052631584" font-size="17.802631578947366" fill="#187264" text-anchor="middle" font-weight="700">rank 1：list[1] → config[1]</text>
<text x="1206.5" y="431.3415789473685" font-size="17.802631578947366" fill="#187264" text-anchor="middle" font-weight="700">下方跟踪此 Rank</text>
<path d="M298 364.08 L330.0 364.08" fill="none" stroke="#2865a8" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="339,364.08 330.0,368.4 330.0,359.76" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M722 364.08 L756.0 364.08" fill="none" stroke="#2865a8" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="765,364.08 756.0,368.4 756.0,359.76" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M976 364.08 L1010.0 364.08" fill="none" stroke="#2865a8" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1019,364.08 1010.0,368.4 1010.0,359.76" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<rect x="24" y="507.99" width="1392" height="448.95" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="541.365" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">2. 跟踪 Rank 1：一份配置经过四个对象边界</text>
<text x="720.0" y="573.765" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">每次调用委托控制，并在接收对象中留下具体的状态变化。</text>
<rect x="45" y="603.93" width="253" height="290.28" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="171.5" y="635.2788725705576" font-size="21.658448736934034" fill="#187264" text-anchor="middle" font-weight="700">WorkerWrapperBase</text>
<text x="171.5" y="677.9894117647059" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">initialize_from_config(list)</text>
<text x="171.5" y="721.8194117647059" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">选择：local =</text>
<text x="171.5" y="744.8594117647059" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">list[global_rank] = list[1]</text>
<text x="171.5" y="793.4488235294118" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">调用后：向 Worker 传递</text>
<text x="171.5" y="816.4888235294118" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">一份 KVCacheConfig</text>
<text x="171.5" y="860.3188235294118" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">CPU 侧只负责 Rank 选择</text>
<rect x="334" y="603.93" width="268" height="290.28" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="468.0" y="635.735" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">Worker</text>
<text x="468.0" y="679.3580640252824" font-size="15.64136478024229" fill="#172e46" text-anchor="middle" font-weight="400">initialize_from_config(config[1])</text>
<text x="468.0" y="724.44" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">num_gpu_blocks = 4096</text>
<text x="468.0" y="768.72" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">按需初始化 KV Transfer</text>
<text x="468.0" y="813.0" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">进入 KV 显存池上下文</text>
<text x="468.0" y="855.4400508690122" font-size="12.588384908859686" fill="#172e46" text-anchor="middle" font-weight="400">Worker 持有资源边界；Runner 完成装配</text>
<rect x="641" y="585.48" width="351" height="327.18" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="816.5" y="617.285" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">GPUModelRunner</text>
<text x="816.5" y="661.1975000000001" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">initialize_kv_cache(config[1])</text>
<text x="816.5" y="704.2475000000001" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">self.kv_cache_config = deepcopy(...)</text>
<text x="816.5" y="747.2975" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">初始化 AttentionGroups 与 Backends</text>
<text x="816.5" y="789.4956127241675" font-size="15.494449188727582" fill="#172e46" text-anchor="middle" font-weight="400">准备 Kernel block sizes / metadata builders</text>
<text x="816.5" y="833.3975" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">重新初始化 InputBatch Block Tables</text>
<text x="816.5" y="876.4475000000001" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">Group 语义与运行时寻址结构匹配配置</text>
<rect x="1028" y="567.03" width="366" height="364.08" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1211.0" y="598.835" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">GPU Storage + 层绑定</text>
<text x="1211.0" y="640.1850000000001" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">initialize_kv_cache_tensors()</text>
<text x="1211.0" y="677.085" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">1. 分配 uniform / raw backing Tensors</text>
<text x="1211.0" y="713.985" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">2. 构造 Backend 所需的 Layer Views</text>
<text x="1211.0" y="750.885" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">3. 将各 View 绑定到模型层</text>
<text x="1211.0" y="787.785" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">GPU Tensors：真实 K/V 或 State 存储</text>
<text x="1211.0" y="824.6850000000001" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">Layer Views：layer_name → Tensor</text>
<text x="1211.0" y="861.5069015565839" font-size="17.770298695835088" fill="#172e46" text-anchor="middle" font-weight="400">forward_context[layer].kv_cache = view</text>
<text x="1211.0" y="898.485" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">模型可寻址已分配的 Cache Pages</text>
<path d="M298 755.22 L325.0 755.22" fill="none" stroke="#2865a8" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="334,755.22 325.0,759.5400000000001 325.0,750.9" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M602 755.22 L632.0 755.22" fill="none" stroke="#2865a8" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="641,755.22 632.0,759.5400000000001 632.0,750.9" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M992 755.22 L1019.0 755.22" fill="none" stroke="#ac642e" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1028,755.22 1019.0,759.5400000000001 1019.0,750.9" fill="#ac642e" stroke="#ac642e" stroke-width="0"/>
<path d="M1206 440.34 L1206 494.46 L15 494.46 L15 591.63 L171 591.63 L171.0 594.93" fill="none" stroke="#187264" stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="171,603.93 166.68,594.93 175.32,594.93" fill="#187264" stroke="#187264" stroke-width="0"/>
<rect x="25.0" y="982.77" width="1390.0" height="47.97" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.2"/>
<text x="720.0" y="1013.555" font-size="20" fill="#7654a5" text-anchor="middle" font-weight="700">Rank 1：投影层集合 → AttentionGroups + InputBatch Tables → GPU backing allocations + Layer Views → 模型层绑定</text>
<text x="720.0" y="1059.0" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">所有 Rank 保持相同 Block ID 容量与 Group 顺序，在本地 GPU 地址空间建立自己的缓存。</text>
<text x="720.0" y="1092.21" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">全部 Worker 完成后，Executor 继续执行 compile_or_warm_up_model()。</text>
<text x="720.0" y="1133.01" font-size="15" fill="#172e46" text-anchor="middle" font-weight="400">get_kv_cache_configs() → Executor.initialize_from_config() → WorkerWrapperBase → Worker → GPUModelRunner.initialize_kv_cache()</text>
</svg>
