<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
<title id="title">CogAgent：一张图片的两路视觉特征怎样进入首步执行</title><desc id="desc">单请求示例：258 个 decoder 图像位置，6400 个 cross source，6658 行组合输出</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#2865a8"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#187264"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#ac642e"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#7654a5"/></marker>
<marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#607187"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#b45650"/></marker>
</defs>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif;fill:#172e46}.code{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1200" height="665" fill="#fbfcfe"/>
<text x="26" y="44" font-size="27" style="fill:#172e46" font-weight="700" text-anchor="start">CogAgent：一张图片的两路视觉特征怎样进入首步执行</text>
<text x="26" y="77" font-size="18" style="fill:#607187" font-weight="400" text-anchor="start">单请求示例：258 个 decoder 图像位置，6400 个 cross source，6658 行组合输出</text>
<rect x="27" y="110" width="230" height="74" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.4"/>
<text x="142.0" y="140.0" font-size="20" style="fill:#2865a8" font-weight="700" text-anchor="middle">图片与文本</text>
<text x="142.0" y="168.0" font-size="20" style="fill:#2865a8" font-weight="400" text-anchor="middle">processor 双分辨率处理</text>
<rect x="328" y="110" width="360" height="74" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.4"/>
<text x="508.0" y="140.0" font-size="21" style="fill:#ac642e" font-weight="700" text-anchor="middle">224×224 小视觉塔</text>
<text x="508.0" y="168.0" font-size="21" style="fill:#ac642e" font-weight="400" text-anchor="middle">输出 [258,4096]</text>
<rect x="773" y="110" width="400" height="74" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.4"/>
<text x="973.0" y="140.0" font-size="21" style="fill:#187264" font-weight="700" text-anchor="middle">1120×1120 高分辨率塔</text>
<text x="973.0" y="168.0" font-size="21" style="fill:#187264" font-weight="400" text-anchor="middle">输出 [6400,1024]</text>
<path d="M257 132 L279 132 L279 94 L508 94 L508 110" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M257 168 L280 168 L280 210 L973 210 L973 184" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
<rect x="328" y="245" width="845" height="81" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.4"/>
<text x="750.5" y="278.5" font-size="21" style="fill:#7654a5" font-weight="700" text-anchor="middle">组合输出 [6658,4096]</text>
<text x="750.5" y="306.5" font-size="21" style="fill:#7654a5" font-weight="400" text-anchor="middle">前 258 行：图像 embedding；后 6400 行：1024 有效通道，其余补零</text>
<path d="M508 184 L508 245" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M973 184 L973 245" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
<text x="27" y="274" font-size="19" style="fill:#2865a8" font-weight="700" text-anchor="start">MRV2 EncoderRunner</text>
<text x="27" y="305" font-size="18" style="fill:#2865a8" font-weight="400" text-anchor="start">调用 embed_multimodal()</text>
<text x="27" y="344" font-size="18" style="fill:#7654a5" font-weight="400" text-anchor="start">首步直接传给 forward</text>
<rect x="27" y="393" width="513" height="84" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.4"/>
<text x="283.5" y="428.0" font-size="21" style="fill:#ac642e" font-weight="700" text-anchor="middle">前 258 行替换 decoder 图像 embedding</text>
<text x="283.5" y="456.0" font-size="21" style="fill:#ac642e" font-weight="400" text-anchor="middle">与文本共同进入 Self-Attention</text>
<rect x="653" y="393" width="520" height="84" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.4"/>
<text x="913.0" y="428.0" font-size="21" style="fill:#187264" font-weight="700" text-anchor="middle">后 6400 行作为 cross source</text>
<text x="913.0" y="456.0" font-size="21" style="fill:#187264" font-weight="400" text-anchor="middle">各层分别投影成本层 K/V</text>
<path d="M508 326 L508 358 L283 358 L283 393" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M973 326 L973 357 L913 357 L913 393" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
<rect x="27" y="548" width="1146" height="78" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.4"/>
<text x="600.0" y="580.0" font-size="22" style="fill:#2865a8" font-weight="700" text-anchor="middle">32 层：Self-Attention → Cross-Attention → MLP</text>
<text x="600.0" y="608.0" font-size="22" style="fill:#2865a8" font-weight="400" text-anchor="middle">最终 Norm、LM head 与采样，得到首 token</text>
<path d="M283 477 L283 548" fill="none" stroke="#ac642e" stroke-width="2" marker-end="url(#orange)"/>
<path d="M913 477 L913 548" fill="none" stroke="#187264" stroke-width="2" marker-end="url(#green)"/>
</svg>
