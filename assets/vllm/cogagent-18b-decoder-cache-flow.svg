<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">CogAgent Decoder 层及其在 Prefill 与 Decode 阶段的缓存生命周期</title>
  <desc id="desc">Prefill 阶段由图像 token mask 将 decoder token 路由到语言或视觉投影，self-attention 写入持续增长的 decoder KV cache，cross-attention 将 6400 个 CrossVision state 投影为逐层固定的 cross KV cache。Decode 阶段的新语言 token 使用语言专家，追加一个 self KV 位置并复用固定的 cross KV，无需重新运行视觉编码器。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#2865a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#8051aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#667588" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}
    .title{font-size:40px;font-weight:700}.subtitle{font-size:21px;fill:#52677d}
    .eyebrow{font-size:18px;font-weight:700;letter-spacing:0;fill:#2865b3}
    .section{font-size:21px;font-weight:700}.label{font-size:17px;font-weight:700}
    .body{font-size:16px}.small{font-size:14px;fill:#607187}.tiny{font-size:12px;fill:#607187}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px}
    .card{fill:#fff;stroke:#ced7e2;stroke-width:2}
    .blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}
    .green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}
    .purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}
    .orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}
    .flow-blue{fill:none;stroke:#2865a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
    .flow-purple{fill:none;stroke:#8051aa;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-purple)}
    .flow-gray{fill:none;stroke:#667588;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-gray)}
    .read{fill:none;stroke:#8051aa;stroke-width:2.2;stroke-dasharray:7 6;stroke-linecap:round;marker-end:url(#arrow-purple)}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .mixed{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif}
  </style>

  <rect width="1600" height="1160" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">CogAgent Decoder：路由计算与两种 KV 生命周期</text>
  <text x="48" y="101" class="subtitle">Prefill 创建 Self K/V 与 Cross K/V；Decode 仅增长 Self K/V，并复用视觉缓存。</text>
  <text x="1552" y="62" text-anchor="end" class="small">单个 Decoder 层 · 重复 32 次</text>

  <text x="48" y="151" class="eyebrow">01  Prefill：构建两类 KV Cache</text>
  <rect x="48" y="174" width="1504" height="530" rx="16" class="card"/>
  <rect x="76" y="204" width="238" height="142" rx="11" class="blue"/>
  <text x="96" y="237" class="section">Decoder 隐状态</text>
  <text x="96" y="268" class="mono">X [T,4096]</text>
  <text x="96" y="297" class="small">258 个视觉 Embedding + 文本</text>
  <rect x="96" y="313" width="24" height="18" fill="#fff" stroke="#9fb7d2"/>
  <rect x="120" y="313" width="104" height="18" fill="#cfe1f5" stroke="#9fb7d2"/>
  <rect x="224" y="313" width="66" height="18" fill="#fff" stroke="#9fb7d2"/>
  <text x="108" y="327" text-anchor="middle" class="tiny">B</text>
  <text x="172" y="327" text-anchor="middle" class="tiny">视觉 ×257</text>
  <text x="257" y="327" text-anchor="middle" class="tiny">EOI + 文本</text>
  <path d="M314 275 H360" class="flow-blue"/>

  <rect x="372" y="196" width="348" height="302" rx="12" class="green"/>
  <text x="396" y="230" class="section">路由 Self-attention</text>
  <text x="396" y="257" class="small">相邻 image ID 决定每行使用哪组投影</text>
  <rect x="396" y="280" width="300" height="76" rx="8" fill="#fff" stroke="#91c5b5"/>
  <rect x="408" y="293" width="126" height="25" rx="4" fill="#dff1eb" stroke="#91c5b5"/>
  <text x="471" y="311" text-anchor="middle" class="tiny">语言 mask</text>
  <rect x="546" y="293" width="138" height="25" rx="4" fill="#dceafb" stroke="#9fb7d2"/>
  <text x="615" y="311" text-anchor="middle" class="tiny">视觉 mask</text>
  <text x="408" y="343" class="mono">QKV: 4096 → 3 × 4096</text>
  <rect x="632" y="326" width="52" height="22" rx="4" class="orange"/>
  <text x="658" y="342" text-anchor="middle" class="tiny">AWQ</text>
  <rect x="396" y="371" width="300" height="50" rx="8" fill="#fff" stroke="#91c5b5"/>
  <text x="412" y="401" class="body">self-attention · 32 heads × 128</text>
  <rect x="396" y="436" width="300" height="43" rx="8" fill="#fff" stroke="#91c5b5"/>
  <text x="412" y="463" class="mono">dense: 4096 → 4096</text>
  <rect x="632" y="446" width="52" height="22" rx="4" class="orange"/>
  <text x="658" y="462" text-anchor="middle" class="tiny">AWQ</text>
  <path d="M720 275 H766" class="flow-blue"/>

  <rect x="778" y="196" width="442" height="302" rx="12" class="purple"/>
  <text x="802" y="230" class="section">Cross-attention</text>
  <text x="802" y="257" class="small">语言行与图像行共享同一模块</text>
  <rect x="802" y="280" width="190" height="72" rx="8" fill="#fff" stroke="#bba7d2"/>
  <text x="818" y="307" class="label">Q Linear</text>
  <text x="818" y="335" class="mono">4096 → 1024</text>
  <rect x="934" y="288" width="46" height="20" rx="4" class="orange"/>
  <text x="957" y="303" text-anchor="middle" class="tiny">AWQ</text>
  <rect x="1006" y="280" width="190" height="72" rx="8" fill="#fff" stroke="#bba7d2"/>
  <text x="1022" y="307" class="label">K/V Linear</text>
  <text x="1022" y="335" class="mono">1024 → 2 × 1024</text>
  <rect x="1138" y="288" width="46" height="20" rx="4" class="orange"/>
  <text x="1161" y="303" text-anchor="middle" class="tiny">AWQ</text>
  <rect x="1006" y="358" width="190" height="24" rx="5" fill="#fff" stroke="#bba7d2"/>
  <text x="1101" y="375" text-anchor="middle" class="tiny">源状态 [6400,1024]</text>
  <path d="M1101 358 V352" class="flow-purple"/>
  <rect x="802" y="389" width="394" height="43" rx="8" fill="#fff" stroke="#bba7d2"/>
  <text x="818" y="416" class="body">encoder-decoder attention · 32 heads × 32</text>
  <rect x="802" y="445" width="394" height="34" rx="8" fill="#fff" stroke="#bba7d2"/>
  <text x="818" y="468" class="mono">dense: 1024 → 4096</text>
  <rect x="1138" y="452" width="46" height="20" rx="4" class="orange"/>
  <text x="1161" y="467" text-anchor="middle" class="tiny">AWQ</text>
  <path d="M1220 275 H1266" class="flow-blue"/>

  <rect x="1278" y="196" width="246" height="302" rx="12" class="orange"/>
  <text x="1302" y="230" class="section">路由 MLP</text>
  <text x="1302" y="258" class="small">复用同一行 mask，选择两个专家</text>
  <rect x="1302" y="282" width="198" height="67" rx="8" fill="#fff" stroke="#e0b992"/>
  <text x="1318" y="309" class="label">语言 MLP</text>
  <text x="1318" y="335" class="small">gate_up + down</text>
  <rect x="1302" y="362" width="198" height="67" rx="8" fill="#fff" stroke="#e0b992"/>
  <text x="1318" y="389" class="label">视觉 MLP</text>
  <text x="1318" y="415" class="small">gate_up + down</text>
  <rect x="1302" y="444" width="198" height="32" rx="5" fill="#ffe3c9" stroke="#d9a674"/>
  <text x="1401" y="465" text-anchor="middle" class="tiny">Decoder Linear 使用 quant_config</text>

  <rect x="76" y="566" width="558" height="100" rx="11" class="blue"/>
  <text x="98" y="594" class="section">Self KV Cache · 每层独立</text>
  <text x="98" y="620" class="mixed">逻辑 K,V [T,32,128]</text>
  <g transform="translate(270 632)">
    <rect x="0" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <rect x="48" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <rect x="96" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <rect x="144" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <rect x="192" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <rect x="240" y="0" width="48" height="28" fill="#dceafb" stroke="#8fb2d5"/>
    <text x="308" y="20" class="small">持续增长</text>
  </g>
  <path d="M522 498 V544 H354 V566" class="flow-blue"/>

  <rect x="666" y="566" width="858" height="100" rx="11" class="purple"/>
  <text x="688" y="594" class="section">Cross KV Cache · 每层独立</text>
  <text x="688" y="620" class="mixed">逻辑 K,V [6400,32,32]</text>
  <rect x="910" y="632" width="420" height="28" rx="4" fill="#ded3ec" stroke="#a98ac5"/>
  <path d="M926 632 V660 M942 632 V660 M958 632 V660 M974 632 V660 M990 632 V660 M1006 632 V660 M1022 632 V660 M1038 632 V660 M1054 632 V660 M1070 632 V660 M1086 632 V660 M1102 632 V660 M1118 632 V660 M1134 632 V660 M1150 632 V660 M1166 632 V660 M1182 632 V660 M1198 632 V660 M1214 632 V660 M1230 632 V660 M1246 632 V660 M1262 632 V660 M1278 632 V660 M1294 632 V660 M1310 632 V660" stroke="#bda7d3" stroke-width="1"/>
  <text x="1350" y="652" class="small">Prefill 后固定</text>
  <path d="M1180 352 H1238 V548 H1120 V566" class="flow-purple"/>

  <text x="48" y="762" class="eyebrow">02  Decode：追加 Self KV，复用 Cross KV</text>
  <rect x="48" y="786" width="1504" height="274" rx="16" class="card"/>
  <rect x="76" y="824" width="216" height="94" rx="10" class="blue"/>
  <text x="96" y="856" class="section">一个新 Token</text>
  <text x="96" y="885" class="small">仅使用语言专家</text>
  <text x="96" y="906" class="mono">[1,4096]</text>
  <path d="M292 871 H348" class="flow-blue"/>
  <rect x="360" y="816" width="326" height="110" rx="10" class="green"/>
  <text x="382" y="849" class="section">路由 Self-attention</text>
  <text x="382" y="879" class="body">读取历史位置</text>
  <text x="382" y="904" class="body">追加一个 K/V 位置</text>
  <path d="M686 871 H742" class="flow-blue"/>
  <rect x="754" y="816" width="326" height="110" rx="10" class="purple"/>
  <text x="776" y="849" class="section">Cross-attention</text>
  <text x="776" y="879" class="body">只投影新的 Query</text>
  <text x="776" y="904" class="body">读取已有的 6400-token K/V</text>
  <path d="M1080 871 H1136" class="flow-blue"/>
  <rect x="1148" y="816" width="238" height="110" rx="10" class="orange"/>
  <text x="1170" y="849" class="section">语言 MLP</text>
  <text x="1170" y="879" class="body">gate_up + down</text>
  <text x="1170" y="904" class="small">视觉专家不参与</text>
  <path d="M1386 871 H1430" class="flow-blue"/>
  <rect x="1442" y="835" width="82" height="72" rx="9" fill="#e8f1fb" stroke="#a9c4df"/>
  <text x="1483" y="864" text-anchor="middle" class="label">下一</text>
  <text x="1483" y="888" text-anchor="middle" class="label">层</text>
  <rect x="360" y="956" width="326" height="66" rx="9" fill="#eef5fc" stroke="#a9c4df"/>
  <text x="382" y="983" class="label">Self KV</text>
  <text x="382" y="1008" class="small">T 个缓存位置 → T + 1</text>
  <path d="M523 926 V956" class="flow-blue"/>
  <rect x="754" y="956" width="326" height="66" rx="9" fill="#f3eff9" stroke="#cfbee1"/>
  <text x="776" y="983" class="label">Cross KV</text>
  <text x="776" y="1008" class="small">仍为 6400 个位置，只读复用</text>
  <path d="M917 956 V926" class="read"/>
  <rect x="1110" y="956" width="414" height="66" rx="9" fill="#f7f9fc" stroke="#d7e0ea"/>
  <text x="1132" y="983" class="label">不重复视觉侧计算</text>
  <text x="1132" y="1008" class="small">无需重跑 Processor、EVA Tower 或 CrossVision</text>

  <text x="48" y="1110" class="small">两种缓存的 shape 与生命周期都不同：Decoder Self K/V 随 token 逐步增长；视觉 Cross K/V 在 Prefill 时逐层生成一次，此后持续复用。</text>
  <text x="48" y="1137" class="small">Attention Metadata 必须读取各 layer group 自己的 kv_cache_spec，不能假设全局只有一种 head size。</text>
</svg>
