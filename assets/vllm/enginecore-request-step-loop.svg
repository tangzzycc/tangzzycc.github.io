<title id="title">一个请求在 vLLM V1 EngineCore 中如何前进</title><desc id="desc">按 PDF 原图重构。中文说明为主，保留英文专业术语；类继承、对象持有、跨进程通信和执行顺序使用对应连线。</desc>
