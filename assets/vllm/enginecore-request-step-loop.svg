<rect x="0" y="0" width="1440" height="810.4306220095693" rx="0" fill="#fbfcfe" stroke="none" stroke-width="1.3"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start" font-weight="700">一个请求在 vLLM V1 EngineCore 中如何前进</text>
<text x="1410" y="39" font-size="17" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="26" y="78" font-size="23" fill="#607187" text-anchor="start" font-weight="400">传输 → 调度 → 执行 → 更新状态 → 重复</text>
<rect x="102" y="99" width="1255" height="157" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="116" y="126" font-size="24" fill="#2865a8" text-anchor="start" font-weight="700">A. 进入 EngineCore</text>
<rect x="116" y="133" width="280" height="114" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<circle cx="136" cy="158" r="16" fill="#2865a8"/>
<text x="136" y="165" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="274.0" y="161.82" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">提交请求</text>
<text x="256.0" y="191.88197806065583" font-size="17.299935472517156" fill="#172e46" text-anchor="middle" font-weight="400">EngineCoreClient._send_input()</text>
<text x="256.0" y="240.94" font-size="16" fill="#2865a8" text-anchor="middle" font-weight="700">EngineCoreRequest</text>
<rect x="447" y="133" width="280" height="114" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<circle cx="467" cy="158" r="16" fill="#2865a8"/>
<text x="467" y="165" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="605.0" y="161.82" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">跨越进程边界</text>
<text x="587.0" y="182.01990049751245" font-size="15.920398009950251" fill="#172e46" text-anchor="middle" font-weight="400">ZMQ ROUTER → DEALER</text>
<text x="587.0" y="200.80597014925374" font-size="15.920398009950251" fill="#172e46" text-anchor="middle" font-weight="400">请求类型 + msgpack</text>
<text x="587.0" y="240.94" font-size="16" fill="#2865a8" text-anchor="middle" font-weight="700">API Server │ EngineCore</text>
<rect x="770" y="133" width="250" height="114" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<circle cx="790" cy="158" r="16" fill="#2865a8"/>
<text x="790" y="165" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="913.0" y="161.82" font-size="23" fill="#2865a8" text-anchor="middle" font-weight="700">接收与解码</text>
<text x="895.0" y="185.0" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">input_thread /</text>
<text x="895.0" y="206.24" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">process_input_sockets()</text>
<rect x="1078" y="133" width="263" height="114" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<circle cx="1098" cy="158" r="16" fill="#2865a8"/>
<text x="1098" y="165" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="1227.5" y="161.65488323509663" font-size="22.51436245616653" fill="#2865a8" text-anchor="middle" font-weight="700">创建运行时 Request</text>
<text x="1209.5" y="190.7228830895708" font-size="13.890832616384667" fill="#172e46" text-anchor="middle" font-weight="400">Request.from_engine_core_request()</text>
<text x="1209.5" y="240.94" font-size="16" fill="#2865a8" text-anchor="middle" font-weight="700">input_queue</text>
<path d="M396 180 L437.0 180.0" fill="none" stroke="#2865a8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="447,180 437.0,184.8 437.0,175.2" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M727 180 L760.0 180.0" fill="none" stroke="#2865a8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="770,180 760.0,184.8 760.0,175.2" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<path d="M1020 180 L1068.0 180.0" fill="none" stroke="#2865a8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1078,180 1068.0,184.8 1068.0,175.2" fill="#2865a8" stroke="#2865a8" stroke-width="0"/>
<rect x="102" y="273" width="1255" height="146" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="116" y="300" font-size="24" fill="#187264" text-anchor="start" font-weight="700">B. 主线程调度一个 step</text>
<rect x="116" y="307" width="280" height="103" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<circle cx="136" cy="332" r="16" fill="#187264"/>
<text x="136" y="339" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="274.0" y="335.82" font-size="23" fill="#187264" text-anchor="middle" font-weight="700">处理输入</text>
<text x="256.0" y="369.62" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">_process_input_queue()</text>
<rect x="447" y="307" width="280" height="103" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<circle cx="467" cy="332" r="16" fill="#187264"/>
<text x="467" y="339" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<text x="605.0" y="335.82" font-size="23" fill="#187264" text-anchor="middle" font-weight="700">注册请求</text>
<text x="587.0" y="369.62" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">Scheduler.add_request()</text>
<rect x="770" y="307" width="250" height="103" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<circle cx="790" cy="332" r="16" fill="#187264"/>
<text x="790" y="339" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">7</text>
<text x="913.0" y="335.82" font-size="23" fill="#187264" text-anchor="middle" font-weight="700">选择工作</text>
<text x="895.0" y="369.62" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">Scheduler.schedule()</text>
<rect x="1078" y="307" width="263" height="103" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<circle cx="1098" cy="332" r="16" fill="#187264"/>
<text x="1098" y="339" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">8</text>
<text x="1227.5" y="335.82" font-size="23" fill="#187264" text-anchor="middle" font-weight="700">执行计划</text>
<text x="1209.5" y="366.46" font-size="19" fill="#172e46" text-anchor="middle" font-weight="400">SchedulerOutput</text>
<text x="1209.5" y="403.94" font-size="16" fill="#187264" text-anchor="middle" font-weight="700">请求 ID / token 数 / block ID</text>
<path d="M396 354 L437.0 354.0" fill="none" stroke="#187264" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="447,354 437.0,358.8 437.0,349.2" fill="#187264" stroke="#187264" stroke-width="0"/>
<path d="M727 354 L760.0 354.0" fill="none" stroke="#187264" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="770,354 760.0,358.8 760.0,349.2" fill="#187264" stroke="#187264" stroke-width="0"/>
<path d="M1020 354 L1068.0 354.0" fill="none" stroke="#187264" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1078,354 1068.0,358.8 1068.0,349.2" fill="#187264" stroke="#187264" stroke-width="0"/>
<rect x="102" y="436" width="1255" height="135" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="116" y="463" font-size="24" fill="#ac642e" text-anchor="start" font-weight="700">C. 执行本轮计划</text>
<rect x="116" y="470" width="280" height="92" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<circle cx="136" cy="495" r="16" fill="#ac642e"/>
<text x="136" y="502" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">9</text>
<text x="274.0" y="498.82" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">分发计划</text>
<text x="256.0" y="532.2120929702631" font-size="16.80027344195055" fill="#172e46" text-anchor="middle" font-weight="400">model_executor.execute_model()</text>
<rect x="447" y="470" width="280" height="92" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<circle cx="467" cy="495" r="16" fill="#ac642e"/>
<text x="467" y="502" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">10</text>
<text x="605.0" y="498.82" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">跨越执行边界</text>
<text x="587.0" y="519.0199004975124" font-size="15.920398009950251" fill="#172e46" text-anchor="middle" font-weight="400">进程内调用 │ RPC</text>
<text x="587.0" y="537.8059701492537" font-size="15.920398009950251" fill="#172e46" text-anchor="middle" font-weight="400">MessageQueue RPC / Ray RPC</text>
<text x="587.0" y="557.6" font-size="15" fill="#ac642e" text-anchor="middle" font-weight="700">EngineCore │ Worker</text>
<rect x="770" y="470" width="250" height="92" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<circle cx="790" cy="495" r="16" fill="#ac642e"/>
<text x="790" y="502" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">11</text>
<text x="913.0" y="498.82" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">运行模型</text>
<text x="895.0" y="528.7739012458418" font-size="16.982062487769877" fill="#172e46" text-anchor="middle" font-weight="400">Worker → GPUModelRunner</text>
<text x="895.0" y="555.94" font-size="16" fill="#ac642e" text-anchor="middle" font-weight="700">forward / attention / sampling</text>
<rect x="1078" y="470" width="263" height="92" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<circle cx="1098" cy="495" r="16" fill="#ac642e"/>
<text x="1098" y="502" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">12</text>
<text x="1227.5" y="498.82" font-size="23" fill="#ac642e" text-anchor="middle" font-weight="700">返回本轮结果</text>
<text x="1209.5" y="532.96" font-size="19" fill="#172e46" text-anchor="middle" font-weight="400">ModelRunnerOutput</text>
<path d="M396 517 L437.0 517.0" fill="none" stroke="#ac642e" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="447,517 437.0,521.8 437.0,512.2" fill="#ac642e" stroke="#ac642e" stroke-width="0"/>
<path d="M727 517 L760.0 517.0" fill="none" stroke="#ac642e" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="770,517 760.0,521.8 760.0,512.2" fill="#ac642e" stroke="#ac642e" stroke-width="0"/>
<path d="M1020 517 L1068.0 517.0" fill="none" stroke="#ac642e" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1078,517 1068.0,521.8 1068.0,512.2" fill="#ac642e" stroke="#ac642e" stroke-width="0"/>
<rect x="102" y="588" width="1255" height="140" rx="6" fill="#fff" stroke="#7654a5" stroke-width="1.5"/>
<text x="116" y="615" font-size="24" fill="#7654a5" text-anchor="start" font-weight="700">D. 更新状态并返回</text>
<rect x="116" y="622" width="280" height="97" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<circle cx="136" cy="647" r="16" fill="#7654a5"/>
<text x="136" y="654" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">13</text>
<text x="274.0" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">更新请求状态</text>
<text x="256.0" y="680.7415300045809" font-size="16.886852954649566" fill="#172e46" text-anchor="middle" font-weight="400">Scheduler.update_from_output()</text>
<text x="256.0" y="712.6" font-size="15" fill="#7654a5" text-anchor="middle" font-weight="700">未完成：下一轮在第 7 步再次调度</text>
<rect x="447" y="622" width="280" height="97" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<circle cx="467" cy="647" r="16" fill="#7654a5"/>
<text x="467" y="654" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">14</text>
<text x="605.0" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">构造引擎输出</text>
<text x="587.0" y="681.12" font-size="18" fill="#172e46" text-anchor="middle" font-weight="400">EngineCoreOutputs</text>
<text x="587.0" y="712.94" font-size="16" fill="#7654a5" text-anchor="middle" font-weight="700">增量输出或结束输出</text>
<rect x="770" y="622" width="250" height="97" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<circle cx="790" cy="647" r="16" fill="#7654a5"/>
<text x="790" y="654" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">15</text>
<text x="913.0" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">发送输出</text>
<text x="895.0" y="680.2322780470505" font-size="15.389053079560233" fill="#172e46" text-anchor="middle" font-weight="400">output_queue → output_thread</text>
<text x="895.0" y="712.94" font-size="16" fill="#7654a5" text-anchor="middle" font-weight="700">ZMQ PUSH → PULL</text>
<rect x="1078" y="622" width="263" height="97" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<circle cx="1098" cy="647" r="16" fill="#7654a5"/>
<text x="1098" y="654" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">16</text>
<text x="1227.5" y="650.82" font-size="23" fill="#7654a5" text-anchor="middle" font-weight="700">API 响应</text>
<text x="1209.5" y="679.5731549960661" font-size="13.450455870782616" fill="#172e46" text-anchor="middle" font-weight="400">EngineCoreClient → OutputProcessor</text>
<text x="1209.5" y="712.94" font-size="16" fill="#7654a5" text-anchor="middle" font-weight="700">stream / 最终响应</text>
