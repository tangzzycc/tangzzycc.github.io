<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="735" viewBox="0 0 1440 735" role="img" aria-labelledby="title desc">
<title id="title">优先级抢占：暂停未来执行，保留可恢复的 KV</title><desc id="desc">priority 数值越小越高；示意发生在调度边界，不即时中断已提交 kernel。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="735" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">优先级抢占：暂停未来执行，保留可恢复的 KV</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">Scheduler · 5bdd3cc58d</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">priority 数值越小越高；示意发生在调度边界，不即时中断已提交 kernel。</text>
<rect x="26" y="120" width="1388" height="287" rx="6" fill="#ffffff" stroke="#2865a8" stroke-width="1.5"/>
<text x="50" y="158" font-size="28" fill="#2865a8" text-anchor="start">A(priority=10) 先到，B(priority=0) 在生成期间到达</text>
<text x="65" y="220" font-size="27" fill="#2865a8" text-anchor="start">请求 A</text>
<text x="65" y="325" font-size="27" fill="#ac642e" text-anchor="start">请求 B</text>
<rect x="230" y="180" width="250" height="67" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="355.0" y="222.14" font-size="27" fill="#2865a8" text-anchor="middle">A Decode</text>
<rect x="492" y="180" width="470" height="67" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="727.0" y="221.5" font-size="25" fill="#607187" text-anchor="middle">A 暂停，GPU KV 保留</text>
<rect x="976" y="180" width="340" height="67" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1146.0" y="222.14" font-size="27" fill="#187264" text-anchor="middle">A 恢复 Decode</text>
<rect x="492" y="285" width="470" height="67" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="727.0" y="327.14" font-size="27" fill="#ac642e" text-anchor="middle">B Prefill → Decode</text>
<path d="M492 161 L492 364" fill="none" stroke="#ac642e" stroke-width="2" stroke-dasharray="7 6"/>
<text x="492" y="388" font-size="23" fill="#ac642e" text-anchor="middle">B 到达后的调度边界</text>
<rect x="26" y="433" width="1388" height="251" rx="6" fill="#ffffff" stroke="#7654a5" stroke-width="1.5"/>
<text x="50" y="471" font-size="28" fill="#7654a5" text-anchor="start">显存充足时保留；压力下释放低优先级缓存并重算</text>
<text x="65" y="526" font-size="25" fill="#2865a8" text-anchor="start">A 的 GPU blocks</text>
<rect x="310" y="480" width="78" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="349.0" y="520.5" font-size="25" fill="#2865a8" text-anchor="middle">7</text>
<rect x="402" y="480" width="78" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="441.0" y="520.5" font-size="25" fill="#2865a8" text-anchor="middle">8</text>
<rect x="494" y="480" width="78" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="533.0" y="520.5" font-size="25" fill="#2865a8" text-anchor="middle">9</text>
<rect x="586" y="480" width="78" height="65" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="625.0" y="520.5" font-size="25" fill="#2865a8" text-anchor="middle">10</text>
<path d="M678 512 L770 512" fill="none" stroke="#2865a8" stroke-width="2"/>
<polygon points="770,512 759.0,507.0 759.0,517.0" fill="#2865a8"/>
<rect x="770" y="479" width="535" height="65" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1037.5" y="519.18" font-size="24" fill="#187264" text-anchor="middle">B 完成 → 使用原 KV 与 computed position</text>
<path d="M500 545 L500 600 L770 600" fill="none" stroke="#7654a5" stroke-width="2"/>
<polygon points="770,600 759.0,595.0 759.0,605.0" fill="#7654a5"/>
<rect x="770" y="570" width="535" height="62" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="1037.5" y="608.68" font-size="24" fill="#7654a5" text-anchor="middle">KV 压力 → 释放 A blocks → 恢复时重算</text>
<text x="65" y="662" font-size="24" fill="#607187" text-anchor="start">暂停执行仍占显存；保留 KV 不是永久保证。当前为同步单设备探索。</text>
</svg>
