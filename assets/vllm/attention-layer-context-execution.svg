<text x="907.5" y="453.1188387831257" font-size="17.996584656251976" fill="#ac642e" text-anchor="middle" font-weight="700">① unified_kv_cache_update()</text>
<path d="M1044 449 L1064 449" fill="none" stroke="#607187" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a607187)"/>
<text x="1236.0" y="453.12" font-size="18" fill="#187264" text-anchor="middle" font-weight="700">② unified_attention_with_output()</text>
<text x="23" y="508" font-size="19" fill="#ac642e" text-anchor="start" font-weight="700">① 写入本轮 K′/V</text>
<text x="519" y="508" font-size="19" fill="#607187" text-anchor="start" font-weight="700">同一份共享存储</text>
<text x="908" y="508" font-size="19" fill="#187264" text-anchor="start" font-weight="700">② 读取 + 计算</text>
<rect x="23" y="525" width="457" height="212" rx="4" fill="#fff1e5" stroke="#ac642e" stroke-width="1.3"/>
<text x="251.5" y="556.8" font-size="20" fill="#ac642e" text-anchor="middle" font-weight="700">FlashAttentionImpl.do_kv_cache_update()</text>
<text x="41" y="588" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">输入：本轮 K′/V + slot_mapping</text>
<text x="41" y="613" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">目标：Attention[L0].kv_cache</text>
<rect x="41" y="638" width="421" height="37" rx="4" fill="#fff1e5" stroke="#ac642e" stroke-width="1.3"/>
<text x="251.5" y="663.64" font-size="21" fill="#ac642e" text-anchor="middle" font-weight="700">reshape_and_cache_flash()</text>
<text x="41" y="703" font-size="18" fill="#ac642e" text-anchor="start" font-weight="700">只写入新 token 对应的 slots。</text>
<text x="41" y="728" font-size="17" fill="#607187" text-anchor="start" font-weight="400">历史 K′/V 保持在原位置。</text>
