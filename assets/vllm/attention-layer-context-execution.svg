<rect x="0" y="0" width="1440" height="832.630359212051" rx="0" fill="#fbfcfe" stroke="none" stroke-width="1.3"/>
<text x="23" y="36" font-size="33" fill="#172e46" text-anchor="start" font-weight="700">一个 Attention 层：对象、上下文与执行</text>
<text x="23" y="67" font-size="19" fill="#607187" text-anchor="start" font-weight="400">模型数值通过参数传入；layer_name 将本轮信息关联到持久 KV 存储和实现。</text>
<text x="23" y="100" font-size="16" fill="#607187" text-anchor="start" font-weight="400">vLLM v0.25.1 · Llama + FlashAttention · Model Runner V2 · eager / piecewise 路径 · L0 为真实层名简写</text>
<text x="23" y="136" font-size="19" fill="#2865a8" text-anchor="start" font-weight="700">模型调用</text>
<text x="465" y="136" font-size="19" fill="#187264" text-anchor="start" font-weight="700">持久 Attention 对象</text>
<text x="978" y="136" font-size="19" fill="#7654a5" text-anchor="start" font-weight="700">本轮模型 Forward</text>
<rect x="23" y="153" width="387" height="241" rx="4" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.3"/>
<text x="41" y="183" font-size="25" fill="#2865a8" text-anchor="start" font-weight="700">LlamaAttention</text>
<text x="41" y="213" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">qkv_proj → 本轮 Q/K/V</text>
<text x="41" y="238" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">rotary_emb → Q′/K′；V 不变</text>
<rect x="41" y="258" width="351" height="48" rx="4" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.3"/>
<text x="216.5" y="289.48" font-size="22" fill="#2865a8" text-anchor="middle" font-weight="700">self.attn(q, k, v)</text>
<text x="41" y="337" font-size="17" fill="#607187" text-anchor="start" font-weight="400">self.attn 就是右侧的 Attention 对象。</text>
<text x="41" y="362" font-size="17" fill="#607187" text-anchor="start" font-weight="400">Q′/K′/V 是此次层调用的数值。</text>
<path d="M411 282 L463 282" fill="none" stroke="#2865a8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2865a8)"/>
<text x="437" y="269" font-size="16" fill="#2865a8" text-anchor="middle" font-weight="700">调用</text>
<rect x="465" y="153" width="457" height="241" rx="4" fill="#e8f5f1" stroke="#187264" stroke-width="1.3"/>
<text x="484" y="183" font-size="25" fill="#187264" text-anchor="start" font-weight="700">Attention[L0]</text>
<text x="484" y="215" font-size="20" fill="#172e46" text-anchor="start" font-weight="700">layer_name = &quot;L0&quot;</text>
<text x="484" y="246" font-size="17" fill="#172e46" text-anchor="start" font-weight="400">attn_backend = FlashAttentionBackend</text>
<text x="484" y="275" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">impl → FlashAttentionImpl 实例</text>
<text x="484" y="304" font-size="18" fill="#172e46" text-anchor="start" font-weight="400">kv_cache → 本层 GPU Tensor view</text>
<path d="M483 322 L903 322" fill="none" stroke="#ced7e2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="484" y="352" font-size="18" fill="#187264" text-anchor="start" font-weight="700">forward(q,k,v)：组织缓存写入与计算</text>
<text x="484" y="378" font-size="17" fill="#607187" text-anchor="start" font-weight="400">Impl 与 KV view 跨步骤持续可用。</text>
<rect x="978" y="153" width="440" height="241" rx="4" fill="#f0edfa" stroke="#7654a5" stroke-width="1.3"/>
<text x="996" y="183" font-size="25" fill="#7654a5" text-anchor="start" font-weight="700">ForwardContext</text>
<text x="996" y="211" font-size="16" fill="#607187" text-anchor="start" font-weight="400">GPUModelRunner 在 model.forward 外设置</text>
<text x="996" y="243" font-size="20" fill="#7654a5" text-anchor="start" font-weight="700">attn_metadata[&quot;L0&quot;]</text>
<text x="1010" y="267" font-size="17" fill="#172e46" text-anchor="start" font-weight="400">请求边界 · 长度 · block_table</text>
<text x="996" y="296" font-size="18" fill="#7654a5" text-anchor="start" font-weight="700">slot_mapping[&quot;L0&quot;] → 新 K/V 写入槽位</text>
<text x="996" y="326" font-size="18" fill="#7654a5" text-anchor="start" font-weight="700">no_compile_layers[&quot;L0&quot;] → Attention[L0]</text>
<text x="996" y="356" font-size="17" fill="#607187" text-anchor="start" font-weight="400">已有注册引用，不新建层或复制 KV。</text>
<text x="996" y="380" font-size="17" fill="#607187" text-anchor="start" font-weight="400">metadata 逐轮变化；真实 KV 留在 GPU。</text>
