<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">gfx1151 上的 vLLM LoRA：Decode 与 Prefill 使用独立 Kernel</title>
  <desc id="desc">启用 LoRA 的 Linear 层通过 PunicaWrapperGPU 传递相同的 Shrink/Expand 张量契约。Decode 采用直接 token 映射、完整 K 归约和展平后的有效输出 tile；Prefill 按 LoRA 对 token 行稳定分组，使用矩阵 tile、受控 split-K 与有效输出 tile。平台、张量和动态 shape 守卫决定进入 RDNA Kernel 或回退到原生 Punica。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#2865a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#218367" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#8051aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#68788a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}
    text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}
    .title{font-size:40px;font-weight:700}.subtitle{font-size:21px;fill:#52677d}
    .eyebrow{font-size:18px;font-weight:700;letter-spacing:0;fill:#2865b3}
    .section{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}
    .body{font-size:16px}.small{font-size:14px;fill:#607187}.tiny{font-size:12px;fill:#607187}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px}
    .card{fill:#fff;stroke:#ced7e2;stroke-width:2}
    .blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}
    .green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}
    .purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}
    .orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}
    .gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}
    .flow-blue{fill:none;stroke:#2865a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
    .flow-green{fill:none;stroke:#218367;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}
    .flow-purple{fill:none;stroke:#8051aa;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-purple)}
    .flow-gray{fill:none;stroke:#68788a;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-gray)}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .mixed{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif}
  </style>

  <rect width="1600" height="1180" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">gfx1151 上的 vLLM LoRA：同一契约，四个 RDNA Kernel</text>
  <text x="48" y="101" class="subtitle">Decode 消除小批量的结构性浪费；Prefill 保留分组矩阵计算。</text>
  <text x="1552" y="62" text-anchor="end" class="small">RDNA 3.5 · Triton 快速路径</text>

  <text x="48" y="151" class="eyebrow">01  Linear LoRA 张量契约</text>
  <rect x="48" y="174" width="1504" height="190" rx="16" class="card"/>
  <rect x="76" y="207" width="246" height="118" rx="11" class="blue"/>
  <text x="96" y="240" class="section">启用 LoRA 的 Linear</text>
  <text x="96" y="273" class="mono">X [M,K]</text>
  <text x="96" y="300" class="small">基础 GEMM 保持不变</text>
  <path d="M322 266 H374" class="flow-blue"/>

  <rect x="386" y="207" width="260" height="118" rx="11" class="gray"/>
  <text x="406" y="240" class="section">PunicaWrapperGPU</text>
  <text x="406" y="273" class="small">选择原生或 RDNA 算子</text>
  <text x="406" y="300" class="mono">add_lora_linear()</text>
  <path d="M646 266 H698" class="flow-blue"/>

  <rect x="710" y="207" width="244" height="118" rx="11" class="green"/>
  <text x="730" y="240" class="section">Shrink 降维</text>
  <text x="730" y="273" class="mono">T = scale · X Aᵀ</text>
  <text x="730" y="300" class="mono">T [S,M,r] · FP32</text>
  <path d="M954 266 H1006" class="flow-green"/>

  <rect x="1018" y="207" width="244" height="118" rx="11" class="purple"/>
  <text x="1038" y="240" class="section">Expand 升维</text>
  <text x="1038" y="273" class="mono">ΔY = T Bᵀ</text>
  <text x="1038" y="300" class="small">一个或多个 slice</text>
  <path d="M1262 266 H1314" class="flow-purple"/>

  <rect x="1326" y="207" width="198" height="118" rx="11" class="orange"/>
  <text x="1346" y="240" class="section">Linear 输出</text>
  <text x="1346" y="273" class="mono">Y += ΔY</text>
  <text x="1346" y="300" class="small">LoRA 语义不变</text>

  <text x="48" y="420" class="eyebrow">02  Decode 与 Prefill 的程序拆分</text>
  <rect x="48" y="446" width="724" height="480" rx="16" class="card"/>
  <rect x="76" y="474" width="668" height="52" rx="9" class="blue"/>
  <text x="98" y="507" class="section">Decode · M ≤ 16</text>
  <text x="720" y="507" text-anchor="end" class="small">直接映射 token · 向量归约</text>

  <text x="76" y="570" class="label">Shrink：token × rank tile × slice</text>
  <rect x="76" y="592" width="136" height="66" rx="8" fill="#edf4fb" stroke="#a9c4df"/>
  <text x="144" y="619" text-anchor="middle" class="mono">X[token,:]</text>
  <text x="144" y="643" text-anchor="middle" class="small">完整 K 行</text>
  <path d="M212 625 H254" class="flow-green"/>
  <rect x="266" y="578" width="192" height="94" rx="8" fill="#edf6f3" stroke="#a9d1c5"/>
  <text x="362" y="607" text-anchor="middle" class="mono">A[slot,r,K]</text>
  <g transform="translate(290 621)">
    <rect x="0" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="22" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="44" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="66" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="88" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="110" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
    <rect x="132" y="0" width="22" height="30" fill="#cfe9df" stroke="#8fc2b1"/>
  </g>
  <path d="M458 625 H500" class="flow-green"/>
  <rect x="512" y="592" width="206" height="66" rx="8" fill="#e8f5f1" stroke="#8fc2b1"/>
  <text x="615" y="619" text-anchor="middle" class="mono">T[s,token,r]</text>
  <text x="615" y="643" text-anchor="middle" class="small">无 split-K · 无 atomic</text>

  <text x="76" y="720" class="label">Expand：token × 展平后的有效输出 tile</text>
  <rect x="76" y="744" width="132" height="68" rx="8" fill="#f0edfa" stroke="#cfbee1"/>
  <text x="142" y="773" text-anchor="middle" class="mono">T[token,r]</text>
  <text x="142" y="798" text-anchor="middle" class="small">rank 向量</text>
  <path d="M208 778 H250" class="flow-purple"/>
  <g transform="translate(262 746)">
    <rect x="0" y="0" width="218" height="24" rx="4" fill="#dceafb" stroke="#9fb7d2"/>
    <rect x="0" y="30" width="62" height="24" rx="4" fill="#ded3ec" stroke="#b59ecb"/>
    <rect x="68" y="30" width="62" height="24" rx="4" fill="#ded3ec" stroke="#b59ecb"/>
    <text x="109" y="18" text-anchor="middle" class="tiny">slice 0 · 有效 N tile</text>
    <text x="31" y="48" text-anchor="middle" class="tiny">slice 1</text>
    <text x="99" y="48" text-anchor="middle" class="tiny">slice 2</text>
  </g>
  <path d="M480 778 H522" class="flow-purple"/>
  <rect x="534" y="744" width="184" height="68" rx="8" fill="#f0edfa" stroke="#b59ecb"/>
  <text x="626" y="773" text-anchor="middle" class="mono">ΔY[token,:]</text>
  <text x="626" y="798" text-anchor="middle" class="small">不生成 MAX_N 空 tile</text>
  <rect x="76" y="850" width="642" height="48" rx="8" fill="#f7f9fc" stroke="#d7e0ea"/>
  <text x="397" y="880" text-anchor="middle" class="body">小 M 强调精确映射：每个 program 只负责真实 token 或输出 tile。</text>

  <rect x="800" y="446" width="752" height="480" rx="16" class="card"/>
  <rect x="828" y="474" width="696" height="52" rx="9" class="green"/>
  <text x="850" y="507" class="section">Prefill · 按 LoRA 分组 token 行</text>
  <text x="1500" y="507" text-anchor="end" class="small">矩阵 tile · 跨行复用权重</text>

  <text x="828" y="570" class="label">Metadata 为离散 token 生成 LoRA 分组索引</text>
  <g transform="translate(828 592)">
    <rect x="0" y="0" width="42" height="32" rx="4" fill="#dceafb" stroke="#9fb7d2"/><text x="21" y="22" text-anchor="middle" class="tiny">A</text>
    <rect x="48" y="0" width="42" height="32" rx="4" fill="#ded3ec" stroke="#b59ecb"/><text x="69" y="22" text-anchor="middle" class="tiny">B</text>
    <rect x="96" y="0" width="42" height="32" rx="4" fill="#dceafb" stroke="#9fb7d2"/><text x="117" y="22" text-anchor="middle" class="tiny">A</text>
    <rect x="144" y="0" width="42" height="32" rx="4" fill="#f0f2f5" stroke="#c7d0da"/><text x="165" y="22" text-anchor="middle" class="tiny">基础</text>
    <rect x="192" y="0" width="42" height="32" rx="4" fill="#ded3ec" stroke="#b59ecb"/><text x="213" y="22" text-anchor="middle" class="tiny">B</text>
  </g>
  <path d="M1070 608 H1112" class="flow-gray"/>
  <g transform="translate(1124 592)">
    <rect x="0" y="0" width="42" height="32" rx="4" fill="#f0f2f5" stroke="#c7d0da"/><text x="21" y="22" text-anchor="middle" class="tiny">基础</text>
    <rect x="48" y="0" width="42" height="32" rx="4" fill="#dceafb" stroke="#9fb7d2"/><text x="69" y="22" text-anchor="middle" class="tiny">A</text>
    <rect x="96" y="0" width="42" height="32" rx="4" fill="#dceafb" stroke="#9fb7d2"/><text x="117" y="22" text-anchor="middle" class="tiny">A</text>
    <rect x="144" y="0" width="42" height="32" rx="4" fill="#ded3ec" stroke="#b59ecb"/><text x="165" y="22" text-anchor="middle" class="tiny">B</text>
    <rect x="192" y="0" width="42" height="32" rx="4" fill="#ded3ec" stroke="#b59ecb"/><text x="213" y="22" text-anchor="middle" class="tiny">B</text>
  </g>
  <text x="1488" y="649" text-anchor="end" class="small">不复制 X；按 adapter slot 稳定分组原始行索引</text>

  <text x="828" y="686" class="label">Shrink：分组 M tile × rank tile × 受控 split-K</text>
  <rect x="828" y="708" width="194" height="112" rx="9" fill="#edf6f3" stroke="#a9d1c5"/>
  <text x="925" y="737" text-anchor="middle" class="mono">X[rows,K]</text>
  <g transform="translate(854 751)">
    <rect x="0" y="0" width="142" height="16" fill="#d7eee6" stroke="#8fc2b1"/>
    <rect x="0" y="18" width="142" height="16" fill="#d7eee6" stroke="#8fc2b1"/>
    <rect x="0" y="36" width="142" height="16" fill="#d7eee6" stroke="#8fc2b1"/>
  </g>
  <path d="M1022 764 H1064" class="flow-green"/>
  <rect x="1076" y="708" width="206" height="112" rx="9" fill="#e8f5f1" stroke="#8fc2b1"/>
  <text x="1179" y="737" text-anchor="middle" class="mixed">tl.dot · FP32 累加</text>
  <text x="1179" y="768" text-anchor="middle" class="small">按 shape/token 配置 split-K</text>
  <text x="1179" y="796" text-anchor="middle" class="small">仅 SPLIT_K &gt; 1 时使用 atomic</text>
  <path d="M1282 764 H1324" class="flow-green"/>
  <rect x="1336" y="708" width="162" height="112" rx="9" fill="#e8f5f1" stroke="#8fc2b1"/>
  <text x="1417" y="746" text-anchor="middle" class="mono">T[S,M,r]</text>
  <text x="1417" y="776" text-anchor="middle" class="small">写回时恢复</text>
  <text x="1417" y="800" text-anchor="middle" class="small">原始行顺序</text>

  <rect x="828" y="850" width="670" height="48" rx="8" fill="#f3eff9" stroke="#d7c9e5"/>
  <text x="1163" y="880" text-anchor="middle" class="body">Expand 保留分组 M tile，仅展平每个 slice 中真实存在的输出 tile。</text>

  <text x="48" y="982" class="eyebrow">03  带守卫的分派与安全回退</text>
  <rect x="48" y="1006" width="1504" height="126" rx="16" class="card"/>
  <rect x="76" y="1033" width="276" height="72" rx="10" class="blue"/>
  <text x="214" y="1061" text-anchor="middle" class="label">1 · 加载门禁</text>
  <text x="214" y="1086" text-anchor="middle" class="small">显式启用 + ROCm + gfx1151</text>
  <path d="M352 1069 H404" class="flow-blue"/>
  <rect x="416" y="1033" width="276" height="72" rx="10" class="green"/>
  <text x="554" y="1061" text-anchor="middle" class="label">2 · 张量契约</text>
  <text x="554" y="1086" text-anchor="middle" class="small">dtype · rank · slice · layout</text>
  <path d="M692 1069 H744" class="flow-green"/>
  <rect x="756" y="1033" width="276" height="72" rx="10" class="purple"/>
  <text x="894" y="1061" text-anchor="middle" class="label">3 · 动态 shape</text>
  <text x="894" y="1086" text-anchor="middle" class="small">Decode / Prefill / 不支持</text>
  <path d="M1032 1069 H1062" class="flow-purple"/>
  <circle cx="1062" cy="1069" r="4" fill="#8051aa"/>
  <path d="M1062 1069 C1072 1050 1080 1050 1090 1050" class="flow-purple"/>
  <rect x="1096" y="1023" width="196" height="92" rx="10" class="orange"/>
  <text x="1194" y="1056" text-anchor="middle" class="label">RDNA 自定义算子</text>
  <text x="1194" y="1082" text-anchor="middle" class="small">根据 shape 选择配置</text>
  <rect x="1320" y="1033" width="204" height="72" rx="10" class="gray"/>
  <text x="1422" y="1061" text-anchor="middle" class="label">原生 Punica</text>
  <text x="1422" y="1086" text-anchor="middle" class="small">不支持的输入走回退</text>
  <path d="M1062 1073 C1125 1127 1240 1127 1314 1084" class="flow-gray"/>

  <text x="48" y="1160" class="small">该优化只改变执行映射，不改变 LoRA 数学语义、模型结构、调度，以及 Embedding LoRA、Logits LoRA 或 Fused-MoE LoRA。</text>
</svg>
