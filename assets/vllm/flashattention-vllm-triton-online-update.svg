<text x="57" y="334" font-size="23" fill="#7654a5" text-anchor="start" font-weight="700">每行的状态</text>
<text x="57" y="370" font-size="22" fill="#607187" text-anchor="start" font-weight="400">跨 KV 迭代保留</text>
<text x="57" y="425" font-size="23" fill="#172e46" text-anchor="start" font-weight="400">M：运行最大值</text>
<text x="57" y="465" font-size="23" fill="#172e46" text-anchor="start" font-weight="400">L：指数权重和</text>
<text x="57" y="506" font-size="23" fill="#172e46" text-anchor="start" font-weight="400">acc：加权分子</text>
<path d="M58 534 L338 534" fill="none" stroke="#cfbee1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="57" y="570" font-size="23" fill="#7654a5" text-anchor="start" font-weight="700">与原始 FA1 的关系</text>
<svg x="57" y="595" width="195.39274809160307" height="27" viewBox="0 -704 5688.1 786" color="#7654a5" fill="#7654a5" aria-label="\mathrm{acc}=u=lO"><title>\mathrm{acc}=u=lO</title><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="61" d="M137 305T115 305T78 320T63 359Q63 394 97 421T218 448Q291 448 336 416T396 340Q401 326 401 309T402 194V124Q402 76 407 58T428 40Q443 40 448 56T453 109V145H493V106Q492 66 490 59Q481 29 455 12T400 -6T353 12T329 54V58L327 55Q325 52 322 49T314 40T302 29T287 17T269 6T247 -2T221 -8T190 -11Q130 -11 82 20T34 107Q34 128 41 147T68 188T116 225T194 253T304 268H318V290Q318 324 312 340Q290 411 215 411Q197 411 181 410T156 406T148 403Q170 388 170 359Q170 334 154 320ZM126 106Q126 75 150 51T209 26Q247 26 276 49T315 109Q317 116 318 175Q318 233 317 233Q309 233 296 232T251 223T193 203T147 166T126 106Z"></path><path data-c="63" d="M370 305T349 305T313 320T297 358Q297 381 312 396Q317 401 317 402T307 404Q281 408 258 408Q209 408 178 376Q131 329 131 219Q131 137 162 90Q203 29 272 29Q313 29 338 55T374 117Q376 125 379 127T395 129H409Q415 123 415 120Q415 116 411 104T395 71T366 33T318 2T249 -11Q163 -11 99 53T34 214Q34 318 99 383T250 448T370 421T404 357Q404 334 387 320Z" transform="translate(500,0)"></path><path data-c="63" d="M370 305T349 305T313 320T297 358Q297 381 312 396Q317 401 317 402T307 404Q281 408 258 408Q209 408 178 376Q131 329 131 219Q131 137 162 90Q203 29 272 29Q313 29 338 55T374 117Q376 125 379 127T395 129H409Q415 123 415 120Q415 116 411 104T395 71T366 33T318 2T249 -11Q163 -11 99 53T34 214Q34 318 99 383T250 448T370 421T404 357Q404 334 387 320Z" transform="translate(944,0)"></path></g></g><g data-mml-node="mo" transform="translate(1665.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(2721.6,0)"><path data-c="1D462" d="M21 287Q21 295 30 318T55 370T99 420T158 442Q204 442 227 417T250 358Q250 340 216 246T182 105Q182 62 196 45T238 27T291 44T328 78L339 95Q341 99 377 247Q407 367 413 387T427 416Q444 431 463 431Q480 431 488 421T496 402L420 84Q419 79 419 68Q419 43 426 35T447 26Q469 29 482 57T512 145Q514 153 532 153Q551 153 551 144Q550 139 549 130T540 98T523 55T498 17T462 -8Q454 -10 438 -10Q372 -10 347 46Q345 45 336 36T318 21T296 6T267 -6T233 -11Q189 -11 155 7Q103 38 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(3571.3,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(4627.1,0)"><path data-c="1D459" d="M117 59Q117 26 142 26Q179 26 205 131Q211 151 215 152Q217 153 225 153H229Q238 153 241 153T246 151T248 144Q247 138 245 128T234 90T214 43T183 6T137 -11Q101 -11 70 11T38 85Q38 97 39 102L104 360Q167 615 167 623Q167 626 166 628T162 632T157 634T149 635T141 636T132 637T122 637Q112 637 109 637T101 638T95 641T94 647Q94 649 96 661Q101 680 107 682T179 688Q194 689 213 690T243 693T254 694Q266 694 266 686Q266 675 193 386T118 83Q118 81 118 75T117 65V59Z"></path></g><g data-mml-node="mi" transform="translate(4925.1,0)"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g></g></g></svg>
<text x="57" y="658" font-size="22" fill="#172e46" text-anchor="start" font-weight="400">FA1 保存部分输出 O。</text>
<text x="57" y="692" font-size="22" fill="#172e46" text-anchor="start" font-weight="400">此路径保留其分子，</text>
<text x="57" y="725" font-size="22" fill="#172e46" text-anchor="start" font-weight="400">KV 循环结束后再除分母。</text>
<text x="57" y="798" font-size="20" fill="#607187" text-anchor="start" font-weight="400">M、L：每行各一个标量</text>
<text x="57" y="827" font-size="20" fill="#607187" text-anchor="start" font-weight="400">acc：每行一个向量</text>
<rect x="414" y="297" width="990" height="545" rx="12" fill="#fff" stroke="#a9d1c5" stroke-width="1.3"/>
<rect x="437" y="315" width="905" height="90" rx="12" fill="#e8f5f1" stroke="#a9d1c5" stroke-width="1.3"/>
<text x="458" y="350" font-size="26" fill="#187264" text-anchor="start" font-weight="700">下一块 KV → 计算当前分数</text>
<text x="458" y="384" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">S = Q_tile @ K_tile.T * scale + mask</text>
<path d="M855 406 L855 432" fill="none" stroke="#187264" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a187264)"/>
<text x="451" y="473" font-size="23" fill="#187264" text-anchor="start" font-weight="700">1</text>
<text x="485" y="473" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">M_new = maximum(M, max(S, axis=1))</text>
<text x="451" y="516" font-size="23" fill="#187264" text-anchor="start" font-weight="700">2</text>
<text x="485" y="516" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">P = exp(S - M_new[:, None])</text>
<text x="451" y="559" font-size="23" fill="#187264" text-anchor="start" font-weight="700">3</text>
<text x="485" y="559" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">alpha = exp(M - M_new)</text>
<text x="451" y="602" font-size="23" fill="#187264" text-anchor="start" font-weight="700">4</text>
<text x="485" y="602" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">L_new = alpha * L + sum(P, axis=1)</text>
<text x="451" y="645" font-size="23" fill="#187264" text-anchor="start" font-weight="700">5</text>
<text x="485" y="645" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">acc = alpha[:, None] * acc + dot(P, V_tile)</text>
<rect x="436" y="657" width="852" height="44" rx="12" fill="#e8f5f1" stroke="none" stroke-width="1.3"/>
<text x="451" y="688" font-size="23" fill="#187264" text-anchor="start" font-weight="700">6</text>
<text x="485" y="688" font-size="25" fill="#172e46" text-anchor="start" font-weight="400" class="mono">M, L = M_new, L_new</text>
<text x="458" y="734" font-size="24" fill="#7654a5" text-anchor="start" font-weight="700">P 是指数权重，尚未归一化为概率。</text>
<text x="458" y="769" font-size="22" fill="#607187" text-anchor="start" font-weight="400">行标量广播到自己的行；旧分数可释放。</text>
<text x="458" y="816" font-size="23" fill="#187264" text-anchor="start" font-weight="700">还有 KV 块？保留 M / L / acc，继续循环。</text>
<path d="M1238 809 L1375 809 L1375 360 L1345 360" fill="none" stroke="#187264" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a187264)"/>
<path d="M883 843 L883 890" fill="none" stroke="#187264" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a187264)"/>
<rect x="731" y="849" width="302" height="29" rx="0" fill="#fbfcfe" stroke="none" stroke-width="1.3"/>
<text x="882.0" y="870.64" font-size="21" fill="#187264" text-anchor="middle" font-weight="700">全部 KV 块已处理</text>
<rect x="36" y="893" width="1368" height="72" rx="12" fill="#e8f5f1" stroke="#a9d1c5" stroke-width="1.3"/>
<text x="57" y="937" font-size="25" fill="#187264" text-anchor="start" font-weight="700">写出最终输出</text>
<text x="436" y="940" font-size="31" fill="#187264" text-anchor="start" font-weight="700" class="mono">O_tile = acc / L[:, None]</text>
<text x="36" y="995" font-size="20" fill="#607187" text-anchor="start" font-weight="400">简化有效行数学，省略 dtype 转换与全 mask 行保护；这不是 FA1 后端。</text>
</svg>
