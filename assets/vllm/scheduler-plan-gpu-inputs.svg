<rect width="1440" height="1260" fill="#fbfcfe"/>
<text x="26" y="45" font-size="34" fill="#172e46" text-anchor="start" font-weight="700">从 Scheduler 计划到 Attention 输入</text>
<text x="1414" y="38" font-size="16" fill="#607187" text-anchor="end" font-weight="400">vLLM v0.25.1</text>
<text x="26" y="82" font-size="21" fill="#607187" text-anchor="start" font-weight="400">一个模型 step 统一四套索引，使 Attention Backend 能读取历史 K/V、写入本轮 K/V。</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#a9c4bd" stroke-width="1.2"/></pattern></defs>
<rect x="26" y="107" width="1388" height="58" rx="6" fill="#f5f7fa" stroke="#607187" stroke-width="1.5"/>
<text x="720.0" y="143.82" font-size="23" fill="#607187" text-anchor="middle" font-weight="700">一个 KV Cache Group · block_size = 16 · 当前 step：B 执行 1 token，A 执行 8 tokens</text>
<rect x="26" y="192" width="254" height="656" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="153.0" y="227.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">SchedulerOutput</text>
<rect x="309" y="192" width="254" height="656" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="436.0" y="227.5" font-size="25" fill="#187264" text-anchor="middle" font-weight="700">持久请求状态行</text>
<rect x="592" y="192" width="254" height="656" rx="6" fill="#fff" stroke="#7654a5" stroke-width="1.5"/>
<text x="719.0" y="227.5" font-size="25" fill="#7654a5" text-anchor="middle" font-weight="700">InputBatch</text>
<rect x="875" y="192" width="254" height="656" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="1002.0" y="227.5" font-size="25" fill="#ac642e" text-anchor="middle" font-weight="700">扁平 token 输入</text>
<rect x="1158" y="192" width="256" height="656" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="1286.0" y="227.5" font-size="25" fill="#2865a8" text-anchor="middle" font-weight="700">Attention 输入</text>
<rect x="44" y="265" width="218" height="144" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="153.0" y="300.16" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">本轮执行计划</text>
<text x="153.0" y="338.6753467191058" font-size="16.692196232664045" fill="#172e46" text-anchor="middle" font-weight="400">num_scheduled_tokens</text>
<text x="153.0" y="364.14" font-size="21" fill="#172e46" text-anchor="middle" font-weight="400">{B: 1, A: 8}</text>
<text x="153.0" y="387.38063765417735" font-size="18.766581335815687" fill="#172e46" text-anchor="middle" font-weight="400">请求与 block-ID 增量</text>
<text x="153.0" y="460.90947075208913" font-size="19.77715877437326" fill="#172e46" text-anchor="middle" font-weight="400">携带控制决策</text>
<text x="153.0" y="486.2242339832869" font-size="19.77715877437326" fill="#172e46" text-anchor="middle" font-weight="400">此时尚无 input_ids</text>
<text x="153.0" y="511.53899721448465" font-size="19.77715877437326" fill="#172e46" text-anchor="middle" font-weight="400">或 GPU 地址</text>
<rect x="44" y="651" width="218" height="141" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="153.0" y="706.4545250398302" font-size="16.00582442571257" fill="#2865a8" text-anchor="middle" font-weight="700">连接键</text>
<text x="153.0" y="726.9419803047423" font-size="16.00582442571257" fill="#2865a8" text-anchor="middle" font-weight="700">request_id</text>
<text x="153.0" y="747.4294355696544" font-size="16.00582442571257" fill="#2865a8" text-anchor="middle" font-weight="700">将计划对齐 Worker 状态</text>
<rect x="327" y="265" width="218" height="152" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="436.0" y="300.16" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">row 7 · B</text>
<text x="436.0" y="348.82" font-size="23" fill="#172e46" text-anchor="middle" font-weight="400">computed = 31</text>
<text x="436.0" y="375.8051948051948" font-size="17.316017316017316" fill="#172e46" text-anchor="middle" font-weight="400">G0 BlockTable</text>
<text x="436.0" y="397.96969696969694" font-size="17.316017316017316" fill="#172e46" text-anchor="middle" font-weight="400">[37, 12]</text>
<rect x="327" y="438" width="218" height="152" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="436.0" y="473.16" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">row 6 · A</text>
<text x="436.0" y="521.82" font-size="23" fill="#172e46" text-anchor="middle" font-weight="400">computed = 16</text>
<text x="436.0" y="548.8051948051948" font-size="17.316017316017316" fill="#172e46" text-anchor="middle" font-weight="400">G0 BlockTable</text>
<text x="436.0" y="570.969696969697" font-size="17.316017316017316" fill="#172e46" text-anchor="middle" font-weight="400">[81, 44]</text>
<text x="436.0" y="641.7440930893587" font-size="19.186356368804407" fill="#187264" text-anchor="middle" font-weight="700">稳定坐标</text>
<text x="436.0" y="666.3026292414283" font-size="19.186356368804407" fill="#187264" text-anchor="middle" font-weight="700">req_id ↔ req_state_idx</text>
<text x="436.0" y="736.2270456953174" font-size="20.503142877321846" fill="#172e46" text-anchor="middle" font-weight="400">all_token_ids · 进度</text>
<text x="436.0" y="762.4710685782894" font-size="20.503142877321846" fill="#172e46" text-anchor="middle" font-weight="400">per-group BlockTables</text>
<text x="436.0" y="788.7150914612614" font-size="20.503142877321846" fill="#172e46" text-anchor="middle" font-weight="400">跨 step 原位更新</text>
<rect x="610" y="265" width="218" height="168" rx="6" fill="#fff" stroke="#7654a5" stroke-width="1.5"/>
<text x="719.0" y="300.16" font-size="24" fill="#7654a5" text-anchor="middle" font-weight="700">本轮请求顺序</text>
<text x="719.0" y="344.48" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">req_ids = [B, A]</text>
<text x="719.0" y="375.30493890392916" font-size="18.54393795273286" fill="#172e46" text-anchor="middle" font-weight="400">idx_mapping = [7, 6]</text>
<text x="719.0" y="396.84415584415586" font-size="13.852813852813853" fill="#172e46" text-anchor="middle" font-weight="400">batch 0→row 7</text>
<text x="719.0" y="414.5757575757576" font-size="13.852813852813853" fill="#172e46" text-anchor="middle" font-weight="400">batch 1→row 6</text>
<text x="719.0" y="488.8" font-size="24" fill="#7654a5" text-anchor="middle" font-weight="700">临时坐标</text>
<text x="719.0" y="519.52" font-size="24" fill="#7654a5" text-anchor="middle" font-weight="700">batch_idx = 0, 1</text>
<rect x="610" y="651" width="218" height="141" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="719.0" y="702.3491807027362" font-size="20.373212018365738" fill="#7654a5" text-anchor="middle" font-weight="700">重排</text>
<text x="719.0" y="728.4268920862444" font-size="20.373212018365738" fill="#7654a5" text-anchor="middle" font-weight="700">持久行 → batch 行</text>
<text x="719.0" y="754.5046034697525" font-size="20.373212018365738" fill="#7654a5" text-anchor="middle" font-weight="700">每个模型 step 重建</text>
<rect x="893" y="265" width="218" height="97" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1002.0" y="306.3" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">flat 0 · B</text>
<text x="1002.0" y="337.02" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">position 31</text>
<rect x="893" y="389" width="218" height="97" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1002.0" y="430.8153366803744" font-size="22.282211065418675" fill="#ac642e" text-anchor="middle" font-weight="700">flat 1…8 · A</text>
<text x="1002.0" y="459.3365668441103" font-size="22.282211065418675" fill="#ac642e" text-anchor="middle" font-weight="700">positions 16…23</text>
<text x="1002.0" y="537.8" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">query_start_loc</text>
<text x="1002.0" y="568.52" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">[0, 1, 9]</text>
<rect x="893" y="651" width="218" height="141" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="1002.0" y="686.16" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">input_ids</text>
<text x="1002.0" y="729.1509593040577" font-size="14.414586188404934" fill="#172e46" text-anchor="middle" font-weight="400">B ← 状态 row 7，token 31</text>
<text x="1002.0" y="754.2694805194805" font-size="14.935064935064934" fill="#172e46" text-anchor="middle" font-weight="400">A ← 状态 row 6，</text>
<text x="1002.0" y="773.3863636363635" font-size="14.935064935064934" fill="#172e46" text-anchor="middle" font-weight="400">tokens 16…23</text>
<rect x="1176" y="265" width="220" height="175" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="1286.0" y="299.7859942068495" font-size="22.899982961322202" fill="#2865a8" text-anchor="middle" font-weight="700">READ：历史 K/V</text>
<text x="1286.0" y="344.3935849056604" font-size="18.31446540880503" fill="#172e46" text-anchor="middle" font-weight="400">input_block_tables[0]</text>
<text x="1286.0" y="379.98" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">B [37,12]</text>
<text x="1286.0" y="414.31333333333333" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">A [81,44]</text>
<rect x="1176" y="479" width="220" height="154" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="1286.0" y="513.3852121212121" font-size="21.721212121212123" fill="#ac642e" text-anchor="middle" font-weight="700">WRITE：本轮 K/V</text>
<text x="1286.0" y="563.2646713835138" font-size="22.837268775040492" fill="#172e46" text-anchor="middle" font-weight="400">slot_mappings[0]</text>
<text x="1286.0" y="604.32" font-size="23" fill="#172e46" text-anchor="middle" font-weight="400">[207, 704…711]</text>
<text x="1286.0" y="727.82" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">Attention Backend</text>
<text x="1286.0" y="755.98" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">同时消费这两类输入</text>
<text x="1286.0" y="784.1400000000001" font-size="22" fill="#172e46" text-anchor="middle" font-weight="400">源于同一 BlockTables</text>
<path d="M280 604 L299.0 604.0" fill="none" stroke="#187264" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="309,604 299.0,608.5 299.0,599.5" fill="#187264"/>
<path d="M563 604 L582.0 604.0" fill="none" stroke="#7654a5" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="592,604 582.0,608.5 582.0,599.5" fill="#7654a5"/>
<path d="M846 604 L865.0 604.0" fill="none" stroke="#ac642e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="875,604 865.0,608.5 865.0,599.5" fill="#ac642e"/>
<path d="M1129 604 L1148.0 604.0" fill="none" stroke="#2865a8" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polygon points="1158,604 1148.0,608.5 1148.0,599.5" fill="#2865a8"/>
<text x="720.0" y="891.68" font-size="27" fill="#2865a8" text-anchor="middle" font-weight="700">四套坐标：每套回答一个不同的问题</text>
<rect x="26" y="918" width="254" height="213" rx="6" fill="#fff" stroke="#2865a8" stroke-width="1.5"/>
<text x="153.0" y="953.16" font-size="24" fill="#2865a8" text-anchor="middle" font-weight="700">1. 请求身份</text>
<rect x="44" y="978" width="218" height="53" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="153.0" y="1011.1771365403674" font-size="19.638636883433712" fill="#2865a8" text-anchor="middle" font-weight="700">req_id ↔ state row</text>
<text x="153.0" y="1068.5995177925006" font-size="17.9397582132368" fill="#172e46" text-anchor="middle" font-weight="400">A/B 属于哪个持久状态行？</text>
<text x="153.0" y="1102.9149308755761" font-size="15.926267281105991" fill="#172e46" text-anchor="middle" font-weight="400">关键结构：RequestState 映射</text>
<rect x="309" y="918" width="254" height="213" rx="6" fill="#fff" stroke="#187264" stroke-width="1.5"/>
<text x="436.0" y="953.16" font-size="24" fill="#187264" text-anchor="middle" font-weight="700">2. 本轮选择</text>
<rect x="327" y="978" width="218" height="53" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="436.0" y="1010.1826294532066" font-size="16.71361603884272" fill="#187264" text-anchor="middle" font-weight="700">batch_idx → state row</text>
<text x="436.0" y="1068.96" font-size="19" fill="#172e46" text-anchor="middle" font-weight="400">哪些请求在本轮执行？</text>
<text x="436.0" y="1103.96" font-size="19" fill="#172e46" text-anchor="middle" font-weight="400">idx_mapping = [7,6]</text>
<rect x="592" y="918" width="254" height="213" rx="6" fill="#fff" stroke="#7654a5" stroke-width="1.5"/>
<text x="719.0" y="953.16" font-size="24" fill="#7654a5" text-anchor="middle" font-weight="700">3. Token 展平</text>
<rect x="610" y="978" width="218" height="53" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="719.0" y="1010.069493609174" font-size="16.380863556394004" fill="#7654a5" text-anchor="middle" font-weight="700">batch_idx → flat range</text>
<text x="719.0" y="1067.804290805417" font-size="15.600855310049893" fill="#172e46" text-anchor="middle" font-weight="400">哪些 token rows 属于该请求？</text>
<text x="719.0" y="1103.759851394925" font-size="18.41132763213234" fill="#172e46" text-anchor="middle" font-weight="400">query_start_loc = [0,1,9]</text>
<rect x="875" y="918" width="539" height="213" rx="6" fill="#fff" stroke="#ac642e" stroke-width="1.5"/>
<text x="1144.5" y="953.16" font-size="24" fill="#ac642e" text-anchor="middle" font-weight="700">4. KV 地址：具体查表</text>
<rect x="893" y="973" width="503" height="56" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1144.5" y="996.3246753246754" font-size="15.584415584415584" fill="#ac642e" text-anchor="middle" font-weight="700">logical = position // 16 · offset = position % 16</text>
<text x="1144.5" y="1016.2727272727273" font-size="15.584415584415584" fill="#ac642e" text-anchor="middle" font-weight="700">slot = block_id × 16 + offset</text>
<rect x="893" y="1049" width="242" height="63" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="1014.0" y="1076.472520845351" font-size="13.424930515496355" fill="#2865a8" text-anchor="middle" font-weight="700">B · flat 0 · position 31</text>
<text x="1014.0" y="1093.6564319051863" font-size="13.424930515496355" fill="#2865a8" text-anchor="middle" font-weight="700">L1 → ID12 → off15 → slot 207</text>
<rect x="1154" y="1049" width="242" height="63" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="1275.0" y="1076.8969035890218" font-size="12.01032136992728" fill="#187264" text-anchor="middle" font-weight="700">A · flat 1…8 · position 16…23</text>
<text x="1275.0" y="1092.2701149425288" font-size="12.01032136992728" fill="#187264" text-anchor="middle" font-weight="700">L1 → ID44 → off0…7 → 704…711</text>
<rect x="26" y="1159" width="1388" height="74" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="720.0" y="1189.4" font-size="22" fill="#2865a8" text-anchor="middle" font-weight="700">SchedulerOutput 决定执行哪些请求；Worker 持久状态提供数据；prepare_attn() 构造 KV 读写地址。</text>
<text x="720.0" y="1217.5600000000002" font-size="22" fill="#2865a8" text-anchor="middle" font-weight="700">req_state_idx、batch_idx、flat_token_idx、block_id、slot_id 各有不同语义。</text>
</svg>
