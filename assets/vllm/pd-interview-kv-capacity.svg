<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">KV Cache 容量怎样约束并发</title><desc id="desc">Qwen3-0.6B / BF16 / TP1 示例；理想估算不含 block 尾部碎片、lookahead 与额外保留。</desc>
<style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","DejaVu Sans",sans-serif}</style>
<rect width="1440" height="790" fill="#fbfcfe"/>
<text x="26" y="44" font-size="34" fill="#172e46" text-anchor="start">KV Cache 容量怎样约束并发</text>
<text x="1414" y="40" font-size="17" fill="#607187" text-anchor="end">KV Cache · 容量算例</text>
<text x="26" y="83" font-size="23" fill="#607187" text-anchor="start">Qwen3-0.6B / BF16 / TP1 示例；理想估算不含 block 尾部碎片、lookahead 与额外保留。</text>
<rect x="26" y="115" width="1388" height="207" rx="6" fill="#ffffff" stroke="#187264" stroke-width="1.5"/>
<text x="50" y="153" font-size="28" fill="#187264" text-anchor="start">每个 token：每层分别保存 K 与 V，使用 KV heads 计算</text>
<rect x="58" y="189" width="160" height="73" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="138.0" y="233.82" font-size="26" fill="#2865a8" text-anchor="middle">K 与 V：2</text>
<rect x="242" y="189" width="220" height="73" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="352.0" y="233.82" font-size="26" fill="#187264" text-anchor="middle">28 个 layers</text>
<rect x="486" y="189" width="228" height="73" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="600.0" y="233.82" font-size="26" fill="#187264" text-anchor="middle">8 个 KV heads</text>
<rect x="738" y="189" width="278" height="73" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="877.0" y="233.18" font-size="24" fill="#187264" text-anchor="middle">head dimension：128</text>
<rect x="1040" y="189" width="337" height="73" rx="6" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1208.5" y="233.18" font-size="24" fill="#ac642e" text-anchor="middle">BF16：2 bytes/元素</text>
<text x="720" y="299" font-size="28" fill="#187264" text-anchor="middle">2 × 28 × 8 × 128 × 2 = 114688 bytes = 112 KiB / token</text>
<rect x="26" y="346" width="1388" height="153" rx="6" fill="#ffffff" stroke="#ac642e" stroke-width="1.5"/>
<text x="50" y="384" font-size="28" fill="#ac642e" text-anchor="start">请求的缓存长度增长，KV 占用也随之增长</text>
<rect x="62" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="127" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="192" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="257" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="322" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="387" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="452" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="517" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="582" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="647" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="712" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="777" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="842" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="907" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="972" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<rect x="1037" y="408" width="59" height="46" rx="3" fill="#fff1e5" stroke="#ac642e" stroke-width="1.5"/>
<text x="1290" y="440" font-size="23" fill="#ac642e" text-anchor="middle">KV slots</text>
<text x="720" y="480" font-size="26" fill="#ac642e" text-anchor="middle">1280 tokens → 140 MiB；4096 tokens → 448 MiB</text>
<rect x="26" y="525" width="448" height="149" rx="6" fill="#e8f5f1" stroke="#187264" stroke-width="1.5"/>
<text x="250" y="575" font-size="27" fill="#187264" text-anchor="middle">4 GiB / 140 MiB</text>
<text x="250" y="630" font-size="28" fill="#187264" text-anchor="middle">≈ 29 个请求</text>
<rect x="496" y="525" width="448" height="149" rx="6" fill="#e8f1fb" stroke="#2865a8" stroke-width="1.5"/>
<text x="720" y="575" font-size="27" fill="#2865a8" text-anchor="middle">max_num_seqs = 16</text>
<text x="720" y="630" font-size="28" fill="#2865a8" text-anchor="middle">执行容量仍限制为 16</text>
<rect x="966" y="525" width="448" height="149" rx="6" fill="#f0edfa" stroke="#7654a5" stroke-width="1.5"/>
<text x="1190" y="575" font-size="27" fill="#7654a5" text-anchor="middle">4 GiB / 448 MiB</text>
<text x="1190" y="630" font-size="28" fill="#7654a5" text-anchor="middle">≈ 9 个请求</text>
<text x="720" y="721" font-size="27" fill="#172e46" text-anchor="middle">实际并发由请求长度、KV 容量、配置上限与在途状态共同约束。</text>
<text x="720" y="764" font-size="24" fill="#607187" text-anchor="middle">权重能装下不代表请求能同时运行；activation、workspace 与 Graph 也需要内存。</text>
</svg>
