<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Temporal Encoder Cache 生命周期</title><desc id="desc">Cache 初始为 INVALID。FULL 推理执行期间保持无效，只有 Vision、Encoder 与 Decoder 全部成功后才提交为 VALID。Prompt 变化或任意推理失败都会使其失效；Decoder-only 只能从 VALID 状态启动。内容失效时，Graph Plan 仍保留。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#c05a45" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.fr{fill:none;stroke:#c05a45;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#r)}</style>
  <rect width="1500" height="760" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">完整推理成功后，Encoder K/V 才进入 VALID 状态</text><text x="44" y="96" class="sub">有效性标记是一次原子式提交，不代表“已有部分 Cache Row 写完”。</text>
  <text x="44" y="142" class="eye">01  Cache 状态机</text><rect x="44" y="164" width="1412" height="370" rx="16" class="card"/>
  <rect x="86" y="276" width="244" height="112" rx="56" class="gray"/><text x="208" y="316" text-anchor="middle" class="h">INVALID</text><text x="208" y="348" text-anchor="middle" class="m">current_prompt_len = None</text><text x="208" y="374" text-anchor="middle" class="s">拒绝 Decoder-only</text>
  <path d="M330 332H468" class="f"/><text x="399" y="318" text-anchor="middle" class="s">启动 FULL</text>
  <rect x="480" y="246" width="330" height="172" rx="16" class="blue"/><text x="645" y="282" text-anchor="middle" class="h">FULL 执行中</text><text x="645" y="316" text-anchor="middle" class="m">先执行 invalidate</text><text x="645" y="348" text-anchor="middle" class="m">Vision → Encoder → Decoder</text><text x="645" y="382" text-anchor="middle" class="s">部分写入的 K/V 不可复用</text>
  <path d="M810 332H948" class="f"/><text x="879" y="318" text-anchor="middle" class="s">整次调用成功</text>
  <rect x="960" y="276" width="244" height="112" rx="56" class="green"/><text x="1082" y="316" text-anchor="middle" class="h">VALID</text><text x="1082" y="348" text-anchor="middle" class="m">current_prompt_len = L</text><text x="1082" y="374" text-anchor="middle" class="s">Prefix K/V 可以复用</text>
  <path d="M1204 332H1248" class="f"/><text x="1226" y="318" text-anchor="middle" class="s">执行</text><rect x="1260" y="246" width="168" height="172" rx="16" class="purple"/><text x="1344" y="292" text-anchor="middle" class="h">DECODER-ONLY</text><text x="1344" y="326" text-anchor="middle" class="s">复用 Prefix K/V</text><text x="1344" y="352" text-anchor="middle" class="s">重写 Suffix K/V</text><text x="1344" y="378" text-anchor="middle" class="s">返回 VALID</text>
  <path d="M1344 418C1344 480 1082 480 1082 394" class="f"/>
  <path d="M645 418C645 486 208 486 208 394" class="fr"/><text x="424" y="474" text-anchor="middle" class="s">Vision / Encoder / Decoder 失败</text>
  <path d="M1082 276C1082 202 208 202 208 270" class="fr"/><text x="645" y="196" text-anchor="middle" class="s">set_prompt / state 变化 · synchronize 失败 · postprocess 失败</text>
  <path d="M1344 246C1344 186 300 186 238 270" class="fr"/><text x="1166" y="180" class="s">Decoder-only 失败</text>
  <text x="44" y="588" class="eye">02  失效操作会清除什么、保留什么</text><rect x="44" y="610" width="1412" height="104" rx="16" class="card"/>
  <text x="76" y="650" class="m">失效：current_prompt_len ← None；frame_count ← 0</text><text x="76" y="686" class="s">K/V Bytes 可以保留，但新一次 FULL 调用提交前都不可访问。</text>
  <text x="1424" y="650" text-anchor="end" class="m">保留：FULL Graph + Decoder-only Graph Plan</text><text x="1424" y="686" text-anchor="end" class="s">相同 Shape 的刷新会重写后续 Replay 消费的稳定 Buffer</text>
  <text x="44" y="744" class="s">只有 synchronize、CPU Copy、反归一化和结果构造全部成功后，Frontend 才会推进 frame_count。</text>
</svg>
