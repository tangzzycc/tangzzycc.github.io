<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Small-M Narrow-N WMMA Split-K 执行</title><desc id="desc">对于 M=10、N=32、K=1024，两个输出 column block 各包含 4 个 wave。各 wave 拥有互不重叠的 256-wide K 分段，在 LDS 中产生四份 16×16 partial tile，由 wave 0 固定顺序归约，再执行 BF16 projection 舍入和 residual 加法。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="800" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Small-M Action Projection 沿 K 方向暴露并行度</text><text x="44" y="96" class="sub">固定 Shape：A[10,1024] × Wnt[32,1024]ᵀ → D[10,32]；仅两个 Column Block 无法填满 GPU。</text>
  <text x="44" y="142" class="eye">01  Grid 与 K 所有权</text><rect x="44" y="164" width="1412" height="320" rx="16" class="card"/>
  <rect x="72" y="208" width="260" height="210" rx="10" class="blue"/><text x="202" y="240" text-anchor="middle" class="h">输出 Grid</text><text x="202" y="276" text-anchor="middle" class="m">grid.x = N / 16 = 2</text><text x="202" y="310" text-anchor="middle" class="m">grid.y = 1 (M ≤ 16)</text><rect x="108" y="340" width="80" height="50" rx="7" fill="#dceafb" stroke="#9fb7d2"/><rect x="214" y="340" width="80" height="50" rx="7" fill="#e8f5f1" stroke="#a9d1c5"/><text x="148" y="371" text-anchor="middle" class="m">N 0:16</text><text x="254" y="371" text-anchor="middle" class="m">N 16:32</text>
  <path d="M332 313H386" class="f"/><rect x="398" y="194" width="650" height="238" rx="11" class="green"/><text x="723" y="226" text-anchor="middle" class="h">每个 Block 内：4 个 wave32 切分 K</text>
  <rect x="430" y="258" width="134" height="72" rx="8" fill="#d9eee7" stroke="#8fc2b1"/><text x="497" y="286" text-anchor="middle" class="b">Wave 0</text><text x="497" y="314" text-anchor="middle" class="m">K [0,256)</text>
  <rect x="580" y="258" width="134" height="72" rx="8" fill="#d9eee7" stroke="#8fc2b1"/><text x="647" y="286" text-anchor="middle" class="b">Wave 1</text><text x="647" y="314" text-anchor="middle" class="m">K [256,512)</text>
  <rect x="730" y="258" width="134" height="72" rx="8" fill="#d9eee7" stroke="#8fc2b1"/><text x="797" y="286" text-anchor="middle" class="b">Wave 2</text><text x="797" y="314" text-anchor="middle" class="m">K [512,768)</text>
  <rect x="880" y="258" width="134" height="72" rx="8" fill="#d9eee7" stroke="#8fc2b1"/><text x="947" y="286" text-anchor="middle" class="b">Wave 3</text><text x="947" y="314" text-anchor="middle" class="m">K [768,1024)</text>
  <text x="723" y="366" text-anchor="middle" class="m">每个 wave：256 / 16 = 16 次 WMMA</text><text x="723" y="402" text-anchor="middle" class="s">4 个 wave 都指向同一 16×16 输出 Tile</text>
  <path d="M1048 313H1102" class="f"/><rect x="1114" y="208" width="314" height="210" rx="10" class="purple"/><text x="1271" y="240" text-anchor="middle" class="h">LDS Partial</text><text x="1271" y="278" text-anchor="middle" class="m">partial[4][32][8]</text><text x="1271" y="314" text-anchor="middle" class="s">每个 wave / lane / element</text><text x="1271" y="340" text-anchor="middle" class="s">一份 FP32 accumulator fragment</text><text x="1271" y="382" text-anchor="middle" class="m">__syncthreads() × 1</text>
  <text x="44" y="538" class="eye">02  固定顺序归约与保留舍入点的 Epilogue</text><rect x="44" y="560" width="1412" height="168" rx="16" class="card"/>
  <rect x="72" y="594" width="338" height="100" rx="10" class="orange"/><text x="241" y="626" text-anchor="middle" class="h">Wave 0 固定顺序归约</text><text x="241" y="658" text-anchor="middle" class="m">acc = p₀ + p₁ + p₂ + p₃</text><text x="241" y="684" text-anchor="middle" class="s">无 atomic 或 global workspace</text><path d="M410 644H474" class="f"/>
  <rect x="486" y="594" width="342" height="100" rx="10" class="purple"/><text x="657" y="626" text-anchor="middle" class="h">Projection 舍入点</text><text x="657" y="658" text-anchor="middle" class="m">delta = BF16(acc + bias)</text><text x="657" y="684" text-anchor="middle" class="s">匹配未融合的 Linear 输出</text><path d="M828 644H892" class="f"/>
  <rect x="904" y="594" width="524" height="100" rx="10" class="blue"/><text x="1166" y="626" text-anchor="middle" class="h">Euler Residual</text><text x="1166" y="658" text-anchor="middle" class="m">noise = BF16(float(noise) + float(delta))</text><text x="1166" y="684" text-anchor="middle" class="s">不会把两次 BF16 舍入折叠成一次 FP32 表达式</text>
  <text x="44" y="766" class="s">持久 Wnt[32,1024] 布局让一个输出 Column 沿 K 连续，从而直接加载 16-value WMMA fragment。</text>
</svg>
