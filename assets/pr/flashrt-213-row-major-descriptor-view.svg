<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Column-major hipBLASLt Descriptor 如何解释 Row-major 存储</title><desc id="desc">同一份 2×3 row-major allocation 可以被解释成 3×2 column-major 转置视图；交换 operand 后，hipBLASLt 无需复制 A、W 或 D 即可计算 D 的转置。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="720" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">同一份 Allocation 可以解释为 A 或 A^T</text><text x="44" y="96" class="sub">Column-major Descriptor 重新解释 Row-major 字节布局，不进行 Transpose Copy。</text>
  <text x="44" y="142" class="eye">01  一份 Allocation，两种逻辑视图</text><rect x="44" y="164" width="1412" height="330" rx="16" class="card"/>
  <text x="92" y="206" class="h">Pipeline 视图：A [2,3] Row-major</text>
  <g transform="translate(92 236)"><rect x="0" y="0" width="110" height="60" fill="#dceafb" stroke="#9fb7d2"/><rect x="110" y="0" width="110" height="60" fill="#e8f5f1" stroke="#a9d1c5"/><rect x="220" y="0" width="110" height="60" fill="#f0edfa" stroke="#cfbee1"/><rect x="0" y="60" width="110" height="60" fill="#fff1e5" stroke="#e4c7ad"/><rect x="110" y="60" width="110" height="60" fill="#f5f7fa" stroke="#ced7e2"/><rect x="220" y="60" width="110" height="60" fill="#d9eee7" stroke="#8fc2b1"/></g>
  <g class="m" text-anchor="middle"><text x="147" y="272">a00</text><text x="257" y="272">a01</text><text x="367" y="272">a02</text><text x="147" y="332">a10</text><text x="257" y="332">a11</text><text x="367" y="332">a12</text></g>
  <text x="92" y="400" class="m">连续 bytes：a00, a01, a02, a10, a11, a12</text><text x="92" y="432" class="s">Row 连续存放；后续只改变解释方式，不搬运数据</text>
  <path d="M452 312H544" class="f"/>
  <rect x="556" y="214" width="300" height="188" rx="11" class="gray"/><text x="706" y="248" text-anchor="middle" class="h">只修改 Descriptor</text><text x="706" y="286" text-anchor="middle" class="m">shape = [K=3, M=2]</text><text x="706" y="320" text-anchor="middle" class="m">layout = column-major</text><text x="706" y="354" text-anchor="middle" class="m">leading dimension = 3</text><text x="706" y="386" text-anchor="middle" class="s">Pointer 保持不变</text>
  <path d="M856 312H948" class="f"/>
  <text x="972" y="206" class="h">hipBLASLt 视图：A^T [3,2]</text>
  <g transform="translate(972 236)"><rect x="0" y="0" width="110" height="60" fill="#dceafb" stroke="#9fb7d2"/><rect x="110" y="0" width="110" height="60" fill="#fff1e5" stroke="#e4c7ad"/><rect x="0" y="60" width="110" height="60" fill="#e8f5f1" stroke="#a9d1c5"/><rect x="110" y="60" width="110" height="60" fill="#f5f7fa" stroke="#ced7e2"/><rect x="0" y="120" width="110" height="60" fill="#f0edfa" stroke="#cfbee1"/><rect x="110" y="120" width="110" height="60" fill="#d9eee7" stroke="#8fc2b1"/></g>
  <g class="m" text-anchor="middle"><text x="1027" y="272">a00</text><text x="1137" y="272">a10</text><text x="1027" y="332">a01</text><text x="1137" y="332">a11</text><text x="1027" y="392">a02</text><text x="1137" y="392">a12</text></g><text x="1234" y="272" class="s">Column 0</text><text x="1234" y="332" class="s">Column 1</text>
  <text x="44" y="548" class="eye">02  交换 Operand，恢复原始 Linear 结果</text><rect x="44" y="570" width="1412" height="104" rx="16" class="card"/>
  <text x="78" y="611" class="m">Row-major 目标：D[M,N] = A[M,K] · W[K,N]</text><path d="M530 606H622" class="f"/><text x="650" y="611" class="m">Column-major 调用：D^T[N,M] = W^T[N,K] · A^T[K,M]</text>
  <text x="78" y="649" class="s">Column-major D^T 的物理 Bytes 正好等于 D 所需的 Row-major Bytes；Weight、Input 与 Output 均留在原地址。</text>
</svg>
