<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Pi05TorchPipeline Buffer 生命周期</title><desc id="desc">请求输入复制到稳定的 Graph 地址，各阶段复用持久工作区；逐层 Encoder K/V 跨阶段保留，Suffix K/V 则在每个去噪步骤重写。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="820" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">稳定地址让 Pipeline 成为显式状态机</text><text x="44" y="96" class="sub">请求只替换内容，各阶段复用工作区；Encoder K/V 跨越 Vision–Decoder 边界。</text>
  <text x="44" y="142" class="eye">01  三类生命周期</text><rect x="44" y="164" width="1412" height="432" rx="16" class="card"/>
  <rect x="72" y="198" width="356" height="354" rx="12" class="blue"/><text x="250" y="232" text-anchor="middle" class="h">每次请求更新的 Graph 输入</text>
  <rect x="100" y="266" width="300" height="66" rx="9" class="gray"/><text x="250" y="294" text-anchor="middle" class="m">input_images [V,224,224,3]</text><text x="250" y="318" text-anchor="middle" class="s">仅 Full 路径写入新观测</text>
  <rect x="100" y="350" width="300" height="66" rx="9" class="gray"/><text x="250" y="378" text-anchor="middle" class="m">input_prompt [capacity,2048]</text><text x="250" y="402" text-anchor="middle" class="s">缓存 embedding；prompt_len 选择 Prefix</text>
  <rect x="100" y="434" width="300" height="66" rx="9" class="gray"/><text x="250" y="462" text-anchor="middle" class="m">input_noise [H,32]</text><text x="250" y="486" text-anchor="middle" class="s">每次调用写入新 noise</text>
  <path d="M428 375H478" class="f"/>
  <rect x="490" y="198" width="430" height="354" rx="12" class="green"/><text x="705" y="232" text-anchor="middle" class="h">阶段内持久工作区</text>
  <text x="520" y="280" class="m">vision_x      [V,256,1152]</text><text x="520" y="318" class="m">encoder_x     [prefix_capacity,2048]</text><text x="520" y="356" class="m">encoder_qkv   [prefix_capacity,2560]</text><text x="520" y="394" class="m">decoder_x     [H,1024]</text><text x="520" y="432" class="m">decoder_attn  [H,2048]</text><text x="520" y="470" class="m">decoder_gate_up [H,8192]</text><text x="520" y="512" class="s">逐层、逐步覆盖同一批存储地址</text>
  <path d="M920 375H970" class="f"/>
  <rect x="982" y="198" width="446" height="354" rx="12" class="purple"/><text x="1205" y="232" text-anchor="middle" class="h">跨阶段持久状态</text>
  <text x="1010" y="278" class="m">encoder_k/v [18, capacity+H, 1,256]</text><rect x="1010" y="304" width="248" height="58" rx="8" fill="#dceafb" stroke="#9fb7d2"/><text x="1134" y="338" text-anchor="middle" class="b">Prefix K/V · 每层写一次</text><rect x="1258" y="304" width="142" height="58" rx="8" fill="#fff1e5" stroke="#e4c7ad"/><text x="1329" y="338" text-anchor="middle" class="b">Suffix 尾部</text>
  <text x="1010" y="402" class="s">Encoder 每层写入一份 Prefix K/V。</text><text x="1010" y="434" class="s">每个去噪步骤只重写 Action Suffix 尾部。</text><text x="1010" y="482" class="m">noise [H,32]</text><text x="1010" y="510" class="s">可观察的 Euler 状态；全程原地更新</text>
  <text x="44" y="650" class="eye">02  Graph 身份与请求数据</text><rect x="44" y="672" width="1412" height="104" rx="16" class="card"/>
  <text x="76" y="708" class="m">地址保持不变</text><path d="M196 704H286" class="f"/><text x="306" y="708" class="m">复制新 image / prompt / noise</text><path d="M574 704H664" class="f"/><text x="684" y="708" class="m">prompt_len 决定 launch shape</text><path d="M958 704H1048" class="f"/><text x="1068" y="708" class="m">capture 或 replay</text>
  <text x="76" y="750" class="s">指针稳定使 Graph 可复用；prompt 长度变化会改变 Graph key，仅数值变化不会。</text>
</svg>
