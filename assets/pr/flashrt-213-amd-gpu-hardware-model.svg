<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">AMD RDNA 3.5 GPU 硬件与 HIP 执行模型</title>
  <desc id="desc">从 HIP Kernel 的 Grid、Workgroup、Wave32 与 Lane 出发，对应到 WGP、CU 与 SIMD，并标出 VGPR、SGPR、LDS、Cache 和 Global Memory 的共享与同步作用域。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto">
      <path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto">
      <path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#718096" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}
    text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}
    .title{font-size:40px;font-weight:700}.sub{font-size:20px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}
    .h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.tiny{font-size:13px;fill:#607187}
    .m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}
    .blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}
    .purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}
    .gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.line{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:6 6;stroke-linecap:round;marker-end:url(#arrow-gray)}
  </style>

  <rect width="1600" height="1080" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">从 HIP 坐标到 RDNA 硬件执行</text>
  <text x="48" y="101" class="sub">gfx1151 Kernel 的编程层级、执行作用域与存储所有权</text>
  <text x="1552" y="63" text-anchor="end" class="s">RDNA 3.5 · FlashRT 使用 Wave32</text>

  <text x="48" y="151" class="eye">01  编程模型与物理调度</text>
  <rect x="48" y="174" width="1504" height="335" rx="16" class="card"/>

  <rect x="76" y="210" width="210" height="110" rx="11" class="blue"/>
  <text x="181" y="246" text-anchor="middle" class="h">Kernel 启动</text>
  <text x="181" y="278" text-anchor="middle" class="m">grid × block</text>
  <text x="181" y="304" text-anchor="middle" class="s">由 Host 提交</text>
  <path d="M286 265H342" class="line"/>

  <rect x="354" y="198" width="310" height="134" rx="11" class="green"/>
  <text x="509" y="234" text-anchor="middle" class="h">Grid</text>
  <text x="509" y="266" text-anchor="middle" class="m">一次 Launch 中的全部 Workgroup</text>
  <g transform="translate(405 286)">
    <rect x="0" y="0" width="44" height="24" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="52" y="0" width="44" height="24" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="104" y="0" width="44" height="24" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="156" y="0" width="44" height="24" rx="4" fill="#d9eee7" stroke="#8fc2b1"/>
  </g>
  <path d="M664 265H720" class="line"/>

  <rect x="732" y="198" width="252" height="134" rx="11" class="gray"/>
  <text x="858" y="234" text-anchor="middle" class="h">硬件 Scheduler</text>
  <text x="858" y="268" text-anchor="middle" class="s">动态分配执行位置</text>
  <text x="858" y="296" text-anchor="middle" class="s">不保证 Block 执行顺序</text>
  <path d="M984 265H1040" class="line"/>

  <rect x="1052" y="190" width="472" height="150" rx="12" class="purple"/>
  <text x="1288" y="222" text-anchor="middle" class="h">WGP · 物理组织层级</text>
  <rect x="1082" y="246" width="196" height="68" rx="9" class="blue"/>
  <text x="1180" y="274" text-anchor="middle" class="b">Compute Unit 0</text>
  <text x="1180" y="299" text-anchor="middle" class="s">SIMD · Register · LDS</text>
  <rect x="1298" y="246" width="196" height="68" rx="9" class="blue"/>
  <text x="1396" y="274" text-anchor="middle" class="b">Compute Unit 1</text>
  <text x="1396" y="299" text-anchor="middle" class="s">SIMD · Register · LDS</text>

  <rect x="76" y="370" width="1448" height="104" rx="11" class="gray"/>
  <text x="104" y="404" class="h">最重要的边界</text>
  <text x="104" y="436" class="b">HIP 代码描述 Grid / Workgroup / Thread；WGP、CU、SIMD 是由 Scheduler 选择的硬件资源。</text>
  <text x="104" y="461" class="s">一个 Workgroup 共享一份 LDS 和一个 Barrier 作用域；blockIdx 不指定物理 CU 或 WGP。</text>

  <text x="48" y="558" class="eye">02  展开一个 256-thread Workgroup</text>
  <rect x="48" y="580" width="1504" height="202" rx="16" class="card"/>
  <rect x="76" y="614" width="512" height="130" rx="11" class="blue"/>
  <text x="332" y="648" text-anchor="middle" class="h">Workgroup / Thread Block</text>
  <text x="332" y="678" text-anchor="middle" class="m">blockDim.x = 256</text>
  <text x="332" y="707" text-anchor="middle" class="m">threadIdx.x = 0 ... 255</text>
  <text x="332" y="732" text-anchor="middle" class="s">一个调度与同步单元</text>
  <path d="M588 679H648" class="line"/>

  <rect x="660" y="606" width="540" height="146" rx="11" class="green"/>
  <text x="930" y="638" text-anchor="middle" class="h">一个 Workgroup 包含 8 个 Wavefront</text>
  <g transform="translate(694 660)">
    <rect x="0" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="61" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="122" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="183" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="244" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="305" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="366" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="427" width="54" height="32" rx="5" fill="#d9eee7" stroke="#8fc2b1"/>
    <text x="27" y="22" text-anchor="middle" class="m">W0</text><text x="88" y="22" text-anchor="middle" class="m">W1</text><text x="149" y="22" text-anchor="middle" class="m">W2</text><text x="210" y="22" text-anchor="middle" class="m">W3</text><text x="271" y="22" text-anchor="middle" class="m">W4</text><text x="332" y="22" text-anchor="middle" class="m">W5</text><text x="393" y="22" text-anchor="middle" class="m">W6</text><text x="454" y="22" text-anchor="middle" class="m">W7</text>
  </g>
  <text x="930" y="723" text-anchor="middle" class="m">wave = tid / 32 · lane = tid &amp; 31</text>
  <path d="M1200 679H1260" class="line"/>
  <rect x="1272" y="614" width="252" height="130" rx="11" class="orange"/>
  <text x="1398" y="648" text-anchor="middle" class="h">一个 Wave32</text>
  <text x="1398" y="680" text-anchor="middle" class="m">Lane 0 ... 31</text>
  <text x="1398" y="708" text-anchor="middle" class="s">执行同一条 SIMT 指令</text>
  <text x="1398" y="732" text-anchor="middle" class="s">Inactive Lane 被 Mask</text>

  <text x="48" y="831" class="eye">03  状态与通信作用域</text>
  <rect x="48" y="854" width="1504" height="170" rx="16" class="card"/>
  <text x="1518" y="875" text-anchor="end" class="tiny">共享作用域逐渐扩大 →</text>

  <rect x="76" y="884" width="270" height="108" rx="10" class="blue"/>
  <text x="211" y="916" text-anchor="middle" class="h">Lane 私有</text>
  <text x="211" y="948" text-anchor="middle" class="m">VGPR · accumulator</text>
  <text x="211" y="975" text-anchor="middle" class="s">无需同步</text>

  <path d="M346 938H390" class="dash"/>
  <rect x="402" y="884" width="270" height="108" rx="10" class="green"/>
  <text x="537" y="916" text-anchor="middle" class="h">Wave 内通信</text>
  <text x="537" y="948" text-anchor="middle" class="m">SGPR · shuffle</text>
  <text x="537" y="975" text-anchor="middle" class="s">作用域：一个 Wave32</text>

  <path d="M672 938H716" class="dash"/>
  <rect x="728" y="884" width="310" height="108" rx="10" class="purple"/>
  <text x="883" y="916" text-anchor="middle" class="h">Workgroup 共享</text>
  <text x="883" y="948" text-anchor="middle" class="m">LDS · __syncthreads()</text>
  <text x="883" y="975" text-anchor="middle" class="s">显式管理生命周期与 Barrier</text>

  <path d="M1038 938H1082" class="dash"/>
  <rect x="1094" y="884" width="430" height="108" rx="10" class="orange"/>
  <text x="1309" y="916" text-anchor="middle" class="h">Device 可见存储</text>
  <text x="1309" y="948" text-anchor="middle" class="m">L0/L1/L2 cache → Global Memory</text>
  <text x="1309" y="975" text-anchor="middle" class="s">关注 Coalescing · Cache 由硬件管理</text>

  <text x="48" y="1058" class="s">Occupancy 受 Register、LDS、Workgroup 大小与 Wave Slot 约束；它衡量驻留能力，不等同于利用率或执行速度。</text>
</svg>
