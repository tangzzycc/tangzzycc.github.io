<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">每个 Prefix Encoder Layer 都生成独立的 K/V Cache</title><desc id="desc">Encoder residual stream 逐层向前传递，每层投影 QKV，并把 K/V 写入对应的持久层槽位。最后一层写完 K/V 后即可停止，因为它后续的 hidden state 没有消费者。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.d{fill:none;stroke:#8a98a8;stroke-width:1.6;stroke-dasharray:6 6}</style>
  <rect width="1500" height="700" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Prefix Cache 是逐层 K/V 栈，不是一份最终 Tensor</text><text x="44" y="96" class="sub">Residual stream 逐层向前；每个 Action Expert Layer 随后读取对应 Encoder Layer 写入的 K/V。</text>
  <text x="44" y="142" class="eye">01  Encoder Residual Stream 与 K/V 所有权</text><rect x="44" y="164" width="1412" height="462" rx="16" class="card"/>
  <rect x="74" y="206" width="188" height="76" rx="10" class="blue"/><text x="168" y="236" text-anchor="middle" class="h">Prefix Hidden</text><text x="168" y="263" text-anchor="middle" class="m">[559,2048]</text>
  <path d="M262 244H312" class="f"/>
  <rect x="324" y="194" width="260" height="100" rx="10" class="green"/><text x="454" y="226" text-anchor="middle" class="h">Layer 0 · QKV + RoPE</text><text x="454" y="257" text-anchor="middle" class="m">Q[559,8,256]</text><text x="454" y="280" text-anchor="middle" class="m">K/V[559,1,256]</text>
  <path d="M584 244H634" class="f"/><rect x="646" y="194" width="214" height="100" rx="10" class="purple"/><text x="753" y="226" text-anchor="middle" class="h">Attention + FFN</text><text x="753" y="257" text-anchor="middle" class="s">更新 encoder_x</text><text x="753" y="280" text-anchor="middle" class="s">交给下一层</text>
  <path d="M860 244H910" class="f"/><rect x="922" y="194" width="220" height="100" rx="10" class="green"/><text x="1032" y="226" text-anchor="middle" class="h">Layer 1</text><text x="1032" y="257" text-anchor="middle" class="m">新的 Q / K / V</text><text x="1032" y="280" text-anchor="middle" class="s">来自更新后的 hidden</text>
  <path d="M1142 244H1200" class="d"/><text x="1224" y="250" class="h">… Layer 17</text>
  <path d="M454 294V354" class="f"/><path d="M1032 294V354" class="f"/><path d="M1306 274V354" class="f"/>
  <rect x="160" y="366" width="1180" height="110" rx="12" class="gray"/><text x="190" y="400" class="h">持久 encoder_k / encoder_v</text>
  <rect x="190" y="420" width="250" height="34" rx="6" fill="#dceafb" stroke="#9fb7d2"/><text x="315" y="443" text-anchor="middle" class="m">cache[0] ← K₀ / V₀</text><rect x="468" y="420" width="250" height="34" rx="6" fill="#e8f5f1" stroke="#a9d1c5"/><text x="593" y="443" text-anchor="middle" class="m">cache[1] ← K₁ / V₁</text><rect x="746" y="420" width="142" height="34" rx="6" fill="#f5f7fa" stroke="#ced7e2"/><text x="817" y="443" text-anchor="middle" class="m">…</text><rect x="916" y="420" width="394" height="34" rx="6" fill="#fff1e5" stroke="#e4c7ad"/><text x="1113" y="443" text-anchor="middle" class="m">cache[17] ← K₁₇ / V₁₇</text>
  <path d="M454 476V520" class="d"/><path d="M1032 476V520" class="d"/><text x="160" y="552" class="b">Decoder Layer i 读取 cache[i]。</text><text x="510" y="552" class="b">Q 只由当前 Encoder Attention 消费。</text>
  <rect x="1010" y="510" width="330" height="78" rx="10" class="orange"/><text x="1175" y="540" text-anchor="middle" class="h">Layer 17 停止点</text><text x="1175" y="567" text-anchor="middle" class="s">K/V 已写入；Q、Attention、O 与 FFN 输出不再有消费者</text>
  <text x="44" y="664" class="s">这里只跳过最后一层写 K/V 之后的工作；Layer 17 仍需要 K/V，因此不能跳过 fused QKV GEMM。</text>
</svg>
