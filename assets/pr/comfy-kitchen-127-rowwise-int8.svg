<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Rowwise INT8 量化：扩大类型化加载宽度，不改变两遍算法</title>
  <desc id="desc">每行被切分为对齐的 16 Byte 数据块。第一遍通过线程局部最大值与 LDS 归约求整行尺度，第二遍重新加载相同数据块并量化写回 INT8；非对齐或不完整行走标量回退路径。</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#2964a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.subtitle{font-size:22px;fill:#52677d}.eyebrow{font-size:18px;font-weight:700;letter-spacing:0;fill:#2865b3}.section{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#607187}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:18px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.flow{fill:none;stroke:#2964a4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .mixed{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif}
  </style>
  <rect width="1600" height="940" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">Rowwise INT8：扩大加载宽度，保留两遍算法</text>
  <text x="48" y="101" class="subtitle">每个 block 处理一行 · 两遍扫描 · 256 threads · 带守卫的 16 Byte 快速路径</text>
  <text x="1552" y="62" text-anchor="end" class="small">COMFY-KITCHEN / PR 127</text>

  <text x="60" y="157" class="eyebrow">01  内存视图</text>
  <rect x="60" y="180" width="1480" height="156" rx="16" fill="#f7f9fc" stroke="#ced7e2" stroke-width="2"/>
  <text x="84" y="215" class="section">一行 BF16 被切成对齐的 16 Byte 数据块</text>
  <text x="1516" y="215" text-anchor="end" class="small">每次类型化加载读取 8 个值</text>
  <g transform="translate(84 238)">
    <rect width="164" height="64" rx="8" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="174" width="164" height="64" rx="8" fill="#e8f1fb" stroke="#c3d5e7"/>
    <rect x="348" width="164" height="64" rx="8" fill="#e8f5f1" stroke="#bed9d1"/><rect x="522" width="164" height="64" rx="8" fill="#e8f5f1" stroke="#bed9d1"/>
    <rect x="696" width="164" height="64" rx="8" fill="#fff1e5" stroke="#e4c7ad"/><rect x="870" width="164" height="64" rx="8" fill="#fff1e5" stroke="#e4c7ad"/>
    <rect x="1044" width="164" height="64" rx="8" fill="#f0edfa" stroke="#d7c9e5"/><rect x="1218" width="214" height="64" rx="8" fill="#fff" stroke="#ced7e2" stroke-dasharray="6 5"/>
    <text x="82" y="39" text-anchor="middle" class="mixed">数据块 0</text><text x="256" y="39" text-anchor="middle" class="mixed">数据块 1</text>
    <text x="430" y="39" text-anchor="middle" class="mixed">数据块 2</text><text x="604" y="39" text-anchor="middle" class="mixed">数据块 3</text>
    <text x="778" y="39" text-anchor="middle" class="mixed">数据块 4</text><text x="952" y="39" text-anchor="middle" class="mixed">数据块 5</text>
    <text x="1126" y="39" text-anchor="middle" class="mono">…</text><text x="1325" y="39" text-anchor="middle" class="small">最后一个完整数据块</text>
  </g>

  <text x="60" y="386" class="eyebrow">02  对同一行执行两遍扫描</text>
  <rect x="60" y="410" width="710" height="315" rx="16" class="card"/>
  <text x="84" y="447" class="section">第 1 遍 · 求整行共享的 scale</text>
  <text x="84" y="477" class="small">只改变加载宽度，不改变归约语义</text>
  <rect x="92" y="520" width="166" height="76" rx="10" fill="#e8f1fb" stroke="#c3d5e7"/>
  <text x="175" y="551" text-anchor="middle" class="label">uint4 load</text><text x="175" y="578" text-anchor="middle" class="small">16 Byte</text>
  <path d="M258 558 H306" class="flow"/>
  <rect x="318" y="520" width="176" height="76" rx="10" fill="#e8f5f1" stroke="#bed9d1"/>
  <text x="406" y="551" text-anchor="middle" class="label">解包</text><text x="406" y="578" text-anchor="middle" class="small">线程局部 absmax</text>
  <path d="M494 558 H542" class="flow"/>
  <rect x="554" y="510" width="184" height="96" rx="10" fill="#f0edfa" stroke="#d7c9e5"/>
  <text x="646" y="544" text-anchor="middle" class="label">LDS 归约</text><text x="646" y="572" text-anchor="middle" class="small">256 → … → 1 = a</text><text x="646" y="595" text-anchor="middle" class="mono" style="font-size:14px">s=max(a/127,1e-30)</text>
  <text x="84" y="681" class="body">每个 thread 提交局部最大值，一个 block 最终得到一个 scale。</text>

  <rect x="830" y="410" width="710" height="315" rx="16" class="card"/>
  <text x="854" y="447" class="section">第 2 遍 · 重读、量化并写回</text>
  <text x="854" y="477" class="small">得到共享 scale 后，再次读取整行</text>
  <rect x="862" y="520" width="166" height="76" rx="10" fill="#e8f1fb" stroke="#c3d5e7"/>
  <text x="945" y="551" text-anchor="middle" class="label">uint4 load</text><text x="945" y="578" text-anchor="middle" class="small">相同数据块</text>
  <path d="M1028 558 H1076" class="flow"/>
  <rect x="1088" y="520" width="190" height="76" rx="10" fill="#e8f5f1" stroke="#bed9d1"/>
  <text x="1183" y="551" text-anchor="middle" class="mono">rint(x / s)</text><text x="1183" y="578" text-anchor="middle" class="small">截断到 INT8 范围</text>
  <path d="M1278 558 H1326" class="flow"/>
  <rect x="1338" y="520" width="170" height="76" rx="10" fill="#fff1e5" stroke="#e4c7ad"/>
  <text x="1423" y="551" text-anchor="middle" class="label">写回 q</text><text x="1423" y="578" text-anchor="middle" class="small">每个值 1 Byte</text>
  <text x="854" y="681" class="body">仅扩大加载宽度，对外量化契约保持不变。</text>

  <text x="60" y="779" class="eyebrow">03  快速路径条件</text>
  <rect x="60" y="802" width="1480" height="82" rx="12" fill="#edf6f3" stroke="#b9d6cd"/>
  <text x="84" y="837" class="label" fill="#187264">向量路径</text>
  <text x="226" y="837" class="mono">base % 16 == 0  and  row_bytes % 16 == 0</text>
  <line x1="879" y1="819" x2="879" y2="867" stroke="#c5d5d0"/>
  <text x="908" y="837" class="label">否则</text>
  <text x="1023" y="837" class="body">非对齐或尾部不完整时保留标量回退路径</text>
  <text x="60" y="918" class="small">优化的是内存事务宽度，而不是替换 Rowwise 量化的两遍算法。</text>
</svg>
