<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Temporal K/V 数据流</title><desc id="desc">上一次 FULL 刷新写入逐层持久化 Prefix K/V。后续 Decoder-only 调用使用新 noise，但不读取新图像或 Prompt Embedding；它会重新执行全部 Action Expert Layer 和去噪步骤、重写 Suffix K/V，并生成新动作。捕获的 Graph Plan 与可变 Cache 内容是不同对象。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#8051aa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.fp{fill:none;stroke:#8051aa;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#p)}.x{fill:none;stroke:#c05a45;stroke-width:2}</style>
  <rect width="1500" height="820" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Decoder-only 只复用 Prefix K/V，不复用旧动作或 Suffix 状态</text><text x="44" y="96" class="sub">该优化跳过 Vision 与 Prefix Encoder，但不会缩短 10-step Action Expert 计算。</text>
  <text x="44" y="142" class="eye">01  上一次 FULL 刷新留下的状态</text><rect x="44" y="164" width="1412" height="176" rx="16" class="card"/>
  <rect x="72" y="204" width="218" height="94" rx="10" class="blue"/><text x="181" y="236" text-anchor="middle" class="h">imageₜ + prompt</text><text x="181" y="268" text-anchor="middle" class="s">仅由 FULL 消费</text><path d="M290 251H344" class="f"/>
  <rect x="356" y="194" width="300" height="114" rx="10" class="green"/><text x="506" y="226" text-anchor="middle" class="h">Vision + Prefix Encoder</text><text x="506" y="260" text-anchor="middle" class="m">18 份逐层 K/V Slice</text><text x="506" y="288" text-anchor="middle" class="s">写入稳定的 encoder_k / encoder_v</text><path d="M656 251H710" class="f"/>
  <rect x="722" y="194" width="706" height="114" rx="10" class="purple"/><text x="1075" y="226" text-anchor="middle" class="h">持久化 Prefix Cache</text><rect x="754" y="252" width="516" height="34" rx="6" fill="#dceafb" stroke="#9fb7d2"/><text x="1012" y="275" text-anchor="middle" class="m">[layer, 0 : valid_prefix, 1, 256]</text><rect x="1270" y="252" width="126" height="34" rx="6" fill="#fff1e5" stroke="#e4c7ad"/><text x="1333" y="275" text-anchor="middle" class="s">Suffix 尾部</text>
  <text x="44" y="394" class="eye">02  后续一次 Decoder-only 调用</text><rect x="44" y="416" width="1412" height="282" rx="16" class="card"/>
  <rect x="72" y="460" width="218" height="102" rx="10" class="gray"/><text x="181" y="492" text-anchor="middle" class="h">imageₜ₊₁ / prompt</text><text x="181" y="524" text-anchor="middle" class="s">本次调用不会读取</text><path d="M102 546L260 474" class="x"/><path d="M102 474L260 546" class="x"/>
  <rect x="72" y="584" width="218" height="82" rx="10" class="blue"/><text x="181" y="615" text-anchor="middle" class="h">新 noise</text><text x="181" y="644" text-anchor="middle" class="m">[H,32]</text><path d="M290 625H344" class="f"/>
  <rect x="356" y="446" width="548" height="220" rx="12" class="green"/><text x="630" y="478" text-anchor="middle" class="h">完整执行 10-step Action Decoder</text><text x="390" y="520" class="m">step = 0 … 9：</text><text x="420" y="554" class="m">noise → Action Embedding → 18 层 Action Expert</text><text x="420" y="588" class="m">读取 Prefix K/V + 写入当前 Suffix K/V</text><text x="420" y="622" class="m">noise ← noise + dt·velocity</text><text x="630" y="650" text-anchor="middle" class="s">Suffix K/V 是当前去噪步骤的 Scratch，不是 Temporal Cache</text>
  <path d="M1075 340V416" class="fp"/><path d="M904 556H1010" class="fp"/><rect x="1022" y="460" width="204" height="102" rx="10" class="purple"/><text x="1124" y="492" text-anchor="middle" class="h">Prefix K/V</text><text x="1124" y="524" text-anchor="middle" class="s">下次 FULL 前内容不变</text><text x="1124" y="548" text-anchor="middle" class="s">每个 Decoder Layer 都会读取</text>
  <path d="M904 625H1278" class="f"/><rect x="1290" y="584" width="138" height="82" rx="10" class="orange"/><text x="1359" y="615" text-anchor="middle" class="h">动作输出</text><text x="1359" y="644" text-anchor="middle" class="m">[H,D]</text>
  <text x="44" y="752" class="eye">03  Graph Plan 与 Cache 内容是不同对象</text><rect x="44" y="772" width="1412" height="34" rx="10" class="gray"/><text x="750" y="795" text-anchor="middle" class="s">Decoder-only Graph Key = prompt_len；失效操作清除有效性，后续 FULL 刷新则重写 Replay 消费的同一组 K/V 地址。</text>
</svg>
