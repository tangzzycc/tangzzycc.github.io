<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Pi0.5 Checkpoint 转换预先准备运行时布局</title>
  <desc id="desc">推理开始前执行五类权重变换：融合 QKV、折叠 RMSNorm、交错 RoPE Pair、合并 gate-up 权重，以及将 Euler 缩放折叠进 Action Projection。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="760" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Checkpoint 转换也是执行计划的一部分</text>
  <text x="44" y="96" class="sub">运行时直接消费预处理布局，无需在每个请求中重新决定融合方式和舍入规则。</text>
  <text x="44" y="142" class="eye">01  融合 Projection 与归一化</text>
  <rect x="44" y="164" width="1412" height="224" rx="16" class="card"/>
  <rect x="72" y="198" width="244" height="150" rx="11" class="blue"/><text x="194" y="230" text-anchor="middle" class="h">Vision Q / K / V</text><text x="194" y="262" text-anchor="middle" class="m">3 × [1152,1152]</text><text x="194" y="294" text-anchor="middle" class="s">分别存放的 HF Tensor</text><text x="194" y="322" text-anchor="middle" class="s">OIHW Patch Weight</text>
  <path d="M316 273H370" class="f"/>
  <rect x="382" y="198" width="270" height="150" rx="11" class="green"/><text x="517" y="230" text-anchor="middle" class="h">运行时 Vision 权重</text><text x="517" y="262" text-anchor="middle" class="m">QKV [1152,3456]</text><text x="517" y="294" text-anchor="middle" class="s">一次 GEMM 输出</text><text x="517" y="322" text-anchor="middle" class="s">存为 HWIO；恢复 OIHW View</text>
  <rect x="720" y="198" width="272" height="150" rx="11" class="purple"/><text x="856" y="230" text-anchor="middle" class="h">Gemma RMSNorm</text><text x="856" y="264" text-anchor="middle" class="m">y = rms(x) ⊙ (1+w)</text><text x="856" y="297" text-anchor="middle" class="s">以 FP32 读取 w</text><text x="856" y="323" text-anchor="middle" class="s">避免 BF16(-1) 将 channel 置零</text>
  <path d="M992 273H1046" class="f"/>
  <rect x="1058" y="198" width="370" height="150" rx="11" class="orange"/><text x="1243" y="230" text-anchor="middle" class="h">折叠进后续 Linear</text><text x="1243" y="263" text-anchor="middle" class="m">W'[:,i] = W[:,i] · (1+wᵢ)</text><text x="1243" y="296" text-anchor="middle" class="s">运行时执行无权重 RMSNorm</text><text x="1243" y="323" text-anchor="middle" class="s">Q/K/V 与 gate/up 共用该规则</text>
  <text x="44" y="440" class="eye">02  Pair 布局、合并 FFN 与 Euler Step</text>
  <rect x="44" y="462" width="1412" height="242" rx="16" class="card"/>
  <rect x="72" y="500" width="382" height="164" rx="11" class="blue"/><text x="263" y="532" text-anchor="middle" class="h">RoPE Pair 交错布局</text><text x="94" y="570" class="m">转换前：[x₀ x₁ ... x₁₂₇ | y₀ y₁ ... y₁₂₇]</text><text x="94" y="605" class="m">转换后：[x₀ y₀ | x₁ y₁ | ... | x₁₂₇ y₁₂₇]</text><text x="94" y="638" class="s">Q/K 变为连续的 (real, imag) Pair；V 保持不变。</text>
  <rect x="486" y="500" width="388" height="164" rx="11" class="green"/><text x="680" y="532" text-anchor="middle" class="h">合并 gate / up</text><text x="510" y="570" class="m">Wgate [K,H] + Wup [K,H]</text><path d="M641 588H719" class="f"/><text x="510" y="625" class="m">Wgate_up [K,2H] = [gate | up]</text><text x="510" y="650" class="s">一次 GEMM 为合并后的 GeGLU Kernel 提供输入</text>
  <rect x="906" y="500" width="522" height="164" rx="11" class="purple"/><text x="1167" y="532" text-anchor="middle" class="h">Action Projection 融合 Euler Step</text><text x="930" y="570" class="m">dt = −1 / num_steps</text><text x="930" y="601" class="m">W' = dt·W,  b' = dt·b</text><text x="930" y="632" class="m">noise ← noise + Linear(decoder_norm, W', b')</text><text x="930" y="655" class="s">把常量缩放移出 10-step Loop</text>
  <text x="44" y="736" class="s">这些数据布局和舍入规则只在加载时决定一次，不会改变 Pi0.5 的模型方程。</text>
</svg>
