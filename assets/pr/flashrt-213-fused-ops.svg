<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">RDNA 3.5 带宽型融合算子</title><desc id="desc">上半部分对比 residual 与 RMSNorm 未融合和融合后的内存往返，下半部分展示 QKV加RoPE、merged GeGLU 和固定宽度 norm specialization。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#2a65a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#607187}.m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.mix{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.f{fill:none;stroke:#2a65a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1600" height="1040" fill="#fbfcfe"/><rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">RDNA 3.5 融合算子：减少往返，同时保留 BF16 舍入点</text><text x="48" y="101" class="sub">优化目标是 launch 与 global-memory traffic，不是改变模型数学</text><text x="1550" y="62" text-anchor="end" class="s">FlashRT / PR 213</text>
  <text x="48" y="151" class="eye">01  Residual + RMSNorm 的数据流</text>
  <rect x="48" y="176" width="724" height="354" rx="16" class="card"/><text x="76" y="216" class="h">未融合：中间 BF16 tensor 写回再读</text>
  <rect x="76" y="252" width="152" height="76" rx="9" class="blue"/><text x="152" y="284" text-anchor="middle" class="b">update</text><text x="152" y="310" text-anchor="middle" class="m">BF16</text>
  <rect x="76" y="362" width="152" height="76" rx="9" class="blue"/><text x="152" y="394" text-anchor="middle" class="b">residual</text><text x="152" y="420" text-anchor="middle" class="m">BF16</text>
  <path d="M228 290H292" class="f"/><path d="M228 400C260 400 268 326 292 326" class="f"/>
  <rect x="304" y="278" width="150" height="96" rx="10" class="orange"/><text x="379" y="314" text-anchor="middle" class="h">Add</text><text x="379" y="345" text-anchor="middle" class="m">round BF16</text>
  <path d="M454 326H518" class="f"/><rect x="530" y="278" width="188" height="96" rx="10" class="gray"/><text x="624" y="310" text-anchor="middle" class="h">HBM 中间值</text><text x="624" y="342" text-anchor="middle" class="m">sum [rows,width]</text>
  <path d="M624 374V416H518" class="f"/><rect x="304" y="404" width="150" height="88" rx="10" class="purple"/><text x="379" y="438" text-anchor="middle" class="h">RMSNorm</text><text x="379" y="468" text-anchor="middle" class="s">重新读取整行</text>
  <rect x="800" y="176" width="752" height="354" rx="16" class="card"/><text x="828" y="216" class="h">融合：一个 workgroup 持有一行</text>
  <rect x="828" y="252" width="170" height="76" rx="9" class="blue"/><text x="913" y="284" text-anchor="middle" class="b">Update + Residual</text><text x="913" y="310" text-anchor="middle" class="m">BF16 输入</text>
  <path d="M998 290H1052" class="f"/><rect x="1064" y="236" width="280" height="132" rx="10" class="green"/><text x="1204" y="272" text-anchor="middle" class="h">Residual + RMS</text><text x="1204" y="304" text-anchor="middle" class="m">sum_bf16 = bf16(a+b)</text><text x="1204" y="334" text-anchor="middle" class="s">从 sum_bf16 计算 FP32 统计量</text>
  <path d="M1344 302H1398" class="f"/><rect x="1410" y="252" width="114" height="100" rx="9" class="purple"/><text x="1467" y="286" text-anchor="middle" class="b">sum</text><text x="1467" y="318" text-anchor="middle" class="b">norm</text><text x="1467" y="341" text-anchor="middle" class="s">双输出</text>
  <rect x="828" y="404" width="696" height="88" rx="10" class="gray"/><text x="850" y="439" class="b">保留可观察语义：</text><text x="1020" y="439" class="mix">先舍入 residual stream，再计算 RMS</text><text x="850" y="470" class="s">不能直接用未舍入 FP32 sum 代替原计算图</text>
  <text x="48" y="588" class="eye">02  三组热路径融合</text>
  <rect x="48" y="614" width="474" height="326" rx="16" class="card"/><rect x="76" y="646" width="418" height="56" rx="9" class="blue"/><text x="285" y="682" text-anchor="middle" class="h">QKV Split + RoPE</text>
  <text x="76" y="748" class="m">QKV [行数,2560]</text><path d="M238 742H292" class="f"/><text x="310" y="748" class="m">Pair 所有权</text>
  <text x="76" y="793" class="b">1× cos/sin load</text><text x="76" y="825" class="s">旋转 8 个 Q head + 共享 K</text><text x="76" y="854" class="s">V pair 直接复制</text><text x="76" y="898" class="s">乘法先过 BF16 rounding，再加减</text>
  <rect x="562" y="614" width="474" height="326" rx="16" class="card"/><rect x="590" y="646" width="418" height="56" rx="9" class="green"/><text x="799" y="682" text-anchor="middle" class="h">Merged GeGLU</text>
  <rect x="590" y="734" width="178" height="78" rx="8" class="green"/><text x="679" y="764" text-anchor="middle" class="m">GEMM [gate|up]</text><text x="679" y="790" text-anchor="middle" class="s">一块连续输出</text><path d="M768 773H820" class="f"/><rect x="832" y="734" width="176" height="78" rx="8" class="purple"/><text x="920" y="764" text-anchor="middle" class="m">GELU(g)×up</text><text x="920" y="790" text-anchor="middle" class="s">只写最终 hidden</text>
  <text x="590" y="858" class="s">不再物化独立的 Gate/Up Activation Tensor</text><text x="590" y="892" class="s">BF16x2 / BF16x4 打包访问</text>
  <rect x="1076" y="614" width="476" height="326" rx="16" class="card"/><rect x="1104" y="646" width="420" height="56" rx="9" class="purple"/><text x="1314" y="682" text-anchor="middle" class="h">固定宽度 Norm</text>
  <text x="1104" y="746" class="m">1152 LayerNorm → 64 threads</text><text x="1104" y="788" class="m">2048 RMSNorm → 64 threads</text><text x="1104" y="830" class="m">2048 Residual+RMS → 256 threads</text><text x="1104" y="875" class="s">BF16 pair 留在 register 中跨归约复用</text><text x="1104" y="905" class="s">LDS 只交换 wave-level partial</text>
  <text x="48" y="998" class="s">融合收益来自更少的 kernel launch、HBM 往返与重复读取；实际性能仍取决于 shape、缓存和 occupancy。</text>
</svg>
