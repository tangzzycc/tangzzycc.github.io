<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">RDNA 3.5 Encoder 与 Decoder Attention 调度</title><desc id="desc">Encoder 使用 wave pair 处理 Query tile并共享转置 V tile；Decoder 使用八个 wave split key，每个 wave维护局部在线 softmax状态，再由 wave0校正合并。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#2a65a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.f{fill:none;stroke:#2a65a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1600" height="1100" fill="#fbfcfe"/><rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">同一 GQA Contract，Encoder 与 Decoder 使用不同的并行轴</text><text x="48" y="101" class="sub">Encoder 分摊 Query/输出维度 · Decoder 分摊 KV rows</text><text x="1550" y="62" text-anchor="end" class="s">gfx1151 · wave32 · BF16</text>
  <text x="48" y="151" class="eye">01  Encoder：一个 Wave Pair 负责 16 行 Query</text>
  <rect x="48" y="176" width="1504" height="392" rx="16" class="card"/>
  <rect x="76" y="216" width="240" height="118" rx="10" class="blue"/><text x="196" y="250" text-anchor="middle" class="h">Q Tile</text><text x="196" y="281" text-anchor="middle" class="m">16 rows × 256</text><text x="196" y="308" text-anchor="middle" class="s">一个 head</text>
  <path d="M316 275H370" class="f"/>
  <rect x="382" y="202" width="330" height="146" rx="10" class="green"/><text x="547" y="238" text-anchor="middle" class="h">Wave Pair</text><text x="404" y="274" class="b">Leader：</text><text x="486" y="274" class="s">QK + online softmax</text><text x="404" y="306" class="b">Wave 0/1：</text><text x="506" y="306" class="s">各持有 16×128 FP32 output</text><text x="404" y="333" class="s">accumulator 跨所有 KV tile 留在 register</text>
  <path d="M712 275H766" class="f"/>
  <rect x="778" y="202" width="330" height="146" rx="10" class="purple"/><text x="943" y="238" text-anchor="middle" class="h">共享 LDS</text><text x="800" y="274" class="m">V: [16,256] → [256,20]</text><text x="800" y="306" class="m">P + correction factor</text><text x="800" y="333" class="s">40-byte pitch 避免 WMMA bank pattern</text>
  <path d="M1108 275H1162" class="f"/>
  <rect x="1174" y="216" width="350" height="118" rx="10" class="orange"/><text x="1349" y="250" text-anchor="middle" class="h">P × V 与归一化</text><text x="1349" y="281" text-anchor="middle" class="m">O [16,256] BF16</text><text x="1349" y="308" text-anchor="middle" class="s">无 atomic / global workspace</text>
  <rect x="76" y="394" width="1448" height="126" rx="10" class="gray"/><text x="100" y="430" class="h">Hq=8 的两个 launch shape</text><text x="100" y="466" class="m">S ≤ 640: 5 pairs × 2 waves × 32 = 320 threads → 80 query rows / head</text><text x="100" y="498" class="m">S &gt; 640: 1 pair/head × 2 heads × 2 waves × 32 = 128 threads</text>
  <text x="48" y="624" class="eye">02  Decoder：八个 Wave 分摊 KV 序列</text>
  <rect x="48" y="650" width="1504" height="360" rx="16" class="card"/>
  <rect x="76" y="690" width="230" height="102" rx="10" class="blue"/><text x="191" y="724" text-anchor="middle" class="h">一个 Block</text><text x="191" y="754" text-anchor="middle" class="m">(query_row, head)</text><text x="191" y="780" text-anchor="middle" class="s">Q head = 256 dims</text>
  <path d="M306 741H358" class="f"/>
  <rect x="370" y="676" width="400" height="130" rx="10" class="green"/><text x="570" y="712" text-anchor="middle" class="h">8 个 Wave：Split Key</text>
  <g transform="translate(397 735)"><rect x="0" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="44" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="88" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="132" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="176" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="220" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="264" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/><rect x="308" width="38" height="34" rx="4" fill="#d9eee7" stroke="#8fc2b1"/></g>
  <text x="570" y="793" text-anchor="middle" class="s">每 lane 持有连续 8 个 head dimensions</text>
  <path d="M770 741H822" class="f"/>
  <rect x="834" y="676" width="330" height="130" rx="10" class="purple"/><text x="999" y="712" text-anchor="middle" class="h">每 Wave 局部状态</text><text x="999" y="746" text-anchor="middle" class="m">local_max · local_sum</text><text x="999" y="777" text-anchor="middle" class="m">partial_output[256]</text>
  <path d="M1164 741H1216" class="f"/>
  <rect x="1228" y="676" width="296" height="130" rx="10" class="orange"/><text x="1376" y="712" text-anchor="middle" class="h">Wave 0 合并</text><text x="1376" y="746" text-anchor="middle" class="m">2^(mᵢ − global_max)</text><text x="1376" y="777" text-anchor="middle" class="s">校正分母与 partial output</text>
  <rect x="76" y="848" width="700" height="112" rx="10" class="gray"/><text x="98" y="883" class="h">有效 KV 区间</text><text x="98" y="919" class="m">[0, valid_prefix) ∪ [suffix_start, Skv)</text><text x="98" y="946" class="s">跳过 padded prefix gap</text>
  <rect x="806" y="848" width="718" height="112" rx="10" class="gray"/><text x="828" y="883" class="h">生产边界</text><text x="828" y="919" class="m">Sq≤16 · Skv≤2048 · KeysPerIteration∈{1,2,4,8}</text><text x="828" y="946" class="s">无 atomic、第二 reduction kernel 或 global workspace</text>
  <text x="48" y="1062" class="s">Row-owned 对照路径会在 LDS 物化最多 1024 个 score；Vision Attention 仍走 PyTorch SDPA。</text>
</svg>
