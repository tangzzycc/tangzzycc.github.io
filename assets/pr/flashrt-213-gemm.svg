<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">RDNA 3.5 GEMM 的 hipBLASLt 与 small-M WMMA 分派</title><desc id="desc">通用形状进入带实例级缓存和首次自动调优的 hipBLASLt；预先转置的 action projection在M不大于48时进入 narrow-N split-K WMMA，并可融合 residual。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#2a65a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#607187}.m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.f{fill:none;stroke:#2a65a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1600" height="1040" fill="#fbfcfe"/><rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">Pi0.5 GEMM：通用形状交给 hipBLASLt，窄输出交给 WMMA</text><text x="48" y="101" class="sub">保持同一个 Row-major Linear 约定，按 Shape 与 Prepared Weight Identity 分派</text><text x="1550" y="62" text-anchor="end" class="s">BF16 · FP32 累加</text>
  <text x="48" y="151" class="eye">01  Python Provider 的两级分派</text>
  <rect x="48" y="176" width="1504" height="300" rx="16" class="card"/>
  <rect x="76" y="220" width="252" height="116" rx="11" class="blue"/><text x="202" y="254" text-anchor="middle" class="h">Linear 计算约定</text><text x="202" y="286" text-anchor="middle" class="m">D[M,N] = A[M,K]W[K,N]</text><text x="202" y="313" text-anchor="middle" class="s">可选 Bias / Residual</text>
  <path d="M328 278H382" class="f"/>
  <rect x="394" y="206" width="338" height="144" rx="11" class="gray"/><text x="563" y="242" text-anchor="middle" class="h">是否命中已准备的 Small-M 权重？</text><text x="416" y="278" class="m">Weight Shape = [1024,32]</text><text x="416" y="308" class="m">Identity 匹配 · M≤48</text><text x="416" y="335" class="s">Output 连续</text>
  <path d="M732 252C780 218 808 218 854 218" class="f"/><text x="790" y="207" class="s">否</text><rect x="866" y="196" width="300" height="112" rx="11" class="green"/><text x="1016" y="232" text-anchor="middle" class="h">hipBLASLt</text><text x="1016" y="264" text-anchor="middle" class="s">通用 M/N/K · Descriptor Cache</text><text x="1016" y="291" text-anchor="middle" class="s">首次调用执行 Lazy Autotune</text>
  <path d="M732 304C780 350 808 350 854 350" class="f"/><text x="790" y="368" class="s">是</text><rect x="866" y="322" width="300" height="112" rx="11" class="purple"/><text x="1016" y="358" text-anchor="middle" class="h">Small-M WMMA</text><text x="1016" y="390" text-anchor="middle" class="m">W_nt [32,1024]</text><text x="1016" y="417" text-anchor="middle" class="s">narrow-N split-K</text>
  <path d="M1166 252H1220" class="f"/><path d="M1166 378C1196 378 1198 304 1220 304" class="f"/><rect x="1232" y="236" width="292" height="116" rx="11" class="orange"/><text x="1378" y="270" text-anchor="middle" class="h">BF16 Output</text><text x="1378" y="302" text-anchor="middle" class="m">[M,N]</text><text x="1378" y="329" text-anchor="middle" class="s">同一 pipeline contract</text>
  <text x="48" y="534" class="eye">02  hipBLASLt：不复制矩阵的 Row-major 解释</text>
  <rect x="48" y="560" width="724" height="340" rx="16" class="card"/>
  <text x="76" y="600" class="h">交换 operand，复用原始 storage</text>
  <rect x="76" y="632" width="190" height="80" rx="9" class="blue"/><text x="171" y="666" text-anchor="middle" class="m">A row [M,K]</text><text x="171" y="694" text-anchor="middle" class="s">解释为 col [K,M]</text>
  <rect x="300" y="632" width="190" height="80" rx="9" class="green"/><text x="395" y="666" text-anchor="middle" class="m">W row [K,N]</text><text x="395" y="694" text-anchor="middle" class="s">解释为 col [N,K]</text>
  <path d="M490 672H544" class="f"/><rect x="556" y="632" width="172" height="80" rx="9" class="orange"/><text x="642" y="666" text-anchor="middle" class="m">D row [M,N]</text><text x="642" y="694" text-anchor="middle" class="s">无临时 transpose</text>
  <rect x="76" y="756" width="652" height="104" rx="10" class="gray"/><text x="98" y="789" class="m">Cache Key = op,M,N,K,weight_stride,output_stride</text><text x="98" y="821" class="s">128 MiB Workspace · Bias Pointer 每次刷新</text><text x="98" y="848" class="s">候选算法：3 次 Warmup + 10 次 HIP Event 计时</text>
  <rect x="800" y="560" width="752" height="340" rx="16" class="card"/>
  <text x="828" y="600" class="h">Small-M WMMA 的两种实现</text>
  <rect x="828" y="632" width="322" height="192" rx="10" class="purple"/><text x="989" y="668" text-anchor="middle" class="h">Narrow-N split-K</text><text x="850" y="706" class="m">1 block → 16 columns</text><text x="850" y="738" class="m">4 waves → disjoint K</text><text x="850" y="770" class="s">FP32 partial 写 LDS</text><text x="850" y="800" class="s">wave 0 固定顺序归约</text>
  <rect x="1180" y="632" width="344" height="192" rx="10" class="green"/><text x="1352" y="668" text-anchor="middle" class="h">Wider-N：LDS 分块</text><text x="1202" y="706" class="m">A: 16×64</text><text x="1202" y="738" class="m">W: Columns×64</text><text x="1202" y="770" class="s">16-byte 协作加载</text><text x="1202" y="800" class="s">每个 Wave 负责 16 列并复用 A</text>
  <text x="828" y="862" class="s">LDS stride = 64 + 4 BF16，用 padding 改变 bank mapping</text>
  <text x="48" y="958" class="eye">03  融合 Euler Epilogue</text><text x="350" y="958" class="m">delta_bf16 = bf16(GEMM_fp32 + bias)</text><path d="M724 951H786" class="f"/><text x="806" y="958" class="m">noise = bf16(float(delta_bf16) + float(noise))</text>
  <text x="48" y="1006" class="s">先舍入 projection，再做 residual，匹配未融合 action projection → Euler add 的可观察 BF16 顺序。</text>
</svg>
