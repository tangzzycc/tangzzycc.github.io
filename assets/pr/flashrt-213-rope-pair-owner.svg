<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">QKV + RoPE 的 Pair 所有权</title><desc id="desc">一个 global thread 拥有一行中的一个复数 pair 位置，只加载一次 cos/sin，将其应用到 8 个 Query head 和 1 个 Key head 的相同 pair，并原样复制 Value pair。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.branch{fill:none;stroke:#8051aa;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1500" height="720" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">一个 Thread 拥有所有 Q Head 的同一 RoPE Pair 位置</text><text x="44" y="96" class="sub">Pair ownership 融合 Q/K/V 拆分、复用一次 cos/sin load，并保证每个输出 pair 只有一个 writer。</text>
  <text x="44" y="142" class="eye">01  从全局 Pair Index 映射到具体 Row 与 Pair</text><rect x="44" y="164" width="1412" height="164" rx="16" class="card"/>
  <rect x="76" y="204" width="232" height="84" rx="10" class="blue"/><text x="192" y="236" text-anchor="middle" class="h">pair_index</text><text x="192" y="266" text-anchor="middle" class="m">0 … rows×128−1</text><path d="M308 246H366" class="f"/>
  <rect x="378" y="194" width="320" height="104" rx="10" class="green"/><text x="538" y="226" text-anchor="middle" class="m">row = pair_index / 128</text><text x="538" y="258" text-anchor="middle" class="m">head_pair = pair_index % 128</text><text x="538" y="284" text-anchor="middle" class="s">pair = 特征 [2d, 2d+1]</text><path d="M698 246H756" class="f"/>
  <rect x="768" y="194" width="284" height="104" rx="10" class="purple"/><text x="910" y="226" text-anchor="middle" class="h">一次系数 Load</text><text x="910" y="258" text-anchor="middle" class="m">cos[pos,d], sin[pos,d]</text><text x="910" y="284" text-anchor="middle" class="s">position = row + position_start</text><path d="M1052 246H1110" class="f"/>
  <rect x="1122" y="204" width="302" height="84" rx="10" class="orange"/><text x="1273" y="236" text-anchor="middle" class="h">编译期 Head Loop</text><text x="1273" y="266" text-anchor="middle" class="m">Q₀…Q₇、K，然后 V</text>
  <text x="44" y="382" class="eye">02  同一 Pair 坐标分叉，但输出所有权不共享</text><rect x="44" y="404" width="1412" height="244" rx="16" class="card"/>
  <rect x="76" y="454" width="226" height="128" rx="10" class="blue"/><text x="189" y="486" text-anchor="middle" class="h">Fused Row</text><text x="189" y="518" text-anchor="middle" class="m">Q: 8 × 128 pairs</text><text x="189" y="548" text-anchor="middle" class="m">K: 1 × 128 pairs</text><text x="189" y="575" text-anchor="middle" class="m">V: 1 × 128 pairs</text>
  <path d="M302 518H356" class="f"/><circle cx="380" cy="518" r="7" fill="#8051aa"/>
  <path d="M380 518C430 448 470 448 520 448" class="branch"/><path d="M380 518H520" class="branch"/><path d="M380 518C430 588 470 588 520 588" class="branch"/>
  <rect x="532" y="426" width="306" height="64" rx="9" class="green"/><text x="685" y="454" text-anchor="middle" class="h">Q Head 0…7</text><text x="685" y="478" text-anchor="middle" class="s">在每个 Head 中旋转同一 Pair</text>
  <rect x="532" y="498" width="306" height="64" rx="9" class="purple"/><text x="685" y="526" text-anchor="middle" class="h">共享 K Head</text><text x="685" y="550" text-anchor="middle" class="s">只旋转匹配位置的一组 Pair</text>
  <rect x="532" y="570" width="306" height="64" rx="9" class="orange"/><text x="685" y="598" text-anchor="middle" class="h">共享 V Head</text><text x="685" y="622" text-anchor="middle" class="s">Bit-exact BF16 Pair Copy</text>
  <rect x="900" y="426" width="524" height="208" rx="11" class="gray"/><text x="1162" y="458" text-anchor="middle" class="h">Q/K 可观察的 BF16 舍入顺序</text><text x="930" y="500" class="m">p₀ = bf16(real·cos)    p₁ = bf16(imag·sin)</text><text x="930" y="536" class="m">p₂ = bf16(imag·cos)    p₃ = bf16(real·sin)</text><text x="930" y="574" class="m">out.real = bf16(float(p₀) − float(p₁))</text><text x="930" y="608" class="m">out.imag = bf16(float(p₂) + float(p₃))</text>
  <text x="44" y="686" class="s">这是一张所有权映射图：一个 block 可以覆盖一行或两行，但各行在数学上仍相互独立。</text>
</svg>
