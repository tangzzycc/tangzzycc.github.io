<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fused RoPE D=96：使用 4 元素原生向量与显式 12-lane 配对</title>
  <desc id="desc">原先每 lane 3 个元素的向量与 32-bit bpermute 数据块不兼容。修正后使用 24 个活跃 lane，每个 lane 处理 4 个元素；NeoX 的每半区跨 12 个 lane，因此配对采用加减 12，而不是 XOR。</desc>
  <defs>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#2964a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#218367" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purple-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#8051aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="red-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#b84d4d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.subtitle{font-size:22px;fill:#52677d}.eyebrow{font-size:18px;font-weight:700;letter-spacing:0;fill:#2865b3}.section{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#607187}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:17px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blueflow{fill:none;stroke:#2964a4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blue-arrow)}.greenflow{fill:none;stroke:#218367;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#green-arrow)}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .mixed{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif}
  </style>
  <rect width="1600" height="1000" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">Fused RoPE D=96：原生向量与正确的 lane 配对</text>
  <text x="48" y="101" class="subtitle">wave32 · NeoX 半区 · 每个活跃 lane 处理 4 个元素 · 共 24 个活跃 lane</text>
  <text x="1552" y="62" text-anchor="end" class="small">FLYDSL / PR 1113</text>

  <text x="60" y="154" class="eyebrow">01  为什么宽度 3 不可行</text>
  <rect x="60" y="178" width="710" height="254" rx="16" class="card"/>
  <text x="84" y="217" class="section">修改前 · ceil(96 / 32) = 3</text>
  <rect x="96" y="262" width="252" height="82" rx="10" fill="#fff0f0" stroke="#e1b7b7"/>
  <text x="222" y="295" text-anchor="middle" class="mixed">32 lanes × 3 个元素</text><text x="222" y="324" text-anchor="middle" class="small">每个 lane 是 48-bit 向量</text>
  <path d="M348 303 H416" fill="none" stroke="#b84d4d" stroke-width="3" stroke-linecap="round" marker-end="url(#red-arrow)"/>
  <rect x="428" y="252" width="306" height="102" rx="10" fill="#fff0f0" stroke="#e1b7b7"/>
  <text x="581" y="285" text-anchor="middle" class="mixed">bpermute：32-bit 数据块</text><text x="581" y="314" text-anchor="middle" class="small">只能重建 2 个元素</text><text x="581" y="338" text-anchor="middle" class="small">shape (2,) ≠ shape (3,)</text>
  <text x="84" y="401" class="small" fill="#a33d3d">每个 lane 的向量既不是一个原生 32-bit 数据块，也不是其整数倍。</text>

  <rect x="830" y="178" width="710" height="254" rx="16" class="card"/>
  <text x="854" y="217" class="section">修改后 · 最小原生宽度为 4</text>
  <rect x="866" y="262" width="252" height="82" rx="10" fill="#e8f5f1" stroke="#bed9d1"/>
  <text x="992" y="295" text-anchor="middle" class="mixed">24 lanes × 4 个元素</text><text x="992" y="324" text-anchor="middle" class="small">每个 lane 是 64-bit 向量</text>
  <path d="M1118 303 H1186" class="blueflow"/>
  <rect x="1198" y="252" width="306" height="102" rx="10" fill="#e8f1fb" stroke="#c3d5e7"/>
  <text x="1351" y="285" text-anchor="middle" class="mono">2 × bpermute_b32</text><text x="1351" y="314" text-anchor="middle" class="small">重建全部 4 个元素</text><text x="1351" y="338" text-anchor="middle" class="small">其余 8 个 lane 不参与</text>
  <text x="854" y="401" class="small" fill="#187264">恰好覆盖 D=96：24 × 4 = 96 个特征。</text>

  <text x="60" y="484" class="eyebrow">02  NeoX：跨两个 12-lane 半区配对</text>
  <rect x="60" y="508" width="1480" height="374" rx="16" class="card"/>
  <text x="84" y="547" class="section">每个 lane 持有 4 个相邻特征，配对 lane 相距 12 个位置。</text>
  <text x="1516" y="547" text-anchor="end" class="small">彩色单元与曲线展示 3 组代表性配对</text>
  <g transform="translate(100 590)">
    <g stroke-width="1.5">
      <rect width="52" height="58" rx="6" fill="#e8f1fb" stroke="#8fb4d8"/><rect x="57" width="52" height="58" rx="6" fill="#e8f5f1" stroke="#8fc5b5"/><rect x="114" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="171" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="228" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="285" width="52" height="58" rx="6" fill="#f0edfa" stroke="#bea8d5"/><rect x="342" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="399" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="456" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="513" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="570" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="627" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/>
      <rect x="713" width="52" height="58" rx="6" fill="#e8f1fb" stroke="#8fb4d8"/><rect x="770" width="52" height="58" rx="6" fill="#e8f5f1" stroke="#8fc5b5"/><rect x="827" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="884" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="941" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="998" width="52" height="58" rx="6" fill="#f0edfa" stroke="#bea8d5"/><rect x="1055" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="1112" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="1169" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="1226" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="1283" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/><rect x="1340" width="52" height="58" rx="6" fill="#f7f9fc" stroke="#ced7e2"/>
    </g>
    <g text-anchor="middle"><text x="26" y="36" class="mono">0</text><text x="83" y="36" class="mono">1</text><text x="140" y="36" class="mono">2</text><text x="197" y="36" class="mono">3</text><text x="254" y="36" class="mono">4</text><text x="311" y="36" class="mono">5</text><text x="368" y="36" class="mono">6</text><text x="425" y="36" class="mono">7</text><text x="482" y="36" class="mono">8</text><text x="539" y="36" class="mono">9</text><text x="596" y="36" class="mono">10</text><text x="653" y="36" class="mono">11</text><text x="739" y="36" class="mono">12</text><text x="796" y="36" class="mono">13</text><text x="853" y="36" class="mono">14</text><text x="910" y="36" class="mono">15</text><text x="967" y="36" class="mono">16</text><text x="1024" y="36" class="mono">17</text><text x="1081" y="36" class="mono">18</text><text x="1138" y="36" class="mono">19</text><text x="1195" y="36" class="mono">20</text><text x="1252" y="36" class="mono">21</text><text x="1309" y="36" class="mono">22</text><text x="1366" y="36" class="mono">23</text></g>
    <text x="340" y="-12" text-anchor="middle" class="small">前 48 个特征 · lanes 0..11</text><text x="1052" y="-12" text-anchor="middle" class="small">后 48 个特征 · lanes 12..23</text>
    <path d="M26 64 C26 142 739 142 739 64" class="blueflow"/>
    <path d="M83 64 C83 182 796 182 796 64" class="greenflow"/>
    <path d="M1024 64 C1024 222 311 222 311 64" fill="none" stroke="#8051aa" stroke-width="3" stroke-linecap="round" marker-end="url(#purple-arrow)"/>
  </g>
  <text x="100" y="846" class="mixed">下半区：pair = lane + 12</text>
  <text x="1500" y="846" text-anchor="end" class="mixed">上半区：pair = lane - 12</text>

  <line x1="60" y1="916" x2="1540" y2="916" stroke="#d4dfea"/>
  <text x="60" y="956" class="label" fill="#187264">为什么不能用 XOR？</text>
  <text x="265" y="956" class="body">XOR 适合 2 的幂跨度；12-lane 半区必须显式使用 +12 / −12 配对。</text>
  <text x="60" y="989" class="small">RoPE 数学公式没有改变，修正的只是向量宽度与跨 lane 寻址方式。</text>
</svg>
