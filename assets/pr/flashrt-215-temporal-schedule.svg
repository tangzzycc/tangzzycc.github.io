<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">cache_frames=3 时的 Temporal K/V 调度</title><desc id="desc">六帧时间线按 FULL、Decoder-only、Decoder-only 循环。FULL 帧消费当前图像并刷新 Prefix K/V；Decoder-only 帧忽略当前图像并复用上一版本 K/V，但仍从新 noise 开始，完整重跑 Action Expert 去噪循环。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="720" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Temporal K/V 是显式的陈旧上下文调度</text><text x="44" y="96" class="sub">以 cache_frames=3 为例：刷新一次、复用两次；每一帧仍生成新 noise，并完整执行去噪 Decoder。</text>
  <text x="44" y="142" class="eye">01  连续 6 次成功推理</text><rect x="44" y="164" width="1412" height="372" rx="16" class="card"/>
  <path d="M118 270H1382" class="f"/><g class="m" text-anchor="middle"><text x="150" y="226">第 0 帧</text><text x="382" y="226">第 1 帧</text><text x="614" y="226">第 2 帧</text><text x="846" y="226">第 3 帧</text><text x="1078" y="226">第 4 帧</text><text x="1310" y="226">第 5 帧</text></g>
  <g><rect x="78" y="250" width="144" height="80" rx="10" class="green"/><rect x="310" y="250" width="144" height="80" rx="10" class="purple"/><rect x="542" y="250" width="144" height="80" rx="10" class="purple"/><rect x="774" y="250" width="144" height="80" rx="10" class="green"/><rect x="1006" y="250" width="144" height="80" rx="10" class="purple"/><rect x="1238" y="250" width="144" height="80" rx="10" class="purple"/></g>
  <g class="h" text-anchor="middle"><text x="150" y="283">FULL</text><text x="382" y="283">DECODE</text><text x="614" y="283">DECODE</text><text x="846" y="283">FULL</text><text x="1078" y="283">DECODE</text><text x="1310" y="283">DECODE</text></g>
  <g class="s" text-anchor="middle"><text x="150" y="312">Vision + Encoder + Decoder</text><text x="382" y="312">仅 Decoder</text><text x="614" y="312">仅 Decoder</text><text x="846" y="312">Vision + Encoder + Decoder</text><text x="1078" y="312">仅 Decoder</text><text x="1310" y="312">仅 Decoder</text></g>
  <text x="78" y="374" class="b">是否消费当前图像？</text><g class="m" text-anchor="middle"><text x="150" y="410">是：image₀</text><text x="382" y="410">否</text><text x="614" y="410">否</text><text x="846" y="410">是：image₃</text><text x="1078" y="410">否</text><text x="1310" y="410">否</text></g>
  <text x="78" y="448" class="b">Prefix K/V 版本</text><g class="m" text-anchor="middle"><text x="150" y="484">写入 KV₀</text><text x="382" y="484">复用 KV₀</text><text x="614" y="484">复用 KV₀</text><text x="846" y="484">写入 KV₃</text><text x="1078" y="484">复用 KV₃</text><text x="1310" y="484">复用 KV₃</text></g>
  <text x="44" y="590" class="eye">02  每帧都会重新执行的工作</text><rect x="44" y="612" width="1412" height="64" rx="14" class="card"/>
  <text x="76" y="652" class="m">每次调用生成新 noise → 10 个去噪步骤 → 每步写入新的 Action Suffix K/V → 生成新动作</text><text x="1380" y="652" text-anchor="end" class="s">cache_frames=1 是无损默认值</text>
  <text x="44" y="704" class="s">Decoder-only 帧有意不消费 image₁/image₂/image₄/image₅；效果取决于视觉与 Prompt 上下文变化得有多慢。</text>
</svg>
