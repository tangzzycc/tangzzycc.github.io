<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pi0.5 Prefix 与 Action Expert 模型结构</title><desc id="desc">多视角图片和语言组成 Prefix，生成逐层 K/V；随机动作经过时间调制的 action expert，查询 Prefix 与 suffix K/V，十次 Euler 更新后得到动作。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#2a65a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.f{fill:none;stroke:#2a65a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1600" height="1100" fill="#fbfcfe"/><rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">Pi0.5：Prefix 提供条件，Action Expert 把噪声积分成动作</text><text x="48" y="101" class="sub">图像与语言只编码一次 · Action Suffix 在每个时间步重新计算</text><text x="1550" y="62" text-anchor="end" class="s">VLA · Flow Matching</text>
  <text x="48" y="151" class="eye">01  Prefix：视觉和语言条件</text>
  <rect x="48" y="176" width="1504" height="330" rx="16" class="card"/>
  <rect x="76" y="214" width="240" height="120" rx="12" class="blue"/><text x="196" y="247" text-anchor="middle" class="h">2 / 3 个相机视角</text><text x="196" y="278" text-anchor="middle" class="m">uint8 [224,224,3]</text><text x="196" y="306" text-anchor="middle" class="s">patch 14 → 256 tokens/view</text>
  <path d="M316 274H348" class="f"/>
  <rect x="360" y="214" width="230" height="120" rx="12" class="green"/><text x="475" y="247" text-anchor="middle" class="h">SigLIP Vision</text><text x="475" y="278" text-anchor="middle" class="m">27L · D=1152</text><text x="475" y="306" text-anchor="middle" class="s">16 heads × 72</text>
  <path d="M590 274H622" class="f"/>
  <rect x="634" y="214" width="186" height="120" rx="12" class="green"/><text x="727" y="247" text-anchor="middle" class="h">Projector</text><text x="727" y="281" text-anchor="middle" class="m">1152 → 2048</text>
  <path d="M820 274H852" class="f"/>
  <rect x="864" y="214" width="146" height="120" rx="12" class="purple"/><text x="937" y="254" text-anchor="middle" class="h">Concat</text><text x="937" y="284" text-anchor="middle" class="b">Prefix</text><text x="937" y="310" text-anchor="middle" class="s">sequence dim</text>
  <rect x="634" y="374" width="250" height="86" rx="10" class="purple"/><text x="759" y="408" text-anchor="middle" class="h">语言 Prompt</text><text x="759" y="438" text-anchor="middle" class="s">文本 + formatted state · D=2048</text>
  <path d="M884 417C922 417 937 376 937 346" class="f"/>
  <path d="M1010 274H1042" class="f"/>
  <rect x="1054" y="214" width="290" height="120" rx="12" class="orange"/><text x="1199" y="247" text-anchor="middle" class="h">Gemma-2B Prefix Encoder</text><text x="1199" y="278" text-anchor="middle" class="m">18L · D=2048</text><text x="1199" y="306" text-anchor="middle" class="s">8 Q heads / 1 KV head · HD=256</text>
  <path d="M1344 274H1376" class="f"/>
  <rect x="1388" y="214" width="136" height="120" rx="12" class="gray"/><text x="1456" y="250" text-anchor="middle" class="h">逐层 K/V</text><text x="1456" y="282" text-anchor="middle" class="m">18 × Prefix</text><text x="1456" y="308" text-anchor="middle" class="s">条件缓存</text>
  <text x="1054" y="394" class="s">Prefix length = views × 256 + prompt_len</text><text x="1054" y="426" class="s">最后一层只生成 K/V，不再计算无消费者的 FFN</text>
  <text x="48" y="562" class="eye">02  Action Suffix：10 次速度场更新</text>
  <rect x="48" y="588" width="1504" height="410" rx="16" class="card"/>
  <rect x="76" y="628" width="218" height="104" rx="11" class="purple"/><text x="185" y="662" text-anchor="middle" class="h">Gaussian Noise</text><text x="185" y="694" text-anchor="middle" class="m">x₁ [H,32]</text>
  <path d="M294 680H346" class="f"/>
  <rect x="358" y="628" width="226" height="104" rx="11" class="blue"/><text x="471" y="662" text-anchor="middle" class="h">Action Projection</text><text x="471" y="694" text-anchor="middle" class="m">32 → 1024</text>
  <path d="M584 680H636" class="f"/>
  <rect x="648" y="612" width="390" height="136" rx="11" class="green"/><text x="843" y="650" text-anchor="middle" class="h">Gemma-300M Action Expert</text><text x="843" y="682" text-anchor="middle" class="m">18L · D=1024 · FFN=4096</text><text x="843" y="713" text-anchor="middle" class="s">Q 读取 Prefix K/V + 当前 Suffix K/V</text>
  <path d="M1038 680H1090" class="f"/>
  <rect x="1102" y="628" width="210" height="104" rx="11" class="orange"/><text x="1207" y="662" text-anchor="middle" class="h">Velocity</text><text x="1207" y="694" text-anchor="middle" class="m">vₜ [H,32]</text>
  <path d="M1312 680H1364" class="f"/>
  <rect x="1376" y="628" width="148" height="104" rx="11" class="gray"/><text x="1450" y="662" text-anchor="middle" class="h">Euler</text><text x="1450" y="694" text-anchor="middle" class="m">x += Δt·v</text>
  <path d="M1450 732V786C1450 824 185 824 185 744" class="f"/>
  <rect x="76" y="786" width="508" height="154" rx="11" class="gray"/><text x="98" y="822" class="h">时间条件 t</text><text x="98" y="856" class="m">sin/cos → MLP → scale | shift | gate</text><text x="98" y="889" class="b">AdaRMS(x) = RMS(x)·(1+scale)+shift</text><text x="98" y="918" class="s">离散时间表可在构造时预计算</text>
  <path d="M584 858H636" class="f"/>
  <rect x="648" y="786" width="390" height="154" rx="11" class="purple"/><text x="843" y="822" text-anchor="middle" class="h">每层调制</text><text x="843" y="856" text-anchor="middle" class="b">Attention 前 AdaRMS</text><text x="843" y="887" text-anchor="middle" class="b">FFN 前 AdaRMS</text><text x="843" y="918" text-anchor="middle" class="s">gate 控制 residual update</text>
  <rect x="1102" y="786" width="422" height="154" rx="11" class="orange"/><text x="1124" y="822" class="h">最终公开动作</text><text x="1124" y="856" class="m">raw [H,32] → quantile unnormalize</text><text x="1124" y="889" class="m">→ [:, :action_dim]</text><text x="1124" y="918" class="s">action_dim 必须由调用方或 checkpoint 显式声明</text>
  <text x="48" y="1055" class="s">Pi0.5 不是逐 token 生成动作：Prefix 固定一次，Action Suffix 在时间轴上反复更新同一块连续动作。</text>
</svg>
