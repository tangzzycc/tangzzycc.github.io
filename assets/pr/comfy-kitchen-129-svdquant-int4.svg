<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">SVDQuant INT4：16 个 lane 协作量化一组 64 个值</title>
  <desc id="desc">每个 lane 在寄存器中保留 4 个值，通过宽度为 16 的 shuffle 归约得到共享绝对最大值，再将 4 个 INT4 半字节打包为一次 uint16 写回。</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#2964a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    @font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf") format("truetype")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.subtitle{font-size:22px;fill:#52677d}.eyebrow{font-size:18px;font-weight:700;letter-spacing:0;fill:#2865b3}.section{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#607187}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:18px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.flow{fill:none;stroke:#2964a4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","LXGW WenKai GB Screen",monospace}
    .mixed{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif}
  </style>
  <rect width="1600" height="960" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">SVDQuant INT4：16 个 lane 协作量化一组数据</text>
  <text x="48" y="101" class="subtitle">64 个值 → 16 lanes × 4 个寄存器值 → 共享 absmax → 每个 lane 写回一个 uint16</text>
  <text x="1552" y="62" text-anchor="end" class="small">COMFY-KITCHEN / PR 129</text>

  <text x="60" y="157" class="eyebrow">01  量化组到 lane 的映射</text>
  <rect x="60" y="180" width="1480" height="176" rx="16" fill="#f7f9fc" stroke="#ced7e2" stroke-width="2"/>
  <text x="84" y="216" class="section">一个量化组包含 64 个值</text>
  <text x="1516" y="216" text-anchor="end" class="small">一个 wave32 同时承载两个独立的 16-lane 组</text>
  <g transform="translate(84 246)">
    <rect width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="90" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="180" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="270" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="360" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="450" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="540" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="630" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="720" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="810" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="900" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="990" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="1080" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="1170" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="1260" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="1350" width="82" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <g text-anchor="middle"><text x="42" y="30" class="mono">L0</text><text x="132" y="30" class="mono">L1</text><text x="222" y="30" class="mono">L2</text><text x="312" y="30" class="mono">L3</text><text x="402" y="30" class="mono">L4</text><text x="492" y="30" class="mono">L5</text><text x="582" y="30" class="mono">L6</text><text x="672" y="30" class="mono">L7</text><text x="762" y="30" class="mono">L8</text><text x="852" y="30" class="mono">L9</text><text x="942" y="30" class="mono">L10</text><text x="1032" y="30" class="mono">L11</text><text x="1122" y="30" class="mono">L12</text><text x="1212" y="30" class="mono">L13</text><text x="1302" y="30" class="mono">L14</text><text x="1391" y="30" class="mono">L15</text>
    <text x="42" y="56" class="small">4 个值</text><text x="132" y="56" class="small">4 个值</text><text x="222" y="56" class="small">4 个值</text><text x="312" y="56" class="small">4 个值</text><text x="402" y="56" class="small">4 个值</text><text x="492" y="56" class="small">4 个值</text><text x="582" y="56" class="small">4 个值</text><text x="672" y="56" class="small">4 个值</text><text x="762" y="56" class="small">4 个值</text><text x="852" y="56" class="small">4 个值</text><text x="942" y="56" class="small">4 个值</text><text x="1032" y="56" class="small">4 个值</text><text x="1122" y="56" class="small">4 个值</text><text x="1212" y="56" class="small">4 个值</text><text x="1302" y="56" class="small">4 个值</text><text x="1391" y="56" class="small">4 个值</text></g>
  </g>

  <text x="60" y="407" class="eyebrow">02  协作量化流程</text>
  <rect x="60" y="430" width="440" height="360" rx="16" class="card"/>
  <text x="84" y="469" class="section">只加载一次，在寄存器中保留 4 个值</text>
  <rect x="96" y="512" width="368" height="82" rx="10" fill="#e8f1fb" stroke="#c3d5e7"/>
  <text x="280" y="546" text-anchor="middle" class="mono">v[4] = x / smooth</text><text x="280" y="575" text-anchor="middle" class="small">每个 lane 使用 4 个 FP32 寄存器</text>
  <path d="M280 594 V636" class="flow"/>
  <rect x="96" y="648" width="368" height="82" rx="10" fill="#e8f5f1" stroke="#bed9d1"/>
  <text x="280" y="683" text-anchor="middle" class="label">局部 absmax(v[0..3])</text><text x="280" y="712" text-anchor="middle" class="small">后续量化继续复用这些值</text>

  <path d="M500 610 H536" class="flow"/>
  <rect x="548" y="430" width="476" height="360" rx="16" class="card"/>
  <text x="572" y="469" class="section">宽度为 16 的 shuffle 归约</text>
  <text x="572" y="500" class="small">每一步只交换当前最大值</text>
  <g transform="translate(588 532)">
    <rect width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="56" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="112" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="168" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <text x="20" y="29" class="mono">offset 8</text><text x="380" y="29" text-anchor="end" class="small">合并前后两半</text><text x="20" y="85" class="mono">offset 4</text><text x="20" y="141" class="mono">offset 2</text><text x="20" y="197" class="mono">offset 1</text>
  </g>
  <text x="572" y="766" class="body">结果：64 个值共享同一个 absmax。</text>

  <path d="M1024 610 H1060" class="flow"/>
  <rect x="1072" y="430" width="468" height="360" rx="16" class="card"/>
  <text x="1096" y="469" class="section">计算 scale、量化并打包</text>
  <rect x="1110" y="515" width="392" height="62" rx="9" fill="#fff1e5" stroke="#e4c7ad"/><text x="1306" y="541" text-anchor="middle" class="mono" style="font-size:15px">a = max(absmax, 1e-10)</text><text x="1306" y="565" text-anchor="middle" class="mono" style="font-size:15px">scale = a / qmax</text>
  <path d="M1306 577 V613" class="flow"/>
  <rect x="1110" y="625" width="392" height="62" rx="9" fill="#e8f5f1" stroke="#bed9d1"/><text x="1306" y="663" text-anchor="middle" class="mono">q0 · q1 · q2 · q3</text>
  <path d="M1306 687 V721" class="flow"/>
  <rect x="1110" y="733" width="392" height="40" rx="8" fill="#f0edfa" stroke="#d7c9e5"/><text x="1306" y="759" text-anchor="middle" class="mixed">每个 lane 一次 uint16 store</text>

  <line x1="60" y1="846" x2="1540" y2="846" stroke="#d4dfea"/>
  <text x="60" y="886" class="label" fill="#187264">16 lanes × 4 个值 = 64 个值</text>
  <text x="445" y="886" class="body">共享一个 scale；16 次打包写回恰好生成 32 Byte 输出。</text>
  <text x="60" y="930" class="small">该 PR 的核心是 16-lane 协作量化器；LoRA-down 路径恢复使用 torch.mm。</text>
</svg>
