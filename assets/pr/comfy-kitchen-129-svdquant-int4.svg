<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Sixteen lanes cooperatively quantize one sixty-four-value SVDQuant group</title>
  <desc id="desc">Each lane keeps four values in registers, participates in a width-sixteen shuffle reduction for the shared absolute maximum, then quantizes and packs four INT4 nibbles into one uint16 store.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto"><path d="M1 1.5 L10.5 6 L1 10.5" fill="none" stroke="#2964a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.subtitle{font-size:22px;fill:#52677d}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.2px;fill:#2865b3}.section{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#607187}.mono{font-family:"DejaVu Sans Mono",monospace;font-size:18px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.flow{fill:none;stroke:#2964a4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
  <rect width="1600" height="960" fill="#fbfcfe"/>
  <rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">SVDQuant INT4: one group, sixteen cooperating lanes</text>
  <text x="48" y="101" class="subtitle">64 values → 16 lanes × 4 registers → shared absmax → one uint16 store per lane</text>
  <text x="1552" y="62" text-anchor="end" class="small">COMFY-KITCHEN / PR 129</text>

  <text x="60" y="157" class="eyebrow">01  GROUP-TO-LANE MAPPING</text>
  <rect x="60" y="180" width="1480" height="176" rx="16" fill="#f7f9fc" stroke="#ced7e2" stroke-width="2"/>
  <text x="84" y="216" class="section">One 64-value quantization group</text>
  <text x="1516" y="216" text-anchor="end" class="small">wave32 carries two independent width-16 groups</text>
  <g transform="translate(84 246)">
    <rect width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="90" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="180" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="270" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="360" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="450" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="540" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="630" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="720" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="810" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="900" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="990" width="84" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <rect x="1080" width="84" height="72" rx="7" fill="#e8f1fb" stroke="#c3d5e7"/><rect x="1170" width="84" height="72" rx="7" fill="#e8f5f1" stroke="#bed9d1"/><rect x="1260" width="84" height="72" rx="7" fill="#fff1e5" stroke="#e4c7ad"/><rect x="1350" width="82" height="72" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <g text-anchor="middle"><text x="42" y="30" class="mono">L0</text><text x="132" y="30" class="mono">L1</text><text x="222" y="30" class="mono">L2</text><text x="312" y="30" class="mono">L3</text><text x="402" y="30" class="mono">L4</text><text x="492" y="30" class="mono">L5</text><text x="582" y="30" class="mono">L6</text><text x="672" y="30" class="mono">L7</text><text x="762" y="30" class="mono">L8</text><text x="852" y="30" class="mono">L9</text><text x="942" y="30" class="mono">L10</text><text x="1032" y="30" class="mono">L11</text><text x="1122" y="30" class="mono">L12</text><text x="1212" y="30" class="mono">L13</text><text x="1302" y="30" class="mono">L14</text><text x="1391" y="30" class="mono">L15</text>
    <text x="42" y="56" class="small">4 vals</text><text x="132" y="56" class="small">4 vals</text><text x="222" y="56" class="small">4 vals</text><text x="312" y="56" class="small">4 vals</text><text x="402" y="56" class="small">4 vals</text><text x="492" y="56" class="small">4 vals</text><text x="582" y="56" class="small">4 vals</text><text x="672" y="56" class="small">4 vals</text><text x="762" y="56" class="small">4 vals</text><text x="852" y="56" class="small">4 vals</text><text x="942" y="56" class="small">4 vals</text><text x="1032" y="56" class="small">4 vals</text><text x="1122" y="56" class="small">4 vals</text><text x="1212" y="56" class="small">4 vals</text><text x="1302" y="56" class="small">4 vals</text><text x="1391" y="56" class="small">4 vals</text></g>
  </g>

  <text x="60" y="407" class="eyebrow">02  COOPERATIVE QUANTIZATION</text>
  <rect x="60" y="430" width="440" height="360" rx="16" class="card"/>
  <text x="84" y="469" class="section">Load once; retain four values</text>
  <rect x="96" y="512" width="368" height="82" rx="10" fill="#e8f1fb" stroke="#c3d5e7"/>
  <text x="280" y="546" text-anchor="middle" class="mono">v[4] = x / smooth</text><text x="280" y="575" text-anchor="middle" class="small">four FP32 registers per lane</text>
  <path d="M280 594 V636" class="flow"/>
  <rect x="96" y="648" width="368" height="82" rx="10" fill="#e8f5f1" stroke="#bed9d1"/>
  <text x="280" y="683" text-anchor="middle" class="label">local absmax(v[0..3])</text><text x="280" y="712" text-anchor="middle" class="small">the same values are reused later</text>

  <path d="M500 610 H536" class="flow"/>
  <rect x="548" y="430" width="476" height="360" rx="16" class="card"/>
  <text x="572" y="469" class="section">Width-16 shuffle reduction</text>
  <text x="572" y="500" class="small">Each step exchanges only the running maximum.</text>
  <g transform="translate(588 532)">
    <rect width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="56" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="112" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/><rect y="168" width="400" height="44" rx="7" fill="#f0edfa" stroke="#d7c9e5"/>
    <text x="20" y="29" class="mono">offset 8</text><text x="380" y="29" text-anchor="end" class="small">pair the two halves</text><text x="20" y="85" class="mono">offset 4</text><text x="20" y="141" class="mono">offset 2</text><text x="20" y="197" class="mono">offset 1</text>
  </g>
  <text x="572" y="766" class="body">Result: one shared absmax for all 64 values.</text>

  <path d="M1024 610 H1060" class="flow"/>
  <rect x="1072" y="430" width="468" height="360" rx="16" class="card"/>
  <text x="1096" y="469" class="section">Scale, quantize, and pack</text>
  <rect x="1110" y="515" width="392" height="62" rx="9" fill="#fff1e5" stroke="#e4c7ad"/><text x="1306" y="541" text-anchor="middle" class="mono" style="font-size:15px">a = max(absmax, 1e-10)</text><text x="1306" y="565" text-anchor="middle" class="mono" style="font-size:15px">scale = a / qmax</text>
  <path d="M1306 577 V613" class="flow"/>
  <rect x="1110" y="625" width="392" height="62" rx="9" fill="#e8f5f1" stroke="#bed9d1"/><text x="1306" y="663" text-anchor="middle" class="mono">q0 · q1 · q2 · q3</text>
  <path d="M1306 687 V721" class="flow"/>
  <rect x="1110" y="733" width="392" height="40" rx="8" fill="#f0edfa" stroke="#d7c9e5"/><text x="1306" y="759" text-anchor="middle" class="mono">one uint16 store / lane</text>

  <line x1="60" y1="846" x2="1540" y2="846" stroke="#d4dfea"/>
  <text x="60" y="886" class="label" fill="#187264">16 lanes × 4 values = 64 values</text>
  <text x="445" y="886" class="body">One scale is shared; sixteen packed stores still produce exactly 32 output bytes.</text>
  <text x="60" y="930" class="small">The PR's main change is the cooperative 16-lane quantizer; LoRA-down returns to torch.mm.</text>
</svg>
