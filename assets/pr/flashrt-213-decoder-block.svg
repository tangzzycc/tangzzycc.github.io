<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">一个 Pi0.5 Action Expert Layer</title><desc id="desc">Decoder layer 先执行 AdaRMS 与 QKV 投影，读取持久 Prefix K/V 和当前 Suffix K/V，再依次完成 attention gated residual、Merged gate/up GeGLU 与第二次 gated residual。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#8051aa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.fp{fill:none;stroke:#8051aa;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#p)}</style>
  <rect width="1500" height="800" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">一个 Action Expert Layer：两次 Gated Residual</text><text x="44" y="96" class="sub">1024 维 residual stream 只通过 256 维 Q/K/V head 接收 2048 维 Attention context。</text>
  <text x="44" y="142" class="eye">01  Attention 子层</text><rect x="44" y="164" width="1412" height="264" rx="16" class="card"/>
  <rect x="72" y="212" width="180" height="88" rx="10" class="blue"/><text x="162" y="244" text-anchor="middle" class="h">decoder_x</text><text x="162" y="273" text-anchor="middle" class="m">[H,1024]</text>
  <path d="M252 256H300" class="f"/><rect x="312" y="194" width="216" height="124" rx="10" class="green"/><text x="420" y="226" text-anchor="middle" class="h">AdaRMS(attn)</text><text x="420" y="257" text-anchor="middle" class="m">norm [H,1024]</text><text x="420" y="286" text-anchor="middle" class="s">返回 Attention gate</text>
  <path d="M528 256H576" class="f"/><rect x="588" y="194" width="218" height="124" rx="10" class="purple"/><text x="697" y="226" text-anchor="middle" class="h">QKV + RoPE</text><text x="697" y="257" text-anchor="middle" class="m">Q [H,8,256]</text><text x="697" y="286" text-anchor="middle" class="m">suffix K/V [H,1,256]</text>
  <path d="M806 256H854" class="f"/><rect x="866" y="184" width="260" height="144" rx="10" class="orange"/><text x="996" y="216" text-anchor="middle" class="h">GQA</text><text x="996" y="247" text-anchor="middle" class="m">K/V = [Prefix | Suffix]</text><text x="996" y="278" text-anchor="middle" class="m">context [H,8,256]</text><text x="996" y="305" text-anchor="middle" class="s">所有 Action token 共享同一 block</text>
  <path d="M1126 256H1174" class="f"/><rect x="1186" y="194" width="242" height="124" rx="10" class="purple"/><text x="1307" y="226" text-anchor="middle" class="h">O Projection</text><text x="1307" y="257" text-anchor="middle" class="m">[H,2048] → [H,1024]</text><text x="1307" y="286" text-anchor="middle" class="s">Attention 更新 uₐ</text>
  <path d="M996 184V154H1140V184" class="fp"/><text x="1068" y="145" text-anchor="middle" class="s">逐层 Prefix K/V Cache</text>
  <path d="M420 318V374H1240V318" class="fp"/><text x="830" y="397" text-anchor="middle" class="b">Gated Residual：decoder_x ← BF16(decoder_x + gateₐ ⊙ uₐ)</text>
  <text x="44" y="482" class="eye">02  FFN 子层</text><rect x="44" y="504" width="1412" height="222" rx="16" class="card"/>
  <rect x="72" y="552" width="238" height="106" rx="10" class="green"/><text x="191" y="583" text-anchor="middle" class="h">AdaRMS(FFN)</text><text x="191" y="612" text-anchor="middle" class="m">norm [H,1024]</text><text x="191" y="638" text-anchor="middle" class="s">返回 FFN gate</text>
  <path d="M310 605H360" class="f"/><rect x="372" y="542" width="262" height="126" rx="10" class="purple"/><text x="503" y="574" text-anchor="middle" class="h">Merged gate / up</text><text x="503" y="605" text-anchor="middle" class="m">[H,1024] × [1024,8192]</text><text x="503" y="636" text-anchor="middle" class="m">[gate | up] = [H,8192]</text>
  <path d="M634 605H684" class="f"/><rect x="696" y="552" width="210" height="106" rx="10" class="orange"/><text x="801" y="583" text-anchor="middle" class="h">GeGLU</text><text x="801" y="614" text-anchor="middle" class="m">GELU(gate) ⊙ up</text><text x="801" y="640" text-anchor="middle" class="s">[H,4096]</text>
  <path d="M906 605H956" class="f"/><rect x="968" y="552" width="210" height="106" rx="10" class="purple"/><text x="1073" y="583" text-anchor="middle" class="h">Down Projection</text><text x="1073" y="614" text-anchor="middle" class="m">4096 → 1024</text><text x="1073" y="640" text-anchor="middle" class="s">FFN 更新 u_f</text>
  <path d="M1178 605H1228" class="f"/><rect x="1240" y="542" width="188" height="126" rx="10" class="blue"/><text x="1334" y="574" text-anchor="middle" class="h">下一状态</text><text x="1334" y="605" text-anchor="middle" class="m">x + gate_f ⊙ u_f</text><text x="1334" y="636" text-anchor="middle" class="s">下一层或 Final Norm</text>
  <text x="44" y="764" class="s">AdaRMS gate 属于后续 Residual 更新，不是当前 kernel 内额外应用的归一化参数。</text>
</svg>
