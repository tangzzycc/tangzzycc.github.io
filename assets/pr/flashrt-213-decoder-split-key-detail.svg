<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Split-key Attention 细节</title><desc id="desc">8 个 wave32 共享一条 Query row 和一个 head，交错处理不同 Key group，维护局部 Online Softmax 状态，写入 LDS 后由 wave 0 按固定顺序缩放并合并。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="820" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Decoder Attention：切分 Key 轴，再合并 Softmax 状态</text><text x="44" y="96" class="sub">一个 block 拥有一个 (query row, query head)，8 个 wave 协作生成同一份 256 维输出。</text>
  <text x="44" y="142" class="eye">01  交错的 Key 所有权</text><rect x="44" y="164" width="1412" height="288" rx="16" class="card"/>
  <rect x="72" y="206" width="240" height="168" rx="10" class="blue"/><text x="192" y="238" text-anchor="middle" class="h">共享 Query</text><text x="192" y="272" text-anchor="middle" class="m">Q[row, head, 256]</text><text x="192" y="306" text-anchor="middle" class="s">32 lanes × 连续 8 维</text><text x="192" y="340" text-anchor="middle" class="s">供本 wave 的所有 Key 复用</text><path d="M312 290H366" class="f"/>
  <rect x="378" y="194" width="668" height="192" rx="11" class="green"/><text x="712" y="226" text-anchor="middle" class="h">8 个 Wave 遍历互不重叠的 Key group</text>
  <g transform="translate(410 258)"><rect x="0" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="74" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="148" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="222" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="296" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="370" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="444" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/><rect x="518" width="64" height="58" rx="7" fill="#d9eee7" stroke="#8fc2b1"/></g>
  <g class="m" text-anchor="middle"><text x="442" y="293">w0</text><text x="516" y="293">w1</text><text x="590" y="293">w2</text><text x="664" y="293">w3</text><text x="738" y="293">w4</text><text x="812" y="293">w5</text><text x="886" y="293">w6</text><text x="960" y="293">w7</text></g>
  <text x="712" y="350" text-anchor="middle" class="m">wave i：Key = i·KPI + 8·KPI·t … i·KPI + 8·KPI·t + KPI−1</text>
  <path d="M1046 290H1100" class="f"/><rect x="1112" y="194" width="316" height="192" rx="11" class="purple"/><text x="1270" y="226" text-anchor="middle" class="h">每个 Wave 的 Online 状态</text><text x="1270" y="266" text-anchor="middle" class="m">m_i = 局部最大值</text><text x="1270" y="300" text-anchor="middle" class="m">l_i = 局部分母</text><text x="1270" y="334" text-anchor="middle" class="m">o_i[256] = 局部输出</text><text x="1270" y="366" text-anchor="middle" class="s">各 Wave 不读取其他 Wave 的 Key</text>
  <text x="44" y="506" class="eye">02  写入 LDS，再按固定顺序合并</text><rect x="44" y="528" width="1412" height="224" rx="16" class="card"/>
  <rect x="72" y="570" width="320" height="130" rx="10" class="purple"/><text x="232" y="602" text-anchor="middle" class="h">LDS 局部状态</text><text x="232" y="638" text-anchor="middle" class="m">{m_i, l_i, o_i[256]} × 8</text><text x="232" y="672" text-anchor="middle" class="s">所有 Wave 发布后执行一次 Block Barrier</text><path d="M392 635H446" class="f"/>
  <rect x="458" y="554" width="602" height="162" rx="11" class="orange"/><text x="759" y="586" text-anchor="middle" class="h">Wave 0 缩放并按 Wave 0 → 7 合并</text><text x="488" y="626" class="m">m = max_i(m_i)</text><text x="488" y="660" class="m">α_i = 2^(m_i − m)</text><text x="740" y="626" class="m">l = Σ_i α_i·l_i</text><text x="740" y="660" class="m">o = (Σ_i α_i·o_i) / l</text><text x="759" y="696" text-anchor="middle" class="s">Correction Factor 将所有局部分子换到同一指数尺度</text><path d="M1060 635H1114" class="f"/>
  <rect x="1126" y="570" width="302" height="130" rx="10" class="blue"/><text x="1277" y="602" text-anchor="middle" class="h">一份 BF16 Context</text><text x="1277" y="638" text-anchor="middle" class="m">O[row, head, 256]</text><text x="1277" y="672" text-anchor="middle" class="s">无需 Atomic 或 Global Workspace</text>
  <text x="44" y="790" class="s">KPI 只改变循环粒度和 load ILP，不改变哪些有效 Prefix/Suffix Key 参与结果。</text>
</svg>
