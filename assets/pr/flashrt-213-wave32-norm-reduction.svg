<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Wave32 Block Reduction 与固定宽度 Register 所有权</title><desc id="desc">一个 256-thread Norm Block 包含 8 个 wave32。每个 Wave 先局部归约，由 lane 0 向 LDS 写入一份 partial；随后所有 Wave 各自重复一次 8-lane reduction，无需第二次 Block Barrier 即可得到完整统计量。固定宽度 Kernel 让每个线程把若干 BF16 Pair 保留在 Register 中。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"Noto Sans CJK SC","LXGW WenKai GB Screen",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:"Noto Sans Mono CJK SC",Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="780" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">256-thread Norm Block：只需一次 LDS 汇合</text><text x="44" y="96" class="sub">Wave 内 Shuffle 先产生 8 份 Partial；每个 Wave 再从这 8 个值重建同一份 Block 统计量。</text>
  <text x="44" y="142" class="eye">01  两级 Reduction</text><rect x="44" y="164" width="1412" height="342" rx="16" class="card"/>
  <rect x="72" y="204" width="360" height="250" rx="11" class="blue"/><text x="252" y="236" text-anchor="middle" class="h">256 threads = 8 Waves</text>
  <g transform="translate(102 264)"><rect x="0" y="0" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="28" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="56" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="84" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="112" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="140" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="168" width="300" height="22" rx="5" fill="#dceafb"/><rect x="0" y="196" width="300" height="22" rx="5" fill="#dceafb"/></g><text x="252" y="480" text-anchor="middle" class="s">每条横带 = 32 lanes；Shuffle offset 为 16、8、4、2、1</text>
  <path d="M432 329H486" class="f"/><rect x="498" y="214" width="314" height="230" rx="11" class="green"/><text x="655" y="246" text-anchor="middle" class="h">LDS wave_sums[0…7]</text>
  <g transform="translate(534 282)"><rect x="0" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="34" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="68" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="102" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="136" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="170" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="204" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/><rect x="238" width="28" height="54" rx="5" fill="#d9eee7" stroke="#8fc2b1"/></g><text x="655" y="370" text-anchor="middle" class="b">每个 Wave 的 lane 0 写一份 partial</text><text x="655" y="400" text-anchor="middle" class="m">__syncthreads() × 1</text><text x="655" y="426" text-anchor="middle" class="s">全部 partial 对整个 Block 可见</text>
  <path d="M812 329H866" class="f"/><rect x="878" y="214" width="270" height="230" rx="11" class="purple"/><text x="1013" y="246" text-anchor="middle" class="h">每个 Wave 重复归约</text><text x="1013" y="286" text-anchor="middle" class="m">lanes 0…7 加载 partial</text><text x="1013" y="320" text-anchor="middle" class="m">执行 8-lane Reduction</text><text x="1013" y="354" text-anchor="middle" class="m">Shuffle 广播 lane 0</text><text x="1013" y="400" text-anchor="middle" class="s">少量重复计算换掉第二次</text><text x="1013" y="424" text-anchor="middle" class="s">Block 级同步</text>
  <path d="M1148 329H1202" class="f"/><rect x="1214" y="238" width="214" height="182" rx="11" class="orange"/><text x="1321" y="270" text-anchor="middle" class="h">Block 统计量</text><text x="1321" y="310" text-anchor="middle" class="m">sum / sumsq</text><text x="1321" y="344" text-anchor="middle" class="m">mean / RMS</text><text x="1321" y="386" text-anchor="middle" class="s">8 个 Wave 均可使用</text>
  <text x="44" y="558" class="eye">02  固定宽度 Kernel 将整行留在 Register</text><rect x="44" y="580" width="1412" height="146" rx="16" class="card"/>
  <rect x="72" y="610" width="400" height="84" rx="10" class="blue"/><text x="272" y="641" text-anchor="middle" class="h">Vision LayerNorm · width 1152</text><text x="272" y="672" text-anchor="middle" class="m">64 threads → 每线程 9 个 BF16 Pair</text>
  <rect x="550" y="610" width="400" height="84" rx="10" class="green"/><text x="750" y="641" text-anchor="middle" class="h">Encoder RMSNorm · width 2048</text><text x="750" y="672" text-anchor="middle" class="m">64 threads → 每线程 16 个 BF16 Pair</text>
  <rect x="1028" y="610" width="400" height="84" rx="10" class="purple"/><text x="1228" y="641" text-anchor="middle" class="h">Residual RMS · width 2048</text><text x="1228" y="672" text-anchor="middle" class="m">256 threads → 每线程 4 个 BF16 Pair</text>
  <text x="44" y="758" class="s">Register 所有权让后续方差与归一化阶段复用数值；通用宽度 Kernel 需要遍历列，并可能重新读取已舍入的 residual。</text>
</svg>
