<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Encoder Attention 的 Wave-pair Tile</title><desc id="desc">一个 wave pair 负责一个 Query head 的 16 行，并迭代 16-key tile：V 转置进 LDS，leader wave 用 16 次 WMMA 生成 16×16 QK tile，Online Softmax 发布概率与 correction factor，两个 wave 分摊 256 个输出维度。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto"><path d="M0 .6L5.4 3 0 5.4" fill="none" stroke="#2865a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#52677d}.eye{font-size:17px;font-weight:700;fill:#2865b3}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:15px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.4}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.4}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.4}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.4}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.4}.f{fill:none;stroke:#2865a8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
  <rect width="1500" height="850" fill="#fbfcfe"/><rect x="44" y="32" width="6" height="36" rx="3" fill="#e65b3d"/>
  <text x="66" y="63" class="title">Encoder Attention：一个 Wave Pair 跨 KV Tile 持有 Query Tile</text><text x="44" y="96" class="sub">固定示例：16 行 Query × 1 个 head，head_dim=256，当前 KV tile 为 16 行。</text>
  <text x="44" y="142" class="eye">01  加载并计算一个 16-Key Tile</text><rect x="44" y="164" width="1412" height="292" rx="16" class="card"/>
  <rect x="72" y="210" width="230" height="174" rx="10" class="blue"/><text x="187" y="242" text-anchor="middle" class="h">Query Tile</text><text x="187" y="276" text-anchor="middle" class="m">Q [16,256]</text><text x="187" y="310" text-anchor="middle" class="s">当前 Query head / row tile</text><text x="187" y="334" text-anchor="middle" class="s">跨所有 KV tile 保留</text><text x="187" y="366" text-anchor="middle" class="m">rows q₀…q₁₅</text>
  <rect x="350" y="210" width="230" height="174" rx="10" class="green"/><text x="465" y="242" text-anchor="middle" class="h">当前 K Tile</text><text x="465" y="276" text-anchor="middle" class="m">K [16,256]</text><text x="465" y="310" text-anchor="middle" class="s">16 个 Key × 256 维</text><text x="465" y="350" text-anchor="middle" class="m">k₀…k₁₅</text>
  <path d="M302 294H630" class="f"/><path d="M580 294H630" class="f"/>
  <rect x="642" y="196" width="330" height="202" rx="11" class="purple"/><text x="807" y="228" text-anchor="middle" class="h">Leader Wave · QK</text><text x="807" y="264" text-anchor="middle" class="m">沿 D 执行 16 次 WMMA</text><text x="807" y="297" text-anchor="middle" class="m">16 × (16×16×16)</text><text x="807" y="332" text-anchor="middle" class="m">scores [16,16]</text><text x="807" y="369" text-anchor="middle" class="s">Online Softmax 前应用 scale 与 mask</text>
  <path d="M972 297H1026" class="f"/><rect x="1038" y="196" width="390" height="202" rx="11" class="orange"/><text x="1233" y="228" text-anchor="middle" class="h">更新 Online Softmax</text><text x="1066" y="266" class="m">m' = max(m, rowmax(scores))</text><text x="1066" y="300" class="m">α  = 2^(m − m')</text><text x="1066" y="334" class="m">l' = α·l + Σ exp₂(score−m')</text><text x="1066" y="370" class="s">通过 LDS 发布 P tile 与 α</text>
  <text x="44" y="510" class="eye">02  V 只转置一次，再拆分输出维度</text><rect x="44" y="532" width="1412" height="250" rx="16" class="card"/>
  <rect x="72" y="576" width="260" height="150" rx="10" class="green"/><text x="202" y="608" text-anchor="middle" class="h">Global Memory 中的 V Tile</text><text x="202" y="642" text-anchor="middle" class="m">V [16 keys,256 dims]</text><text x="202" y="678" text-anchor="middle" class="s">Row-major Key 向量</text>
  <path d="M332 651H386" class="f"/><rect x="398" y="566" width="300" height="170" rx="10" class="purple"/><text x="548" y="598" text-anchor="middle" class="h">LDS 转置</text><text x="548" y="632" text-anchor="middle" class="m">Vᵀ [256,20]</text><text x="548" y="666" text-anchor="middle" class="s">16 个有效值 + padded pitch</text><text x="548" y="700" text-anchor="middle" class="s">由两个 wave 共享</text>
  <path d="M698 651H752" class="f"/><rect x="764" y="556" width="410" height="190" rx="11" class="blue"/><text x="969" y="588" text-anchor="middle" class="h">带 correction α 的 P × V</text><rect x="792" y="620" width="160" height="82" rx="8" class="gray"/><text x="872" y="650" text-anchor="middle" class="b">Wave 0</text><text x="872" y="679" text-anchor="middle" class="m">维度 0…127</text><rect x="986" y="620" width="160" height="82" rx="8" class="gray"/><text x="1066" y="650" text-anchor="middle" class="b">Wave 1</text><text x="1066" y="679" text-anchor="middle" class="m">维度 128…255</text><text x="969" y="728" text-anchor="middle" class="s">FP32 output accumulator 跨所有 KV tile 保留在 register</text>
  <path d="M1174 651H1228" class="f"/><rect x="1240" y="576" width="188" height="150" rx="10" class="orange"/><text x="1334" y="608" text-anchor="middle" class="h">最终输出</text><text x="1334" y="642" text-anchor="middle" class="m">O [16,256]</text><text x="1334" y="678" text-anchor="middle" class="s">除以 l</text><text x="1334" y="704" text-anchor="middle" class="s">写回 BF16</text>
  <text x="44" y="824" class="s">16-key tile 是算法迭代单位；图中的 Wave-pair 所有权才是 gfx1151 的实际执行映射。</text>
</svg>
