<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">FlashRT Pi0.5 frontend 与 pipeline 分层</title>
  <desc id="desc">从公开 API、RDNA frontend、共享 Pi0.5 pipeline 到 tensor、attention、GEMM provider，再输出机器人动作。下半部分对比 OpenPI 动态 PyTorch 组织与 FlashRT 静态执行计划。</desc>
  <defs>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#2a65a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .8L7 4 0 7.2" fill="none" stroke="#218367" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>@font-face{font-family:"LXGW WenKai GB Screen";src:url("../fonts/LXGWWenKaiGBScreen.ttf")}text{font-family:"LXGW WenKai GB Screen","Noto Sans CJK SC",sans-serif;fill:#172e46}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#52677d}.eye{font-size:18px;font-weight:700;fill:#2865b3}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#607187}.m{font-family:Consolas,"LXGW WenKai GB Screen",monospace;font-size:16px}.card{fill:#fff;stroke:#ced7e2;stroke-width:2}.blue{fill:#e8f1fb;stroke:#a9c4df;stroke-width:1.5}.green{fill:#e8f5f1;stroke:#a9d1c5;stroke-width:1.5}.purple{fill:#f0edfa;stroke:#cfbee1;stroke-width:1.5}.orange{fill:#fff1e5;stroke:#e4c7ad;stroke-width:1.5}.gray{fill:#f5f7fa;stroke:#ced7e2;stroke-width:1.5}.fb{fill:none;stroke:#2a65a8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ab)}.fg{fill:none;stroke:#218367;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ag)}</style>
  <rect width="1600" height="1040" fill="#fbfcfe"/><rect x="48" y="34" width="6" height="39" rx="3" fill="#e65b3d"/>
  <text x="70" y="66" class="title">FlashRT Pi0.5：模型遍历只有一份，硬件实现按 Provider 注入</text>
  <text x="48" y="101" class="sub">Frontend 处理外部契约 · Pipeline 持有执行顺序 · RDNA 后端只实现算子</text><text x="1550" y="62" text-anchor="end" class="s">FlashRT / PR 213</text>
  <text x="48" y="151" class="eye">01  一次 predict() 如何到达动作输出</text>
  <rect x="48" y="176" width="1504" height="354" rx="16" class="card"/>
  <rect x="76" y="214" width="220" height="116" rx="12" class="blue"/><text x="186" y="248" text-anchor="middle" class="h">公开 API</text><text x="186" y="278" text-anchor="middle" class="m">VLAModel.predict()</text><text x="186" y="305" text-anchor="middle" class="s">images · prompt · state</text>
  <path d="M296 272H350" class="fb"/>
  <rect x="362" y="214" width="270" height="116" rx="12" class="green"/><text x="497" y="248" text-anchor="middle" class="h">RDNA Frontend</text><text x="497" y="278" text-anchor="middle" class="s">checkpoint · schema · normalization</text><text x="497" y="305" text-anchor="middle" class="m">gfx1151 · BF16</text>
  <path d="M632 272H686" class="fg"/>
  <rect x="698" y="200" width="306" height="144" rx="12" class="purple"/><text x="851" y="239" text-anchor="middle" class="h">共享 Pi05TorchPipeline</text><text x="851" y="272" text-anchor="middle" class="b">Vision → Prefix Encoder</text><text x="851" y="301" text-anchor="middle" class="b">→ 10-step Action Decoder</text><text x="851" y="327" text-anchor="middle" class="s">预分配 buffer · 显式 layer loop</text>
  <path d="M1004 272H1058" class="fb"/>
  <rect x="1070" y="214" width="244" height="116" rx="12" class="orange"/><text x="1192" y="248" text-anchor="middle" class="h">Provider</text><text x="1192" y="278" text-anchor="middle" class="s">Tensor Ops · Attention</text><text x="1192" y="305" text-anchor="middle" class="s">GEMM / hipBLASLt / HIP</text>
  <path d="M1314 272H1368" class="fb"/>
  <rect x="1380" y="214" width="144" height="116" rx="12" class="gray"/><text x="1452" y="252" text-anchor="middle" class="h">Actions</text><text x="1452" y="282" text-anchor="middle" class="m">[H, D]</text><text x="1452" y="307" text-anchor="middle" class="s">反归一化</text>
  <rect x="76" y="385" width="430" height="104" rx="10" class="gray"/><text x="96" y="418" class="h">Frontend 约束</text><text x="96" y="449" class="s">2/3 views · uint8 224² · prompt≤200 · action_dim≤32</text><text x="96" y="475" class="s">num_steps 改变时同步重建 time table 与 Δt</text>
  <rect x="536" y="385" width="484" height="104" rx="10" class="gray"/><text x="556" y="418" class="h">Pipeline 状态</text><text x="556" y="449" class="s">prefix K/V 持久保存 · suffix K/V 写入尾部</text><text x="556" y="475" class="s">prompt length 决定当前 HIP Graph capture</text>
  <rect x="1050" y="385" width="474" height="104" rx="10" class="gray"/><text x="1070" y="418" class="h">Provider 边界</text><text x="1070" y="449" class="s">不重写 Vision/Encoder/Decoder traversal</text><text x="1070" y="475" class="s">Torch reference 与 RDNA 使用相同 tensor contract</text>
  <text x="48" y="590" class="eye">02  同一模型语义，两种运行时组织</text>
  <rect x="48" y="616" width="724" height="340" rx="16" class="card"/><rect x="76" y="646" width="668" height="54" rx="9" class="blue"/><text x="410" y="681" text-anchor="middle" class="h">OpenPI PyTorch</text>
  <text x="90" y="743" class="b">Hugging Face modules</text><path d="M286 737H348" class="fb"/><text x="366" y="743" class="b">动态 tensor / mask</text><path d="M548 737H610" class="fb"/><text x="628" y="743" class="b">Python Euler loop</text>
  <rect x="90" y="785" width="640" height="126" rx="10" class="gray"/><text x="112" y="820" class="m">embed_prefix() → past_key_values</text><text x="112" y="855" class="m">while t ≥ 0: embed_suffix(); model(); x += dt·v</text><text x="112" y="890" class="s">适合训练、研究和动态调试</text>
  <rect x="800" y="616" width="752" height="340" rx="16" class="card"/><rect x="828" y="646" width="696" height="54" rx="9" class="green"/><text x="1176" y="681" text-anchor="middle" class="h">FlashRT RDNA 3.5</text>
  <text x="844" y="743" class="b">固定 buffer</text><path d="M966 737H1028" class="fg"/><text x="1046" y="743" class="b">显式 layer loop</text><path d="M1202 737H1264" class="fg"/><text x="1282" y="743" class="b">完整 HIP Graph</text>
  <rect x="844" y="785" width="652" height="126" rx="10" class="gray"/><text x="866" y="820" class="m">_vision() → _encoder() → _decoder()</text><text x="866" y="855" class="m">provider.linear / provider.gqa / fused tensor ops</text><text x="866" y="890" class="s">固定 profile 更严格，但执行边界与内存生命周期明确</text>
  <text x="48" y="1004" class="s">Portable provider 是同一 pipeline 的 contract/reference 实现；独立 OpenPI fixture 才能作为外部模型正确性证据。</text>
</svg>
