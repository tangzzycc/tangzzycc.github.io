<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="410" viewBox="0 0 1010 410" role="img" aria-describedby="desc"><desc id="desc">The same Request placeholder counter is incremented by two scheduling steps and decremented by ModelRunnerOutput.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#263342" stroke-width="1.6"/></marker><marker id="green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#438958" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#347398" stroke-width="1.6"/></marker></defs><style>@font-face{font-family:MRV2Figure;src:url(data:font/woff;base64,) format("woff");}text{font-family:MRV2Figure,"LXGW WenKai GB Screen",sans-serif;}</style><rect width="1010" height="410" fill="white"/><text x="24" y="38" font-size="24" fill="#263342" text-anchor="start" dominant-baseline="central">Request</text>
